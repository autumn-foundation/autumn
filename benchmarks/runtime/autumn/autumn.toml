[server]
host = "0.0.0.0"
port = 8080

[database]
# Overridden at runtime via DATABASE_URL env var.
url = "postgres://benchmark:benchmark@localhost:5432/benchmark"
pool_size = 20
# Apply the packaged migrations at startup, as every other app in the suite
# does. One process, so there is no rolling-deploy hazard.
auto_migrate = true

[log]
level = "warn"
format = "Json"
