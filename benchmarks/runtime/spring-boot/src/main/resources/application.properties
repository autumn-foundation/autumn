spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
# Same database pool size as every other app in the comparable track.
spring.datasource.hikari.maximum-pool-size=20
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# The compose database is pre-seeded by schema/init.sql, so Flyway finds a
# non-empty schema with no history table. Baseline at V1 there (its tables
# already exist); an empty database still runs V1.
spring.flyway.baseline-on-migrate=true
server.port=${SERVER_PORT:8080}
spring.jpa.open-in-view=false
logging.level.root=WARN
spring.security.user.name=benchmark
spring.security.user.password=unused
