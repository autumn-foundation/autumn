[package]
name = "autumn-macros-model"
description = "Database-model proc macros for the Autumn web framework (#[model], #[service]); split from autumn-macros so DB codegen only compiles when the db feature is enabled"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/autumn-foundation/autumn"
readme = "../README.md"
keywords = ["web", "composable", "axum", "htmx", "fullstack"]
categories = ["web-programming", "web-programming::http-server"]

[lib]
proc-macro = true

[dependencies]
autumn-macros-support = { version = "0.10.0", path = "../autumn-macros-support" }
# The schema-name rule, and the `#[references]` action values, come from the IR.
autumn-schema-core = { version = "0.10.0", path = "../autumn-schema-core" }
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
proc-macro-crate.workspace = true

[lints]
workspace = true
