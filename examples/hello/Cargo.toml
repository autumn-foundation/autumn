[package]
name = "hello"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
autumn-web = { path = "../../autumn" }
# The maud `html!` macro expands to `::maud::` paths, so any crate that calls it
# needs `maud` as a direct dependency (used by the /flock WASM-island page).
maud = { version = "0.27", features = ["axum"] }

[dev-dependencies]
example-e2e = { path = "../../example-e2e" }
tokio = { workspace = true }

[features]
# Enable the headless-browser system smoke. Requires Chromium on the host.
#   cargo test -p hello --features system-tests --test smoke -- --include-ignored
system-tests = ["autumn-web/system-tests"]

[[test]]
name = "smoke"
path = "tests/system/smoke.rs"

[lints.rust]
unsafe_code = "forbid"
