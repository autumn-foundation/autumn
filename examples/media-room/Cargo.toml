[package]
name = "media-room"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
autumn-web = { path = "../../autumn" }
autumn-media-plugin = { path = "../../autumn-media-plugin" }
chrono = { workspace = true }
maud = { version = "0.27", features = ["axum"] }
serde = { workspace = true }

[dev-dependencies]
example-e2e = { path = "../../example-e2e" }
tokio = { workspace = true }

[features]
# Enable the headless-browser system smoke. Requires Chromium on the host.
#   cargo test -p media-room --features system-tests --test smoke -- --include-ignored
system-tests = ["autumn-web/system-tests"]

[[test]]
name = "smoke"
path = "tests/system/smoke.rs"

[lints.rust]
unsafe_code = "forbid"
