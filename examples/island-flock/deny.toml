# cargo-deny configuration for the `island-flock` satellite workspace.
#
# `island-flock` is its own workspace root (wasm32-unknown-unknown-only, see
# this crate's own `Cargo.toml` header) with its own `Cargo.lock`, so nothing
# in the root `deny.toml` ever sees its dependency graph. It is not built by
# any CI workflow (`build-island.sh` is a local/manual step — see
# docs/guide/wasm-islands.md), but its output IS shipped: the compiled
# `.wasm`/`.js` bundle is committed under `examples/flock/static/islands/`
# and served by the `flock` example, which IS built and tested in CI. So this
# graph gets the same advisory/source gate as every other graph Autumn ships,
# via `scripts/check-advisories.sh` (issue #1600, #2565).
#
# Scope, deliberately narrower than the root policy: only `advisories` and
# `sources` are gated here, matching `fuzz/deny.toml`'s reasoning — licenses
# were not surveyed for a new class this pass and gating them is left for a
# follow-up rather than decided here.

[graph]
all-features = false
no-default-features = false

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "warn"
ignore = [
    # RUSTSEC-2024-0370: proc-macro-error is unmaintained. It is a
    # proc-macro dependency of yew-macro. It runs on the host compiler only
    # and is not linked into the wasm output. yew 0.23 still uses it.
    # Review-by: 2026-11-13, or when a yew release drops it.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; yew-macro proc-macro dep, host only, not in the wasm output; yew 0.23 still uses it; review-by 2026-11-13" },
    # RUSTSEC-2025-0141: bincode 1.3.3 is unmaintained (no CVE, no known
    # exploit). It comes from yew -> gloo 0.11 -> gloo-worker 0.5. This crate
    # does not use it in its own source. The wasm build is stripped. A symbol
    # search cannot show if the code is in the output. yew 0.23 has no fix.
    # Review-by: 2026-11-13, or when a yew release drops it.
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained (no CVE); via yew -> gloo -> gloo-worker; unused by this crate; yew 0.23 has no fix; review-by 2026-11-13" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
