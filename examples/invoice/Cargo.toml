[package]
name = "invoice"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
autumn-web = { path = "../../autumn", features = ["maud", "pdf"] }
chrono = { version = "0.4", features = ["serde"] }
maud = { version = "0.27", features = ["axum"] }

[dev-dependencies]
tokio = { workspace = true }
example-e2e = { path = "../../example-e2e" }

[features]
# Enable the headless-browser system smoke. Requires Chromium on the host.
#   cargo test -p invoice --features system-tests --test smoke -- --include-ignored
system-tests = ["autumn-web/system-tests"]

[[test]]
name = "smoke"
path = "tests/system/smoke.rs"

[lints.rust]
unsafe_code = "forbid"
