# The Autumn plugin index (issue #1625).
#
# `autumn plugin list` and `autumn plugin add` read this file first.
# To add a listing, read README.md in this directory.
#
# Gate: `autumn plugin index check --index autumn-cli/plugin-index/index.toml`.
# The CLI unit tests run the same gate against this release.

schema = 1

[[plugin]]
name = "autumn-admin-plugin"
description = "Out-of-the-box admin panel plugin for autumn-web applications"
origin = "first-party"
repository = "https://github.com/autumn-foundation/autumn/tree/trunk-dev/autumn-admin-plugin"
version = "0.7.0"
autumn_web = "0.7"
tier = "stable"
trust = "native"
status = "listed"
prefix = "/admin"
sensitive_routes = ["/admin:Role: admin required via AdminPlugin::require_role"]

[plugin.conformance]
result = "pass"
autumn_web = "0.7.0"
checked = "2026-09-27"

