# promtool unit test for the golden SLO rules (issue #3069).
# CI runs it in scripts/check-k8s-manifests.sh:
#   promtool test rules autumn-cli/tests/fixtures/slo/burn-rate.test.yaml
#
# The "availability" SLO has an objective of 99.9 %. Traffic is 1000
# good responses per minute. From minute 60, 100 more responses per minute
# are 5xx (about 9 %). That burns the budget at about 90x.
rule_files:
  - ../../golden/slo/prometheus-rules.yaml

evaluation_interval: 1m

tests:
  # A spike that continues: all three alerts fire.
  - interval: 1m
    input_series:
      - series: 'autumn_http_responses_total{job="shop",status="2xx"}'
        values: '0+1000x120'
      - series: 'autumn_http_responses_total{job="shop",status="5xx"}'
        values: '0x60 100+100x59'
    promql_expr_test:
      - expr: autumn_slo:sli_error:ratio_rate5m{slo="availability"}
        eval_time: 50m
        exp_samples:
          - labels: 'autumn_slo:sli_error:ratio_rate5m{app="shop",slo="availability"}'
            value: 0
      - expr: autumn_slo:objective:ratio{slo="availability"}
        eval_time: 50m
        exp_samples:
          - labels: 'autumn_slo:objective:ratio{app="shop",slo="availability"}'
            value: 0.999
    alert_rule_test:
      # Before the spike: no alert.
      - eval_time: 50m
        alertname: AutumnSloErrorBudgetBurn
        exp_alerts: []
      - eval_time: 75m
        alertname: AutumnSloErrorBudgetBurn
        exp_alerts:
          - exp_labels:
              app: shop
              slo: availability
              severity: page
              long_window: 1h
              short_window: 5m
            exp_annotations:
              summary: "shop SLO availability burns its error budget at 14.4x or more"
              description: "Objective 99.9% (non-5xx responses, all routes). The error ratio is above 0.0144 over 1h and 5m."
          - exp_labels:
              app: shop
              slo: availability
              severity: ticket
              long_window: 3d
              short_window: 6h
            exp_annotations:
              summary: "shop SLO availability burns its error budget at 1x or more"
              description: "Objective 99.9% (non-5xx responses, all routes). The error ratio is above 0.001 over 3d and 6h."
          - exp_labels:
              app: shop
              slo: availability
              severity: page
              long_window: 6h
              short_window: 30m
            exp_annotations:
              summary: "shop SLO availability burns its error budget at 6x or more"
              description: "Objective 99.9% (non-5xx responses, all routes). The error ratio is above 0.006 over 6h and 30m."

  # A spike that stops after 15 minutes. The 5m window clears, so the fast
  # page stops at once. The 30m window still holds the spike, so the slow
  # page and the ticket continue.
  - interval: 1m
    input_series:
      - series: 'autumn_http_responses_total{job="shop",status="2xx"}'
        values: '0+1000x120'
      - series: 'autumn_http_responses_total{job="shop",status="5xx"}'
        values: '0x60 100+100x14 1500x45'
    alert_rule_test:
      - eval_time: 74m
        alertname: AutumnSloErrorBudgetBurn
        exp_alerts:
          - exp_labels:
              app: shop
              slo: availability
              severity: page
              long_window: 1h
              short_window: 5m
            exp_annotations:
              summary: "shop SLO availability burns its error budget at 14.4x or more"
              description: "Objective 99.9% (non-5xx responses, all routes). The error ratio is above 0.0144 over 1h and 5m."
          - exp_labels:
              app: shop
              slo: availability
              severity: ticket
              long_window: 3d
              short_window: 6h
            exp_annotations:
              summary: "shop SLO availability burns its error budget at 1x or more"
              description: "Objective 99.9% (non-5xx responses, all routes). The error ratio is above 0.001 over 3d and 6h."
          - exp_labels:
              app: shop
              slo: availability
              severity: page
              long_window: 6h
              short_window: 30m
            exp_annotations:
              summary: "shop SLO availability burns its error budget at 6x or more"
              description: "Objective 99.9% (non-5xx responses, all routes). The error ratio is above 0.006 over 6h and 30m."

      - eval_time: 85m
        alertname: AutumnSloErrorBudgetBurn
        exp_alerts:
          - exp_labels:
              app: shop
              slo: availability
              severity: ticket
              long_window: 3d
              short_window: 6h
            exp_annotations:
              summary: "shop SLO availability burns its error budget at 1x or more"
              description: "Objective 99.9% (non-5xx responses, all routes). The error ratio is above 0.001 over 3d and 6h."
          - exp_labels:
              app: shop
              slo: availability
              severity: page
              long_window: 6h
              short_window: 30m
            exp_annotations:
              summary: "shop SLO availability burns its error budget at 6x or more"
              description: "Objective 99.9% (non-5xx responses, all routes). The error ratio is above 0.006 over 6h and 30m."
