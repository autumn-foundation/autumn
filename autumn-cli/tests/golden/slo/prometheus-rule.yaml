# Generated by `autumn slo generate` from the [[slo]] tables in autumn.toml.
# Do not edit. Run the command again after you change an SLO.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: "shop-slo"
  labels:
    app.kubernetes.io/name: "shop"
    app.kubernetes.io/managed-by: autumn
spec:
  groups:
    - name: "autumn-slo-shop-availability"
      rules:
        - record: autumn_slo:objective:ratio
          expr: vector(0.999)
          labels:
            app: "shop"
            slo: "availability"
            job: "shop"
        - record: autumn_slo:sli_bad:rate5m
          expr: |-
            (sum(rate(autumn_http_responses_total{status="5xx",job="shop"}[5m])) or vector(0))
          labels:
            app: "shop"
            slo: "availability"
            job: "shop"
        - record: autumn_slo:sli_total:rate5m
          expr: |-
            sum(rate(autumn_http_responses_total{job="shop"}[5m]))
          labels:
            app: "shop"
            slo: "availability"
            job: "shop"
        - record: autumn_slo:sli_error:ratio_rate5m
          expr: |-
            (sum(rate(autumn_http_responses_total{status="5xx",job="shop"}[5m])) or vector(0))
            /
            sum(rate(autumn_http_responses_total{job="shop"}[5m]))
          labels:
            app: "shop"
            slo: "availability"
            job: "shop"
        - record: autumn_slo:sli_error:ratio_rate30m
          expr: |-
            (sum(rate(autumn_http_responses_total{status="5xx",job="shop"}[30m])) or vector(0))
            /
            sum(rate(autumn_http_responses_total{job="shop"}[30m]))
          labels:
            app: "shop"
            slo: "availability"
            job: "shop"
        - record: autumn_slo:sli_error:ratio_rate1h
          expr: |-
            (sum(rate(autumn_http_responses_total{status="5xx",job="shop"}[1h])) or vector(0))
            /
            sum(rate(autumn_http_responses_total{job="shop"}[1h]))
          labels:
            app: "shop"
            slo: "availability"
            job: "shop"
        - record: autumn_slo:sli_error:ratio_rate6h
          expr: |-
            (sum(rate(autumn_http_responses_total{status="5xx",job="shop"}[6h])) or vector(0))
            /
            sum(rate(autumn_http_responses_total{job="shop"}[6h]))
          labels:
            app: "shop"
            slo: "availability"
            job: "shop"
        - record: autumn_slo:sli_error:ratio_rate3d
          expr: |-
            sum_over_time(autumn_slo:sli_bad:rate5m{app="shop",job="shop",slo="availability"}[3d])
            /
            sum_over_time(autumn_slo:sli_total:rate5m{app="shop",job="shop",slo="availability"}[3d])
          labels:
            app: "shop"
            slo: "availability"
            job: "shop"
        - record: autumn_slo:sli_error:ratio_rate30d
          expr: |-
            sum_over_time(autumn_slo:sli_bad:rate5m{app="shop",job="shop",slo="availability"}[30d])
            /
            sum_over_time(autumn_slo:sli_total:rate5m{app="shop",job="shop",slo="availability"}[30d])
          labels:
            app: "shop"
            slo: "availability"
            job: "shop"
        - alert: AutumnSloErrorBudgetBurn
          expr: |-
            autumn_slo:sli_error:ratio_rate1h{app="shop",job="shop",slo="availability"} > 0.0144
            and
            autumn_slo:sli_error:ratio_rate5m{app="shop",job="shop",slo="availability"} > 0.0144
