# Generated by `autumn slo generate` from the [[slo]] tables in autumn.toml.
# Do not edit. Run the command again after you change an SLO.
groups:
  - name: "autumn-slo-shop-availability"
    rules:
      - record: autumn_slo:objective:ratio
        expr: vector(0.999)
        labels:
          app: "shop"
          slo: "availability"
      - record: autumn_slo:sli_error:ratio_rate5m
        expr: |-
          (sum(rate(autumn_http_responses_total{status="5xx",job="shop"}[5m])) or vector(0))
          /
          sum(rate(autumn_http_responses_total{job="shop"}[5m]))
        labels:
          app: "shop"
          slo: "availability"
      - record: autumn_slo:sli_error:ratio_rate30m
        expr: |-
          (sum(rate(autumn_http_responses_total{status="5xx",job="shop"}[30m])) or vector(0))
          /
          sum(rate(autumn_http_responses_total{job="shop"}[30m]))
        labels:
          app: "shop"
          slo: "availability"
      - record: autumn_slo:sli_error:ratio_rate1h
        expr: |-
          (sum(rate(autumn_http_responses_total{status="5xx",job="shop"}[1h])) or vector(0))
          /
          sum(rate(autumn_http_responses_total{job="shop"}[1h]))
        labels:
          app: "shop"
          slo: "availability"
      - record: autumn_slo:sli_error:ratio_rate6h
        expr: |-
          (sum(rate(autumn_http_responses_total{status="5xx",job="shop"}[6h])) or vector(0))
          /
          sum(rate(autumn_http_responses_total{job="shop"}[6h]))
        labels:
          app: "shop"
          slo: "availability"
      - record: autumn_slo:sli_error:ratio_rate3d
        expr: |-
          (sum(rate(autumn_http_responses_total{status="5xx",job="shop"}[3d])) or vector(0))
          /
          sum(rate(autumn_http_responses_total{job="shop"}[3d]))
        labels:
          app: "shop"
          slo: "availability"
      - record: autumn_slo:sli_error:ratio_rate30d
        expr: |-
          (sum(rate(autumn_http_responses_total{status="5xx",job="shop"}[30d])) or vector(0))
          /
          sum(rate(autumn_http_responses_total{job="shop"}[30d]))
        labels:
          app: "shop"
          slo: "availability"
      - alert: AutumnSloErrorBudgetBurn
        expr: |-
          autumn_slo:sli_error:ratio_rate1h{app="shop",slo="availability"} > 0.0144
          and
          autumn_slo:sli_error:ratio_rate5m{app="shop",slo="availability"} > 0.0144
        labels:
          app: "shop"
          slo: "availability"
          severity: "page"
          long_window: "1h"
          short_window: "5m"
        annotations:
          summary: "shop SLO availability burns its error budget at 14.4x or more"
          description: "Objective 99.9% (non-5xx responses, all routes). The error ratio is above 0.0144 over 1h and 5m."
      - alert: AutumnSloErrorBudgetBurn
        expr: |-
          autumn_slo:sli_error:ratio_rate6h{app="shop",slo="availability"} > 0.006
          and
          autumn_slo:sli_error:ratio_rate30m{app="shop",slo="availability"} > 0.006
        labels:
          app: "shop"
          slo: "availability"
          severity: "page"
          long_window: "6h"
          short_window: "30m"
        annotations:
          summary: "shop SLO availability burns its error budget at 6x or more"
          description: "Objective 99.9% (non-5xx responses, all routes). The error ratio is above 0.006 over 6h and 30m."
      - alert: AutumnSloErrorBudgetBurn
        expr: |-
          autumn_slo:sli_error:ratio_rate3d{app="shop",slo="availability"} > 0.001
          and
          autumn_slo:sli_error:ratio_rate6h{app="shop",slo="availability"} > 0.001
        labels:
          app: "shop"
          slo: "availability"
          severity: "ticket"
          long_window: "3d"
          short_window: "6h"
        annotations:
          summary: "shop SLO availability burns its error budget at 1x or more"
          description: "Objective 99.9% (non-5xx responses, all routes). The error ratio is above 0.001 over 3d and 6h."
