# Generated by `autumn slo generate` from the [[slo]] tables in autumn.toml.
# Do not edit. Run the command again after you change an SLO.
# Each query returns the canary burn rate. The Helm chart fails the canary
# above analysis.maxBurnRate.
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: "shop-availability"
  labels:
    app.kubernetes.io/name: "shop"
    app.kubernetes.io/managed-by: autumn
spec:
  provider:
    type: prometheus
    address: "http://prometheus.monitoring.svc:9090"
  query: |-
    (
      (sum(rate(autumn_http_responses_total{status="5xx",namespace="{{ namespace }}",pod=~"{{ target }}-[0-9a-zA-Z]+(-[0-9a-zA-Z]+)",job="shop"}[{{ interval }}])) or vector(0))
      /
      sum(rate(autumn_http_responses_total{namespace="{{ namespace }}",pod=~"{{ target }}-[0-9a-zA-Z]+(-[0-9a-zA-Z]+)",job="shop"}[{{ interval }}]))
    )
    / 0.001
---
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: "shop-checkout"
  labels:
    app.kubernetes.io/name: "shop"
    app.kubernetes.io/managed-by: autumn
spec:
  provider:
    type: prometheus
    address: "http://prometheus.monitoring.svc:9090"
  query: |-
    (
      (sum(rate(autumn_http_request_duration_seconds_count{route="/api/orders",status_class="5xx",namespace="{{ namespace }}",pod=~"{{ target }}-[0-9a-zA-Z]+(-[0-9a-zA-Z]+)",job="shop"}[{{ interval }}])) or vector(0))
      /
      sum(rate(autumn_http_request_duration_seconds_count{route="/api/orders",namespace="{{ namespace }}",pod=~"{{ target }}-[0-9a-zA-Z]+(-[0-9a-zA-Z]+)",job="shop"}[{{ interval }}]))
    )
    / 0.005
---
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: "shop-orders-latency"
  labels:
    app.kubernetes.io/name: "shop"
    app.kubernetes.io/managed-by: autumn
spec:
  provider:
    type: prometheus
    address: "http://prometheus.monitoring.svc:9090"
  query: |-
    (
      1 - (
        sum(rate(autumn_http_request_duration_seconds_bucket{route="/api/orders",le="0.25",namespace="{{ namespace }}",pod=~"{{ target }}-[0-9a-zA-Z]+(-[0-9a-zA-Z]+)",job="shop"}[{{ interval }}]))
        /
        sum(rate(autumn_http_request_duration_seconds_count{route="/api/orders",namespace="{{ namespace }}",pod=~"{{ target }}-[0-9a-zA-Z]+(-[0-9a-zA-Z]+)",job="shop"}[{{ interval }}]))
      )
    )
    / 0.01
