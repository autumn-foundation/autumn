# Generated by `autumn slo generate` from the [[slo]] tables in autumn.toml.
# Do not edit. Run the command again after you change an SLO.
# The Helm chart sets AUTUMN_DEPLOY_VERSION to the pod-template hash, so the
# `version` label tells canary pods from stable pods.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: "shop-slo"
  labels:
    app.kubernetes.io/name: "shop"
    app.kubernetes.io/managed-by: autumn
spec:
  args:
    - name: canary-hash
    - name: prometheus-address
      value: "http://prometheus.monitoring.svc:9090"
  metrics:
    - name: "availability"
      interval: 1m
      failureLimit: 1
      successCondition: "len(result) == 0 || isNaN(result[0]) || result[0] <= 14.4"
      provider:
        prometheus:
          address: "{{args.prometheus-address}}"
          query: |-
            (
              (sum(rate(autumn_http_responses_total{status="5xx",version="{{args.canary-hash}}",job="shop"}[5m])) or vector(0))
              /
              sum(rate(autumn_http_responses_total{version="{{args.canary-hash}}",job="shop"}[5m]))
            )
            / 0.001
    - name: "checkout"
      interval: 1m
      failureLimit: 1
      successCondition: "len(result) == 0 || isNaN(result[0]) || result[0] <= 14.4"
      provider:
        prometheus:
          address: "{{args.prometheus-address}}"
          query: |-
            (
              (sum(rate(autumn_http_request_duration_seconds_count{route="/api/orders",status_class="5xx",version="{{args.canary-hash}}",job="shop"}[5m])) or vector(0))
              /
              sum(rate(autumn_http_request_duration_seconds_count{route="/api/orders",version="{{args.canary-hash}}",job="shop"}[5m]))
            )
            / 0.005
    - name: "orders-latency"
      interval: 1m
      failureLimit: 1
      successCondition: "len(result) == 0 || isNaN(result[0]) || result[0] <= 14.4"
      provider:
        prometheus:
          address: "{{args.prometheus-address}}"
          query: |-
            (
              1 - (
                sum(rate(autumn_http_request_duration_seconds_bucket{route="/api/orders",le="0.25",version="{{args.canary-hash}}",job="shop"}[5m]))
                /
                sum(rate(autumn_http_request_duration_seconds_count{route="/api/orders",version="{{args.canary-hash}}",job="shop"}[5m]))
              )
            )
            / 0.01
