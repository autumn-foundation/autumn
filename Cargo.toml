[workspace]
members = ["autumn", "autumn-macros", "autumn-cli", "autumn-schema-core", "autumn-admin-plugin", "autumn-media-plugin", "autumn-storage-s3", "autumn-cache-redis", "autumn-search", "autumn-edge", "autumn-plugin-reference", "examples/hello", "examples/edge-greeting", "examples/hot-upgrade", "examples/flock", "examples/todo-app", "examples/blog", "examples/bookmarks", "examples/bookmarks-distributed", "examples/bookmarks-sharded", "examples/wiki", "examples/reddit-clone", "examples/saas", "examples/teams", "examples/media-room", "examples/invoice", "benchmarks/runtime/gate", "example-e2e"]
# The cargo-fuzz crate builds only under nightly with sanitizers and pulls
# `autumn` in as a path dependency. Excluding it keeps `cargo build/test
# --workspace` (and the publish gate) untouched; `fuzz/Cargo.toml` is also its
# own workspace root. It is intentionally NOT a member.
exclude = ["fuzz", "examples/island-flock"]
# `examples/island-flock` is a Yew CSR "island" SPIKE that ONLY builds
# for wasm32-unknown-unknown (it links `yew` and cannot compile for the host
# target). Excluding it keeps `cargo build/clippy --workspace` from ever
# building it natively; it is its own workspace root too. Build it via
# `examples/island-flock/build-island.sh`. See docs/guide/wasm-islands.md.
resolver = "3"

# `cargo test --workspace` builds every example, plugin, integration test, and
# proc macro in one target tree. Keep CI artifacts bounded on ubuntu-latest while
# preserving line numbers in panic backtraces.
[profile.test]
debug = "line-tables-only"
incremental = false

[profile.test.build-override]
debug = 0

[patch.crates-io]
autumn-web = { path = "autumn" }

[workspace.package]
edition = "2024"
rust-version = "1.88.0"
version = "0.7.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/autumn-foundation/autumn"

[workspace.dependencies]
# Runtime
axum = { version = "0.8", features = ["macros", "ws"] }
# Multipart boundary parsing for the submit-token replay guard. `multer` is the
# exact parser axum's `Multipart` extractor uses downstream (via `mime`), so the
# guard and the extractor can never disagree about the boundary. Already in the
# graph transitively (axum/tower-http); this only adds the direct edge. Pinned to
# the version already resolved in Cargo.lock.
multer = "3.1"
tokio-util = "0.7"
# Cargo-semantics version-requirement matching for the plugin API stability
# contract (issue #1601): a plugin declares the `autumn-web` range it supports
# and the framework evaluates it at registration. No transitive dependencies.
semver = "1"
# Automatic ACME (Let's Encrypt) certificate provisioning (issue #1608, the
# `acme` feature on autumn-web). `default-features = false` + `ring` is load
# bearing: the DEFAULT features of both crates pull `aws-lc-rs` into the
# dependency graph, which violates the workspace single-crypto-backend rule
# (rustls 0.23 + ring). `instant-acme` drives the ACME order state machine over
# hyper-rustls; `rcgen` generates the ACME account key, the certificate
# keypair/CSR, and the self-signed placeholder certificate.
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
# `socket2` (already in the graph transitively via tokio/hyper) is used directly
# to build a dual-stack IPv4+IPv6 `[::]` HTTP-01 challenge listener with
# `IPV6_V6ONLY = false`, so Let's Encrypt can validate an AAAA-only deployment.
socket2 = { version = "0.6", features = ["all"] }
diesel = { version = "2", features = ["sqlite", "postgres"] }
pq-sys = { version = "0.7", features = ["bundled_without_openssl"] }
# `async-connection-wrapper` provides the sync diesel API (incl. running
# diesel_migrations) over an async connection — used to run startup
# migrations and wait checks through the rustls TLS connector, since the
# bundled libpq (`pq-sys` below) has no SSL support.
diesel-async = { version = "0.9", features = ["deadpool", "postgres", "async-connection-wrapper"] }
diesel_migrations = "2"
http = "1"
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
maud = { version = "0.27", features = ["axum"] }
toml = "1.1"
toml_edit = "0.25"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "fs", "trace", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-opentelemetry = "0.33.0"
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "grpc-tonic", "tls-aws-lc", "tls-roots", "http-proto", "reqwest-client", "reqwest-rustls"] }
# tokio-rustls-comp (not tokio-native-tls-comp): the workspace already
# standardizes on rustls elsewhere (instant-acme, opentelemetry-otlp).
# Required for `rediss://` URLs — e.g. the azure-container-apps release
# target's generated Redis Cache, which disables the non-TLS port — since
# `redis::Client::open` otherwise errors immediately on that scheme with no
# TLS feature compiled in.
redis = { version = "1.2.0", default-features = false, features = ["aio", "tokio-comp", "connection-manager", "script", "tokio-rustls-comp"] }
tokio-cron-scheduler = { version = "0.15", features = ["signal"] }
chrono-tz = "0.10"
validator = { version = "0.20", features = ["derive"] }
bcrypt = "0.19"
futures = "0.3"
indexmap = "2"
inventory = "0.3"
moka = { version = "0.12", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "redis", "minio"] }
# Keep time on the 0.3 release line for the testcontainers/bollard dependency
# graph used by integration tests.
time = { version = ">=0.3, <0.3.56" }

csv = "1.3"
rust_decimal = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# HTML allowlist sanitizer for user-submitted rich text (issue #1255). Pulled in
# by autumn-web's `markdown` feature; see `autumn/src/markdown/user_content.rs`.
ammonia = "4.1"
chromiumoxide = { version = "0.9", default-features = false }
# Pure-Rust PDF writer (issue #1317). `default-features = false` excludes the
# `html` feature (azul CSS layout + rust-fontconfig system-font scanning) —
# only the core PDF object/page writer and the base-14 built-in fonts are
# used. See `autumn/src/pdf.rs`.
printpdf = { version = "0.12", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# Proc macro
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
# Resolves a dependency's actual (possibly `package = "..."`-renamed) crate
# name from the invoking crate's Cargo.toml — used by autumn-macros to emit
# `::autumn_web` paths that still resolve after a downstream rename (#1828).
proc-macro-crate = "3.5"

[workspace.lints.rust]
unsafe_code = "forbid"
# `fuzzing` is set by cargo-fuzz/libFuzzer when building the `fuzz/` crate's
# targets (which pull `autumn` in as a path dependency). Declaring it here keeps
# the `#[cfg(fuzzing)]` seams in the source from tripping the `unexpected_cfgs`
# lint under `-D warnings` in normal (non-fuzzing) workspace builds.
#
# `loom_models` is set (via `RUSTFLAGS="--cfg loom_models"`) only when building
# the isolated `autumn/tests/loom_models.rs` loom model-checking binary; a
# neutral custom cfg is used instead of the usual `--cfg loom` so the flag does
# not poison dependency crates (hyper-util/tokio) that carry their own
# `#[cfg(loom)]` paths.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)', 'cfg(loom_models)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Determinism seam gate (issue #1797). `clippy.toml`'s `disallowed-methods`
# array arms `clippy::disallowed_methods` — which is warn-by-default — in every
# crate that sees the config, i.e. the whole workspace. Grandfather it here so
# the ban is opt-IN: a module enters the gate by carrying the
# `autumn-determinism-gate:` header, which re-denies the lint for that module's
# production code path. Without this line the array would turn hundreds of
# pre-existing, out-of-scope call sites into hard CI failures on day one.
#
# Crates that do NOT set `[lints] workspace = true` (every `examples/*`, the
# runtime benchmark crates, `example-e2e`) carry the equivalent `#![allow(...)]`
# at their own crate root instead; `scripts/check-determinism-gate.sh` verifies
# that a gated module never sits under such an allow.
disallowed_methods = "allow"
# rustc 1.98 added `clippy::unused_async_trait_impl` (nursery), which fires on
# an `async fn` in a trait impl whose body never awaits — 49 sites across the
# workspace, 37 of them `FromRequestParts::from_request_parts` extractors that
# only read a request extension.
#
# Grandfathered rather than rewritten. The suggested transform changes each
# signature from `async fn f() -> T` to `fn f() -> impl Future<Output = T>`,
# which alters what auto-traits leak through the returned future; doing that
# unverified across 28 files, several of them security-sensitive (`csrf`,
# `submit_token`, `rate_limit`), buys a state machine the optimizer already
# handles and risks far more than it saves. `async fn` is also the spelling the
# trait definitions themselves use, so the impls read as their traits do.
#
# Revisit deliberately if the extractor hot path ever shows up in a profile —
# it is a real (if small) win, just not one to take blind.
unused_async_trait_impl = "allow"
