[package]
name = "autumn-macros"
description = "Proc macros for the Autumn web framework"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/autumn-foundation/autumn"
readme = "../README.md"
keywords = ["web", "composable", "axum", "htmx", "fullstack"]
categories = ["web-programming", "web-programming::http-server"]

[lib]
proc-macro = true

[features]
default = ["db"]
# A no-op kept so an existing `autumn-macros/db` dependant still RESOLVES.
# It no longer switches anything on: the database-layer codegen (`#[model]`,
# `#[commentable]`, `#[repository]`, `#[service]`) moved to the
# `autumn-macros-model` and `autumn-macros-repository` crates, and rustc does
# not let a proc-macro crate re-export another crate's proc macro, so this
# crate cannot give those paths back. A direct dependant that names
# `autumn_macros::model` must depend on the shard crate, or better, on
# `autumn-web`, whose paths did not change. See
# `docs/migrations/next.md`. `autumn-web` takes this crate with
# `default-features = false` and pulls the shards in itself, so a no-database
# app never compiles the database codegen at all.
db = []

[dependencies]
autumn-macros-support = { version = "0.7.0", path = "../autumn-macros-support" }
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
proc-macro-crate.workspace = true
# Wire-contract descriptors (issue #1755). `#[endpoint]` writes one JSON file
# per service endpoint as a build artifact, and `#[contract_checked]` reads it
# back to name the offending field in a diagnostic. Both are build-time only.
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
