[package]
name = "autumn-macros"
description = "Proc macros for the Autumn web framework"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/autumn-foundation/autumn"
readme = "../README.md"
keywords = ["web", "composable", "axum", "htmx", "fullstack"]
categories = ["web-programming", "web-programming::http-server"]

[lib]
proc-macro = true

[features]
# `db` is on by default so a direct dependant (and `cargo test -p
# autumn-macros`) keeps the full macro surface. `autumn-web` takes this crate
# with `default-features = false` and pulls the database-layer macros in
# through the `autumn-macros-model` / `autumn-macros-repository` crates
# instead, so a no-database app never compiles the database codegen at all.
default = ["db"]
# Kept for compatibility: the database-layer codegen (`#[model]`,
# `#[repository]`, `#[service]`) used to live in this crate behind this
# feature. It now lives in the `autumn-macros-model` and
# `autumn-macros-repository` crates; this feature is a no-op so existing
# `autumn-macros/db` dependants keep resolving.
db = []

[dependencies]
autumn-macros-support = { path = "../autumn-macros-support" }
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
proc-macro-crate.workspace = true
# Wire-contract descriptors (issue #1755). `#[endpoint]` writes one JSON file
# per service endpoint as a build artifact, and `#[contract_checked]` reads it
# back to name the offending field in a diagnostic. Both are build-time only.
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
