[package]
name = "autumn-media-plugin"
description = "Live-streaming media plugin (broadcast + rooms) for autumn-web applications"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/autumn-foundation/autumn"
readme = "README.md"
keywords = ["web", "media", "streaming", "webrtc", "axum"]
categories = ["web-programming", "multimedia"]

[dependencies]
autumn-web = { version = "0.10.0", path = "../autumn" }
chrono = { workspace = true }
# Diesel is used ONLY by the optional DB-backed `RoomStore` (rooms_db).
# Backend selection (postgres / sqlite) is inherited from autumn-web's `db`
# feature via cargo feature unification — this crate never enables a backend
# (or the `sqlite` runtime lane) itself, so the FEATURE-UNIFICATION HAZARD in
# `autumn/src/db.rs` does not apply. Queries are written against autumn-web's
# `RuntimeConnection` / `RuntimeBackend` aliases so both lanes compile.
diesel = { workspace = true }
diesel-async = { workspace = true }
percent-encoding = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
# Fresh workflow ids for staged (S3) encode outputs. Matches the pin autumn
# itself uses (`uuid = { version = "1", features = ["v4"] }`).
uuid = { version = "1", features = ["v4"] }

# ── HTTP client (MediaMTX control API + recorded-VOD availability probe) ──────
# Production MediaMTX origins can be https (Fly), so TLS is required. The
# `rustls` feature uses `aws-lc-rs`, the same backend as the aws-sdk-s3
# `default-https-client` stack in this crate. It also uses the
# operating-system root store (`rustls-platform-verifier`).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# ── AWS SDK (S3 media storage) ────────────────────────────────────────────────
# Keep these pins the same as autumn-storage-s3/Cargo.toml. The
# `s3_crates_share_uncapped_aws_pins` repo test checks this.
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
# Default features minus "rustls": the legacy `rustls` feature pulls the
# deprecated hyper 0.14 / rustls 0.21 connector stack, whose rustls-webpki
# 0.101 line has unfixed advisories (RUSTSEC-2026-0098/0099/0104 — fixes only
# exist on the 0.103 line). The SDK's actual runtime client is the modern
# `default-https-client` stack (hyper 1.x / rustls 0.23), which stays enabled.
aws-sdk-s3 = { version = "1.157", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }

[dev-dependencies]
# Encode arg-vector / concat / segment-discovery tests stage files in a temp
# dir; `std::fs::File::set_modified` (stable since Rust 1.75) sets mtimes, so no
# `filetime` dep is needed.
tempfile = "3"
# Job-arg / artifact (de)serialization round-trip tests.
serde_json = { workspace = true }
tower = { workspace = true }
# DB-backed `RoomStore` (rooms_db) testcontainer integration tests — spin a real
# Postgres via testcontainers, exactly mirroring autumn-admin-plugin's
# `tests/token_admin_db.rs`. `#[ignore]`d so a default `cargo test` never needs
# Docker.
diesel = { workspace = true }
diesel-async = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }

[lints]
workspace = true
