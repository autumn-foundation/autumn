# Bolt workload manifest: one entry per `[[bench]]` target in the workspace.
#
# `scripts/check-perf-profiles.py bolt` fails CI when a bench target has no
# entry here, when an entry names a bench that no longer exists, or when an
# entry has no committed profile under `docs/perf/bolt/<package>/<bench>/`.
# `scripts/bolt-profile.sh <package>/<bench>` writes that profile.
#
# Fields:
#   package, bench   the cargo package and bench target name.
#   features         extra cargo features for the release build.
#   mode             how the profile isolates the workload:
#                      "marginal"  two runs, `{n}` = 0 and `{n}` = N; the
#                                  profile is the difference, per iteration.
#                      "whole"     one run of a fixed workload; whole process.
#                      "criterion" a criterion bench under `--profile-time`;
#                                  the iteration count is wall-clock bound,
#                                  so read the shares, not the totals.
#   args             bench arguments; `{n}` is the iteration count.
#   callgrind_n      N for the callgrind run (marginal mode).
#   dhat_n           N for the dhat run (marginal mode).
#   env              extra environment, `KEY=value` strings.
#   ledger           "postgres": also write ledger.txt, the statements per
#                    iteration from pg_stat_statements (marginal mode only).
#   exempt           a reason; the bench has no committed profile.

[[workload]]
package = "autumn-web"
bench = "admission"
mode = "criterion"
args = ["--bench", "--profile-time", "1"]

[[workload]]
package = "autumn-web"
bench = "attribute_encryption"
mode = "whole"

[[workload]]
package = "autumn-web"
bench = "captcha_check"
mode = "marginal"
args = ["--iterations", "{n}"]
callgrind_n = 1000
dhat_n = 200

