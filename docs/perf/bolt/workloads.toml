dhat_n = 200
# Needs a TLS-free Postgres. The runner passes BOLT_PG_URL through as
# DATABASE_URL.
env = ["DATABASE_URL={BOLT_PG_URL}"]
ledger = "postgres"

[[workload]]
package = "autumn-web"
bench = "request_pipeline"
exempt = """Exhausted: repeated callgrind and dhat passes took it to the floor \
(about 95.2M Ir at --iterations 300). The rest is allocator cost from the \
tower layer-clone cascade (#2830). AGENTS.md forbids profiling it again."""

[[workload]]
