[package]
name = "xtask"
version = "0.0.0"
description = "Maintainer task runner for the Autumn workspace: `cargo xtask`. Never published."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Keep this list short: default features, or the smallest feature set that
# covers the use. xtask is a workspace member, so whatever features it turns on are unified into every
# `cargo build --workspace`. It must never depend on autumn-web, diesel or sqlx.
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# The docs gates' patterns. Already in the build through other crates.
regex = "1"
# Process and file helpers: `sh` (command builder, `$CARGO`) and `fs`
# (contextual file errors, temp dirs). Only these two modules: `sh` adds no
# dependency and `fs` adds `tempfile`, already in the build.
smop = { version = "0.3", default-features = false, features = ["sh", "fs"] }

[lints]
workspace = true
