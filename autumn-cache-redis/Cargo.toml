[package]
name = "autumn-cache-redis"
description = "Redis-backed shared cache plugin for autumn-web applications"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/autumn-foundation/autumn"
readme = "README.md"
keywords = ["web", "redis", "cache", "axum", "fullstack"]
categories = ["web-programming", "web-programming::http-server"]

[dependencies]
autumn-web = { version = "0.6.0", path = "../autumn", features = ["redis"] }
redis = { workspace = true }
# Installs the process-wide rustls `CryptoProvider` `redis`'s `tokio-rustls-comp`
# needs for `rediss://` URLs — see the comment in `RedisCache::connect`. Pinned
# to the same version/feature set `autumn`'s own rustls call sites use.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = "1"

[dev-dependencies]
tokio = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
