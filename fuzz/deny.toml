# cargo-deny configuration for the `fuzz` satellite workspace.
#
# `fuzz` is its own workspace root (see the root `Cargo.toml`'s `[workspace]
# exclude` and this crate's own `[workspace]` table) with its own `Cargo.lock`,
# so nothing in the root `deny.toml` ever sees its dependency graph — yet it is
# a real, CI-built artifact: `.github/workflows/fuzz.yml` compiles and runs
# every fuzz target on every push/PR to trunk & trunk-dev. `scripts/
# check-advisories.sh` audits this graph the same way it audits the main
# workspace (see "advisory gate (issue #1600, #2565)" there).
#
# Scope, deliberately narrower than the root policy: only `advisories` and
# `sources` are gated here. `licenses` is NOT run against this graph yet —
# `libfuzzer-sys` carries `(MIT OR Apache-2.0) AND NCSA`, an unconditional
# (not OR-satisfied) NCSA component that is not on the root allow-list and
# is a new license class for this tree. Accepting a new license class is an
# "ask before" decision (see the repo's dependency-hygiene charter), not
# something this config should decide unilaterally. Until a human accepts
# NCSA for this satellite graph (or the crate is dropped), `licenses` stays
# ungated here — tracked in docs/reports/2026-09-07-ballast-dependency-
# ledger-audit.md.

[graph]
all-features = false
no-default-features = false

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "warn"
ignore = [
    # RUSTSEC-2023-0071 — rsa 0.9.x "Marvin Attack" timing sidechannel.
    # Same ingress and same verdict as the root `deny.toml`: rsa 0.9.10 ->
    # jsonwebtoken -> autumn-web -> autumn-fuzz (this crate pulls in the same
    # autumn-web JWT surface the main workspace does). No patched rsa release
    # exists; Autumn exposes no network-reachable attacker-timed RSA
    # private-key decryption oracle. None of the fuzz targets exercise the
    # JWT sign/verify path specifically. Review-by: 2026-11-02 (reconfirmed unchanged 2026-10-05), matching the
    # root policy's own review-by for this same advisory.
    { id = "RUSTSEC-2023-0071", reason = "no fixed rsa release; RSA-JWT path only via jsonwebtoken, same as root deny.toml; not exercised by any fuzz target; reconfirmed unchanged 2026-10-05; review-by 2026-11-02" },
    # RUSTSEC-2024-0449 — unsafe-libyaml unmaintained (not a vulnerability).
    # Same ingress and verdict as the root `deny.toml`: unsafe-libyaml ->
    # serde_yaml 0.9 -> autumn-web's `openapi` feature. It only serializes the
    # OpenAPI document; no fuzz target parses untrusted YAML. No safe upgrade.
    # Review-by: 2026-11-12, matching the root policy.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained (not a vulnerability); serde_yaml only serializes the OpenAPI document, parses no untrusted YAML; no safe upgrade; same as root deny.toml; review-by 2026-11-12" },
    # RUSTSEC-2026-0387 — crypto-bigint secret-dependent branches in nominally
    # constant-time operations. Fixed only in >=0.7.6; no 0.4.x/0.5.x release
    # carries it. Two copies: 0.4.9 via aws-sigv4 -> p256 0.11 (SigV4a ECDSA
    # signing, which Autumn does not use; it signs with HMAC SigV4), and 0.5.5
    # via elliptic-curve 0.13 <- p256/p384 <- jsonwebtoken (ES256/ES384 JWT) and
    # aws-sigv4. The jsonwebtoken copy IS on autumn-web's JWT path, so this is a
    # real if low-practicality exposure (microarchitectural timing on ECDSA
    # secrets; no network-reachable signing oracle). Remediation needs the
    # RustCrypto elliptic-curve stack to move to crypto-bigint >=0.7.6.
    # Review-by: 2026-11-08.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.4.9/0.5.5 only, via aws-sigv4 (SigV4a ECDSA path, unused by Autumn HMAC SigV4) and jsonwebtoken ES256/ES384 -> p256/p384 -> elliptic-curve 0.13; no patched 0.4.x/0.5.x; review-by 2026-11-08" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
