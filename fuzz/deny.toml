# cargo-deny configuration for the `fuzz` satellite workspace.
#
# `fuzz` is its own workspace root (see the root `Cargo.toml`'s `[workspace]
# exclude` and this crate's own `[workspace]` table) with its own `Cargo.lock`,
# so nothing in the root `deny.toml` ever sees its dependency graph — yet it is
# a real, CI-built artifact: `.github/workflows/fuzz.yml` compiles and runs
# every fuzz target on every push/PR to trunk & trunk-dev. `scripts/
# check-advisories.sh` audits this graph the same way it audits the main
# workspace (see "advisory gate (issue #1600, #2565)" there).
#
# Scope, deliberately narrower than the root policy: only `advisories` and
# `sources` are gated here. `licenses` is NOT run against this graph yet —
# `libfuzzer-sys` carries `(MIT OR Apache-2.0) AND NCSA`, an unconditional
# (not OR-satisfied) NCSA component that is not on the root allow-list and
# is a new license class for this tree. Accepting a new license class is an
# "ask before" decision (see the repo's dependency-hygiene charter), not
# something this config should decide unilaterally. Until a human accepts
# NCSA for this satellite graph (or the crate is dropped), `licenses` stays
# ungated here — tracked in docs/reports/2026-09-07-ballast-dependency-
# ledger-audit.md.

[graph]
all-features = false
no-default-features = false

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "warn"
ignore = [
    # RUSTSEC-2023-0071 — rsa 0.9.x "Marvin Attack" timing sidechannel.
    # Same ingress and same verdict as the root `deny.toml`: rsa 0.9.10 ->
    # jsonwebtoken -> autumn-web -> autumn-fuzz (this crate pulls in the same
    # autumn-web JWT surface the main workspace does). rsa 0.10.0 (final)
    # shipped the fix 2026-11, but jsonwebtoken 11.1.0 (latest) still pins
    # rsa ^0.9 and webauthn-rs/crypto-glue's rsa ^0.10.0-rc.18 requirement
    # can't unify with final 0.10.0's now-mandatory `sha2` feature, so
    # neither path in the root workspace can take it yet. Every RSA use in
    # the main `autumn` crate is public-key verify only (SNS cert check,
    # JWKS verification) — no private-key signing exists for the Marvin
    # Attack's timing channel to leak. None of the fuzz targets exercise
    # the JWT path at all. Review-by: 2026-12-05 (reconfirmed unreachable
    # 2026-11-09), matching the root policy's own review-by for this same
    # advisory.
    { id = "RUSTSEC-2023-0071", reason = "verify-only, same verdict as root deny.toml; not exercised by any fuzz target; rsa 0.10.0 final now exists but jsonwebtoken (^0.9) and crypto-glue/webauthn-rs (rc pin vs. final's mandatory sha2) block taking it; reconfirmed unreachable 2026-11-09; review-by 2026-12-05" },
    # RUSTSEC-2026-0387 — crypto-bigint secret-dependent branches in nominally
    # constant-time operations. Fixed only in >=0.7.6; no 0.5.x release carries
    # it. One copy is left: 0.5.5 via elliptic-curve 0.13 <- p256/p384 0.13 <-
    # jsonwebtoken (ES256/ES384 JWT), same as root deny.toml. Reconfirmed
    # unchanged 2026-11-09 (jsonwebtoken still at latest 11.1.0). Review-by: 2026-11-23.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 only, via jsonwebtoken ES256/ES384 -> p256/p384 0.13 -> elliptic-curve 0.13; no patched 0.5.x; reconfirmed unchanged 2026-11-09; review-by 2026-11-23" },
    # RUSTSEC-2026-0441 — pin-utils is unmaintained. It comes from
    # loom 0.7.2, through autumn-web's `cfg(loom_models)` model checks. No
    # loom release drops it. Review-by: 2026-12-05.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils unmaintained; via loom 0.7.2 (cfg(loom_models) only), same as root deny.toml; no release drops it; review-by 2026-12-05" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
