[package]
name = "autumn-storage-s3"
description = "S3-compatible blob storage plugin for autumn-web applications"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/autumn-foundation/autumn"
readme = "README.md"
keywords = ["web", "s3", "storage", "axum", "fullstack"]
categories = ["web-programming", "web-programming::http-server"]

[dependencies]
autumn-web = { version = "0.9.0", path = "../autumn", features = ["storage"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
# Default features minus "rustls": the legacy `rustls` feature pulls the
# deprecated hyper 0.14 / rustls 0.21 connector stack, whose rustls-webpki
# 0.101 line has unfixed advisories (RUSTSEC-2026-0098/0099/0104 — fixes only
# exist on the 0.103 line). The SDK's actual runtime client is the modern
# `default-https-client` stack (hyper 1.x / rustls 0.23), which stays enabled.
aws-sdk-s3 = { version = "1.157", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
bytes = "1"
futures = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
temp-env = { version = "0.3.6", features = ["async_closure"] }
tokio = { workspace = true }

[lints]
workspace = true
