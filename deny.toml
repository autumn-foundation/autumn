# cargo-deny configuration — supply-chain gating for the Autumn workspace.
#
# CI runs `cargo deny check advisories licenses sources` in the `supply-chain`
# job (.github/workflows/ci.yml). All three checks are BLOCKING: the initial
# inventory was clean, so a new advisory, an un-allowed license, or an unknown
# source registry will fail CI. `bans` (duplicate versions) is intentionally not
# run in CI — see the [bans] note below.
#
# This is the ROOT workspace's graph only. `fuzz/` and `examples/island-flock/`
# are each their own excluded workspace root with their own `Cargo.lock` and
# their own narrower `deny.toml` (advisories + sources; see those files'
# headers) — audited by `scripts/check-advisories.sh`'s `audit_satellite_graphs`.
#
# ── Handling a supply-chain check that fails CI ────────────────────────────
# When the `supply-chain` job fails on a PR:
#   1. Read the RUSTSEC id / license / source and the dependency path cargo-deny
#      prints.
#   2. Prefer a FIX: `cargo update -p <crate>` to a patched version, or bump the
#      direct dependency that pulls it in. Keep the bump minimal and in its own
#      commit, justified in the PR body.
#   3. If NO fix exists (advisory says "no safe upgrade available"), add an entry
#      to `[advisories] ignore` below with: the RUSTSEC id, a `reason` citing why
#      the exposure is acceptable for Autumn, and a review-by date. Ignores are
#      debt — revisit them when a fix ships.
#   4. A genuinely-new license or source is handled the same way: drop/replace
#      the dependency, or deliberately add it to `[licenses] allow` / the
#      `[sources]` allow-lists.
# ───────────────────────────────────────────────────────────────────────────

[graph]
# Scan the default feature set PLUS every additive feature CI actually compiles,
# so an advisory/license/source introduced through any CI-built feature dependency
# can't slip past this gate. This list mirrors ci.yml's Postgres-backend feature
# build (the feature-flags + coverage jobs' PG_FEATURES set) — i.e. all autumn-web
# features EXCEPT `sqlite`. NOT --all-features, and `sqlite` is excluded, because
# the sqlite and postgres backends are mutually exclusive (a single graph enabling
# both is invalid); the sqlite-only deps (e.g. libsqlite3-sys) are already pulled
# unconditionally by the `db` feature so they are in this graph regardless, and a
# companion `deny-sqlite.toml` scans the sqlite backend graph in a second CI
# pass (see below).
all-features = false
no-default-features = false
features = ["autumn-web/ws", "autumn-web/presence", "autumn-web/flash", "autumn-web/cache-moka", "autumn-web/maud", "autumn-web/htmx", "autumn-web/multipart", "autumn-web/tailwind", "autumn-web/http-client", "autumn-web/oauth2", "autumn-web/webauthn", "autumn-web/openapi", "autumn-web/mcp", "autumn-web/markdown", "autumn-web/db", "autumn-web/offline-sync", "autumn-web/test-support", "autumn-web/telemetry-otlp", "autumn-web/redis", "autumn-web/i18n", "autumn-web/embed-assets", "autumn-web/storage", "autumn-web/variants", "autumn-web/reporting", "autumn-web/mail", "autumn-web/inbound-mail", "autumn-web/inbound-mailgun", "autumn-web/inbound-ses", "autumn-web/seed", "autumn-web/system-info", "autumn-web/csv", "autumn-web/pdf", "autumn-web/system-tests", "autumn-web/managed-pg", "autumn-web/managed-pg-bundled", "autumn-web/tls", "autumn-web/acme", "autumn-web/edge", "autumn-web/plugin-sandbox"]

[advisories]
# RustSec advisory database. Cover the ENTIRE resolved dependency graph
# (transitive included), not just direct/workspace crates: vulnerabilities are
# always denied, and unmaintained + unsound are set explicitly to "all" rather
# than relying on cargo-deny's version-dependent default scope, so no advisory
# anywhere in the tree can slip past this gate. Yanked crates stay at the
# default `warn` (currently chacha20 0.10.1, transitive) — tracked but
# non-blocking.
unmaintained = "all"
unsound = "all"
yanked = "warn"
ignore = [
    # RUSTSEC-2023-0071 — rsa 0.9.x "Marvin Attack" timing sidechannel.
    # No patched rsa release exists (advisory: "no safe upgrade available").
    # Ingress: rsa 0.9.10 through jsonwebtoken (RSA-family JWT sign and verify)
    # and autumn-web's SNS check (`inbound-ses`, public key only); rsa 0.10
    # through webauthn-rs 0.6 and crypto-glue (RS256 passkey checks, public key
    # only). Autumn exposes no network-reachable attacker-timed RSA private-key
    # decryption oracle, so real exposure is limited. Tracked by
    # issue #1600. Review-by: 2026-11-02 (reconfirmed unchanged 2026-10-05; or when a fixed rsa ships).
    { id = "RUSTSEC-2023-0071", reason = "no fixed rsa release; jsonwebtoken RSA-JWT path, SNS and webauthn-rs public-key checks only; tracked in #1600; reconfirmed unchanged 2026-10-05; review-by 2026-11-02" },
    # RUSTSEC-2026-0387 — crypto-bigint secret-dependent branches in nominally
    # constant-time operations. Fixed only in >=0.7.6; no 0.5.x release carries
    # it. One copy is left: 0.5.5 via elliptic-curve 0.13 <- p256/p384 0.13 <-
    # jsonwebtoken (ES256/ES384 JWT). That is a real if low-practicality exposure
    # (microarchitectural timing on ECDSA secrets; no network-reachable signing
    # oracle). Autumn's own p256 (Web Push) and aws-sigv4 use 0.7.10. Remove
    # when jsonwebtoken moves to p256 0.14. Review-by: 2026-11-08.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 only, via jsonwebtoken ES256/ES384 -> p256/p384 0.13 -> elliptic-curve 0.13; no patched 0.5.x; review-by 2026-11-08" },
    # RUSTSEC-2026-0440 — astral-tokio-tar is unmaintained. Dev and
    # test only: testcontainers 0.27 and 0.28 depend on it, for the Docker
    # tests and the `test-support` feature. No testcontainers release drops
    # it. Remove when one ships. Review-by: 2026-12-05.
    { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar unmaintained; only via testcontainers (Docker tests, `test-support`); testcontainers 0.28 still uses it; review-by 2026-12-05" },
    # RUSTSEC-2026-0441 — pin-utils is unmaintained. It comes from
    # loom 0.7.2 (the `cfg(loom_models)` model checks only) and from
    # wasmtimer 0.4.3 (wasm32 only, under reqwest-retry). Neither has a
    # release without it. Review-by: 2026-12-05.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils unmaintained; via loom 0.7.2 (cfg(loom_models) only) and wasmtimer 0.4.3 (wasm32 only); no release drops it; review-by 2026-12-05" },
]

[licenses]
# The initial tree is entirely permissive (plus weak, file-level MPL-2.0). This
# allow-list is BLOCKING: a dependency introducing an unlisted license fails CI.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "MIT-0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "PostgreSQL",
    # MPL-2.0 is weak, file-level copyleft (the cssparser/selectors stack). It
    # imposes obligations only on modifications to those upstream files, none on
    # Autumn's own source, so it is deliberately allowed.
    "MPL-2.0",
]
confidence-threshold = 0.8
# Gate dev- and build-dependency licenses too (both default false for the
# licenses check; advisories/sources already include dev+build deps). CI's
# `cargo test --workspace` compiles dev-dependencies, so their licenses are in
# scope for this gate.
include-dev = true
include-build = true

[licenses.private]
# The workspace's own example/benchmark crates carry no `license` field; do not
# fail the gate on first-party unpublished crates.
ignore = true

[bans]
# NOT run in CI. Duplicate versions are pervasive and cosmetic in this tree
# (RustCrypto old/new, windows-sys target shims), so keep them at `warn` for
# local `cargo deny check bans` runs rather than fighting the tree.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# All dependencies come from crates.io; there are no git sources. BLOCKING.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
