[package]
name = "autumn-web"
description = "An opinionated, convention-over-configuration web framework for Rust"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/autumn-foundation/autumn"
readme = "../README.md"
keywords = ["web", "composable", "axum", "htmx", "fullstack"]
categories = ["web-programming", "web-programming::http-server"]
autotests = false

[features]
default = ["maud", "htmx", "tailwind", "db", "cache-moka", "http-client", "reporting", "flash"]
ws = ["dep:tokio-stream"]
presence = ["ws"]
flash = []
cache-moka = ["dep:moka"]
maud = ["dep:maud"]
htmx = []
multipart = ["axum/multipart", "dep:infer"]
tailwind = []
# `dep:sha1` is pulled in here because the password-policy breach check
# (auth::password) needs SHA-1 for HIBP k-anonymity, and that path only exists
# when an HTTP client is available.
http-client = ["dep:reqwest", "dep:sha1"]
oauth2 = ["http-client"]
webauthn = ["dep:webauthn-rs"]
openapi = ["dep:serde_yaml"]
# Project typed JSON endpoints as MCP (Model Context Protocol) tools so AI
# agents can call the real, authenticated handler pipeline. Builds on the
# same `ApiDoc` registry that drives `openapi`, so it implies that feature.
mcp = ["openapi"]
# Optional Markdown rendering with frontmatter parsing and SSG integration,
# plus the safe *user-submitted* rich-text path (issue #1255): `ammonia` is the
# allowlist HTML sanitizer `markdown::render_user_content` runs its output
# through, so a content app can accept user Markdown without stored XSS.
markdown = ["dep:pulldown-cmark", "dep:ammonia"]
# `reqwest?/blocking` powers the replication S3 destination (#1628), which needs
# BOTH `db` and `http-client`. The `?` means it is enabled only when something
# else already pulled reqwest in, so an app on `http-client` alone (no database,
# and therefore no replication) does not compile the blocking client. The
# replication loop runs on its own OS thread — file, SQLite and network I/O all
# off the reactor — and `autumn db replica restore` is a synchronous CLI with no
# runtime at all, so a blocking client is the one shape both can share. It is
# constructed, used and dropped only on those threads, never inside the async
# runtime.
db = [
    "autumn-macros/db",
    "reqwest?/blocking",
    "dep:deadpool",
    "dep:diesel",
    "dep:diesel-async",
    "dep:diesel_migrations",
    "dep:libsqlite3-sys",
    "dep:pq-sys",
    "dep:scoped-futures",
    "dep:tokio-postgres",
    "dep:tokio-postgres-rustls",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:webpki-roots",
    "diesel/postgres",
    "diesel/chrono",
    "diesel/serde_json",
]
# Offline-first local store + background sync engine for occasionally-
# connected apps (e.g. Tauri mobile, issue #1508). Local state lives in an
# in-process SQLite database (`sync::SyncStore`, change-tracked with
# tombstones); a `sync::SyncEngine` pushes/pulls changes to a remote Autumn
# app that mounts `sync::server::router()` over Postgres shadow tables.
# Builds entirely on dependencies the `db` + `http-client` features already
# compile (diesel's sqlite backend and the bundled libsqlite3-sys are
# already in the graph) — zero new dependencies.
offline-sync = ["db", "http-client"]
# SQLite runtime lane (issue #1614). Flips the `db::RuntimeConnection` alias
# from Postgres (`AsyncPgConnection`) to a SQLite connection
# (`SyncConnectionWrapper<SqliteConnection>`) for the whole build graph.
#
# ⚠️ FEATURE-UNIFICATION HAZARD — READ BEFORE ADDING ANY EDGE ⚠️
# This feature must ONLY ever be enabled by an END APPLICATION or an explicit
# `--features sqlite` build invocation. It must NEVER be enabled by an
# inter-crate dependency edge or a dev-dependency anywhere in the workspace
# (e.g. `autumn-web = { ..., features = ["sqlite"] }` in autumn-cli /
# autumn-admin-plugin / autumn-macros / examples/*, or an autumn-web
# dev-dependency). Cargo feature unification is global: a single such edge
# flips `RuntimeConnection` to SQLite for EVERY consumer in the graph and
# breaks the Postgres default build. Feature-on testing is done via explicit
# `cargo build -p autumn-web --features sqlite` invocations only.
#
# Do NOT enable via `--all-features` — this is a backend-flip feature, so
# `--all-features` turns it on ALONGSIDE the Postgres-assuming features and
# fails autumn-web's lib to compile. CI/scripts that want the Postgres backend
# must use an explicit `--features` list that EXCLUDES `sqlite` (see
# `.github/workflows/ci.yml`).
#
# The runtime is wired (#1905): enabling this feature switches the connection
# type alias AND builds a deadpool pool over
# `SyncConnectionWrapper<SqliteConnection>`, so an app boots, migrates and
# serves against a `sqlite://` target. Needs no extra deps — diesel's sqlite
# backend and diesel-async's sync-connection-wrapper are already in the graph.
# What this build REFUSES is a Postgres target (`PoolError::UnsupportedBackend`),
# the mirror of the default build's refusal of a SQLite one.
# `sqlite` pulls in `db` so it is genuinely self-sufficient: `db` owns the
# shared, backend-neutral migration/pool plumbing this feature builds on — the
# `crate::migrate` module (itself `#[cfg(feature = "db")]`), `deadpool`, and
# `diesel_migrations` — which the SQLite migration path (`app.rs`
# `apply_pending_sqlite_or_exit`, gated on `#[cfg(feature = "sqlite")]`) calls
# directly. Without this edge, `--no-default-features --features sqlite` fails to
# compile (`crate::migrate` configured out). This is NOT a second backend: the
# `RuntimeConnection` alias (see `src/db.rs`) flips to SQLite purely on
# `#[cfg(feature = "sqlite")]` regardless of `db`, so enabling `db` alongside
# does not resurrect the Postgres runtime — it only supplies the plumbing. This
# mirrors the ratified verification lane `--features "db test-support sqlite"`.
# The bundled SQLite amalgamation (`libsqlite3-sys` workspace dep pins
# `features = ["bundled"]`, which `db` already pulls in) compiles with
# `SQLITE_ENABLE_FTS5` defined, so FTS5 full-text search (issue #1910:
# searchable repositories emit FTS5 virtual tables + bm25 ranking) is always
# available. Adding `db` here changes nothing for the Postgres/default lane,
# which never enables `sqlite`.
sqlite = ["db", "diesel/sqlite", "diesel/returning_clauses_for_sqlite_3_35", "diesel-async/sync-connection-wrapper"]
test-support = ["dep:testcontainers", "dep:testcontainers-modules"]
telemetry-otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
# W6 PR2 op-driver (issue #1797): promotes `proptest` from a dev-only dependency
# to an optional **library** dependency so `sim::Op`-style generation/shrinking
# code can live in `src/` (not just `tests/`), and so the forthcoming `sim-sweep`
# `[[bin]]` (W6 PR3), which is a binary and therefore cannot use dev-deps, can
# depend on it too. `proptest` itself stays out of default builds.
sim-testing = ["dep:proptest"]
# `dep:rustls` is not optional flavouring: `redis`'s `tokio-rustls-comp`
# feature makes `rediss://` URLs reachable, and those panic inside
# `rustls::ClientConfig::builder()` unless a process-level
# `CryptoProvider` is installed first. `redis_tls` installs one — see
# that module and issue #2172.
redis = ["dep:redis", "dep:rustls"]
i18n = []
# Embed the app's `static/` tree (incl. the fingerprint manifest) and i18n
# `locales`/`i18n` bundles into the release binary at compile time, so a single
# binary serves styled, localized pages with zero sidecar files. Opt-in: dev
# builds (or this feature off) still serve from disk for hot-reload. Mirrors the
# `embed_migrations!` precedent. See `embed_static!`/`embed_locales!`.
embed-assets = ["dep:include_dir"]
# Pluggable file storage backends. Off by default; enabling adds the
# `BlobStore` trait, the `Blob` value type, and a Local backend.
# For S3-compatible storage add `autumn-storage-s3` as a separate
# dependency and call `.with_blob_store(S3BlobStore::from_config(...))`.
# When combined with `db`, opts diesel into `serde_json` so the `Blob`
# value type can round-trip through a Postgres `JSONB` column.
storage = ["diesel?/serde_json"]
# On-demand image variants (resize, rotate, strip metadata) with
# content-addressed caching on top of the storage layer.
# Pulls in the `image` crate (JPEG + PNG + WebP codecs) behind this flag
# to keep the `storage`-only build lean.
variants = ["storage", "dep:image"]
# Pluggable error reporting: catch handler panics at the HTTP layer and route
# panics + 5xx responses to configured `ErrorReporter`s. Ships a `tracing`-based
# `LogReporter` as the default. On by default; disable to drop the panic-catch
# layer and the reporting machinery.
reporting = []
mail = ["dep:lettre", "dep:css-inline", "maud"]
# First-class inbound email handling with provider webhooks and routing DSL.
# Adds `autumn_web::inbound_mail` with the generic RFC 5322 adapter.
inbound-mail = []
# Mailgun HTTP-webhook adapter: HMAC-SHA256 signature verification and form
# field parsing. Implies `inbound-mail`.
inbound-mailgun = ["inbound-mail"]
# AWS SES via SNS notification adapter: subscription confirmation + RFC 5322
# parsing from the SNS notification body. Implies `inbound-mail`.
# Enables reqwest for SNS signing-cert fetching and rsa+sha1 for signature
# verification.
inbound-ses = ["inbound-mail", "http-client", "dep:rsa", "dep:sha1"]
# Enables `autumn_web::seed::SeedContext` for use in `src/bin/seed.rs`.
# Depends on `db`; off by default so apps that don't seed pay zero compile cost.
seed = ["db"]
system-info = []
# First-class CSV import and export for `#[repository]` models.
# Adds `autumn_web::data::csv` (streaming export, row-by-row import with
# structured error reporting) and the matching admin-panel routes and
# `autumn data` CLI subcommand.  Off by default so the `csv` crate is
# opt-in.
csv = ["dep:csv"]
# Render server-side templates (Maud views, or any HTML string) to a
# downloadable PDF document (issue #1317). Adds `autumn_web::pdf::Pdf`, an
# `IntoResponse` built on top of `Download`. Renders a deliberately-scoped
# HTML subset (headings, paragraphs, tables, bold/italic) with the built-in
# PDF base-14 fonts — no embedded font files and no system-installed
# browser/renderer, keeping the single-binary story intact. Off by default so
# the `printpdf` dependency is opt-in.
pdf = ["dep:printpdf"]
# First-class system tests driving a headless Chromium browser against a
# live Autumn server. Off by default — intended as a dev-dependency only.
# Adds `autumn_web::system_test::{SystemTest, Page, BrowserCheck}`.
system-tests = ["dep:chromiumoxide"]
# Managed local Postgres: a `ManagedPostgresPoolProvider` that provisions
# (initdb) and supervises a local `postgres` child in the app's data dir,
# surfaced through the pluggable pool-provider seam. Postgres binaries are
# downloaded on first run. Implies `db`.
managed-pg = ["db", "dep:postgresql_embedded"]
# Bundled single-binary mode: embed the Postgres binaries into the app
# executable at build time (no first-run download). Per-target build, large
# binary (tens-to-~150MB), still a supervised child process with an on-disk
# data dir. Implies `managed-pg`.
managed-pg-bundled = ["managed-pg", "postgresql_embedded/bundled"]
# Serve HTTPS directly from the app process: a config-driven native TLS
# listener (`[server.tls]` cert + key) that terminates rustls in-process and
# reuses the existing axum serve / graceful-shutdown / connect-info wiring
# (issue #1603). Off by default — absent `[server.tls]` keeps today's plain
# HTTP. Reuses the already-vendored `ring`-backed `rustls` (no second TLS
# backend); adds `tokio-rustls` for the async accept-time handshake and
# `x509-parser` for leaf-certificate expiry detection.
tls = ["dep:tokio-rustls", "dep:x509-parser", "dep:rustls", "dep:rustls-pki-types"]
# Automatic ACME (Let's Encrypt) certificate provisioning + renewal (issue
# #1608). Builds on `tls`: the issued certificate hot-swaps into the same
# `ReloadableCertResolver` the `tls` listener already serves. Off by default —
# without it the ACME modules are not compiled at all. Adds `instant-acme` (the
# ACME order state machine) and `rcgen` (account/cert key + CSR + self-signed
# placeholder), both pinned to `ring` so no second crypto backend enters the
# graph.
acme = ["tls", "dep:instant-acme", "dep:rcgen", "dep:socket2", "dep:reqwest"]
# Real-ACME end-to-end coverage against a Pebble container (issue #1863).
# Turns on `testcontainers`' `host-port-exposure` tunnel — the SSH sidecar
# that lets a container reach a `127.0.0.1`-bound listener on this host —
# and implies `acme` + `test-support`. Kept out of both of THOSE features so
# an ordinary `cargo test -p autumn-web --features test-support` (or a plain
# `--workspace` run) does not pull in `host-port-exposure`'s `russh`/crypto
# dependency subtree; only the dedicated Pebble CI step enables it.
acme-pebble = ["acme", "test-support", "testcontainers/host-port-exposure"]
# Origin-side half of the edge capsule (issue #1790). Adds the `autumn_web::edge`
# re-export of the `autumn-edge` crate, the `CacheEdgeKv` adapter that projects
# the app's `Cache` onto the `EdgeKv` seam, and `AppBuilder::with_edge_kv`, which
# installs the `EdgeCache` extension app-wide so an `#[edge]` handler serves
# identically from the origin binary and from the wasm capsule.
#
# Additive and host-only: autumn-web is never compiled for wasm32 (the capsule
# links `autumn-edge` alone), so this feature adds no target-conditional
# dependency and changes nothing about the default build. The `#[edge]` /
# `edge_routes!` macros are re-exported unconditionally — a route can be *marked*
# without this feature; the feature is what wires the seam at the origin.
edge = ["dep:autumn-edge"]
# Capability-sandboxed WASM plugins (issue #1609). Loads a third-party plugin as
# a portable `.autumn-plugin` artifact — a manifest plus a `wasm32-wasip1`
# module — and serves HTTP requests from it under the manifest's declared
# prefix, in-process, with deny-by-default ambient authority, hard CPU/memory
# ceilings and fault isolation.
#
# Purely additive and host-only: the native `Plugin` trait is untouched and no
# existing app changes shape. `wasmi` is a pure-Rust interpreter (no codegen
# backend, no C toolchain), so enabling this keeps the single-binary deploy
# story intact.
#
# Not a default feature of `autumn-web`: an application opts in explicitly.
# Note that `autumn-cli` enables it unconditionally (its `plugin package` /
# `plugin inspect` commands read and write the container and load the module
# into the same sandbox the runtime uses), so a `--workspace` build of this
# repo does compile it via feature unification. That is deliberate — it means
# the always-on workspace clippy and test lanes cover the module — but it is
# why "off by default" is a statement about `autumn-web`'s feature set, not
# about every build in the tree.
plugin-sandbox = ["dep:wasmi"]

[dependencies]
autumn-edge = { version = "0.7.0", path = "../autumn-edge", optional = true }
# Pure-Rust WebAssembly interpreter behind the `plugin-sandbox` feature. Already
# resolved in `Cargo.lock` via `autumn-edge`'s reference host, so this adds no
# new crate to the workspace graph. MSRV 1.86 (below this workspace's 1.88
# floor); licensed MIT OR Apache-2.0.
wasmi = { version = "0.40", optional = true }
# `default-features = false` drops the `#[model]` / `#[repository]` codegen from
# the macro crate; the `db` feature above forwards it back on. A no-database app
# could never reach either macro anyway (both re-exports are `#[cfg(feature =
# "db")]` in `src/lib.rs`), and skipping them cuts the macro crate's own compile
# time by ~90% on the no-DB onboarding path (issue #2309).
autumn-macros = { version = "0.7.0", path = "../autumn-macros", default-features = false }
axum.workspace = true
# 1.9 for `Bytes::from_owner`, which is what lets a response buffer own the
# sandbox concurrency permit and release it exactly when the last handle drops.
bytes = "1.9"
# Best-effort ASCII folding for `slug::slugify` (issue #1260, e.g. "café" ->
# "cafe"). Already resolved transitively (via `stringprep`, the Postgres
# SCRAM-auth crate), so this adds no new entry to the dependency graph.
unicode-normalization = "0.1"
http-body = "1"
http-body-util = "0.1"
# Both already resolved transitively via tower-http's compression-gzip/
# compression-br features (used to precompute static CSS encodings once
# instead of recompressing on every request — see `static_css_response`).
flate2 = "1"
brotli = "8"
bcrypt.workspace = true
deadpool = { version = "0.13", default-features = false, features = ["managed", "rt_tokio_1"], optional = true }
diesel = { workspace = true, optional = true }
pq-sys = { workspace = true, optional = true }
diesel-async = { workspace = true, optional = true }
diesel_migrations = { workspace = true, optional = true }
scoped-futures = { version = "0.1.4", optional = true }
tokio-postgres = { version = "0.7", optional = true }
# TLS to Postgres (`sslmode=require`/`verify-full` in the database URL):
# rustls-backed connector plugged into diesel-async's pool via a custom
# setup callback. `ring` (not the aws-lc default) keeps cross-compilation
# to mobile targets working; `webpki-roots` provides a deterministic root
# store on platforms without an accessible native one.
tokio-postgres-rustls = { version = "0.13", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }
webpki-roots = { version = "1", optional = true }
# Inbound/server TLS (issue #1603, `tls` feature): async accept-time rustls
# handshake wrapping the existing TCP listener. `default-features = false` +
# `ring` reuses the SAME crypto backend as the outbound Postgres TLS path —
# the workspace forbids a second TLS backend (no aws-lc-rs / native-tls).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"], optional = true }
# Parse the leaf certificate's `NotAfter` for fail-fast expired-cert detection
# at startup and the `autumn doctor` near-expiry warning. Only pulled by `tls`.
x509-parser = { version = "0.16", optional = true }
# Automatic ACME (Let's Encrypt) provisioning (issue #1608, `acme` feature).
# Both pinned `default-features = false` + `ring` so the ACME path reuses the
# SAME crypto backend as the rest of autumn-web — the workspace forbids a second
# TLS/crypto backend (no aws-lc-rs), which the crates' defaults would pull in.
instant-acme = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
# Build the dual-stack (`[::]`, IPV6_V6ONLY=false) HTTP-01 challenge listener so
# the ACME CA can validate over IPv6 on AAAA-only deployments (issue #1608).
socket2 = { workspace = true, optional = true }
postgresql_embedded = { version = "0.19", optional = true, default-features = false, features = [
    "tokio",
    "theseus",
    "rustls",
] }
futures.workspace = true
http.workspace = true
indexmap.workspace = true
inventory.workspace = true
libsqlite3-sys = { workspace = true, optional = true }
# Conflict oracle for the #1012 duplicate-route preflight. axum 0.8 routes
# through matchit, so we delegate path-shape conflict detection to the SAME
# engine axum uses. This version MUST stay pinned to whatever axum resolves in
# Cargo.lock (currently axum 0.8.9 → matchit 0.8.4); moving axum without moving
# this in lockstep risks the oracle silently diverging from axum's real accept/
# panic behavior. The `matchit_agrees_with_axum_route_conflicts` parity test in
# `router.rs` is the guard — it fails loudly if the two ever disagree.
matchit = "=0.8.4"
maud = { workspace = true, optional = true }
moka = { workspace = true, optional = true }
multer = { workspace = true }
pin-project-lite = "0.2"
serde.workspace = true
serde_json = "1"
# Version-requirement matching for the plugin API stability contract
# (issue #1601). `semver` has no transitive dependencies.
semver.workspace = true
thiserror.workspace = true
# `test-util` is required at runtime by the `#[sim_test]` macro (S-1797): its
# generated code builds a `start_paused(true)` current-thread runtime so
# simulation tests run against a paused virtual clock. Enabled here (not just as
# a dev-dependency) so a downstream crate's `#[sim_test]` compiles out of the box.
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["io"] }
toml.workspace = true
# `util` is needed for `tower::util::option_layer`, which turns an
# `Option<Layer>` into a `Layer` (`Either<L, Identity>`) so a conditionally
# applied middleware can still join the statically-composed ingress layer
# tuples in `router.rs` instead of costing its own `Router::layer` call — and
# therefore its own `BoxCloneSyncService` nesting level (issue #2193). It pulls
# in no crates the build does not already have: axum enables the same tower
# feature.
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
tokio-cron-scheduler.workspace = true
validator.workspace = true
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
rand_chacha = "0.9"
chrono = { workspace = true }
chrono-tz.workspace = true
rust_decimal.workspace = true
croner = "3.0.1"
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }
proptest = { version = "1.4", optional = true }
serde_urlencoded = "0.7"
serde_path_to_error = "0.1"
serde_yaml = { version = "0.9", optional = true }
pulldown-cmark = { workspace = true, optional = true }
ammonia = { workspace = true, optional = true }
subtle = "2.6.1"
base64 = "0.23"
url = "2.5.8"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"], optional = true }
jsonwebtoken = { version = "10.1.0", default-features = false, features = ["rust_crypto"] }
secrecy = { version = "0.10.3", features = ["serde"] }
lru = "0.18.0"
hmac = "0.12"
sha2 = "0.10"
infer = { version = "0.16", optional = true }
sha1 = { version = "0.10", optional = true }
rsa = { version = "0.9", default-features = false, features = ["std", "pem"], optional = true }
aes-gcm = "0.10"
# NIST P-256 (prime256v1) for Web Push (issue #1392): ES256 VAPID JWT signing
# (RFC 8292) and the ECDH half of RFC 8291 payload encryption. Adds NO new
# crate to the graph — `jsonwebtoken` (a non-optional dependency above) already
# resolves p256 0.13 for its `rust_crypto` ES256 backend; this only adds the
# direct edge plus the `ecdh` feature, which is a feature flag on the
# already-compiled `elliptic-curve`, not a new dependency.
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "std"] }
getrandom = "0.2"
hex = "0.4"
include_dir = { version = "0.7", optional = true }
csv = { workspace = true, optional = true }
# Pure-Rust PDF writer for `autumn_web::pdf` (issue #1317). `default-features
# = false` drops the `html` feature (an azul-based CSS layout engine plus
# `rust-fontconfig` system-font scanning) — Autumn ships its own deliberately
# small HTML-subset-to-PDF layout using the built-in base-14 fonts, so no
# system font lookup and no embedded font files are needed at runtime.
printpdf = { workspace = true, optional = true }
lettre = { version = "0.11.21", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"], optional = true }
# CSS inliner for HTML email (issue #1254). `default-features = false` drops the
# optional network (`http`/reqwest) and local-file stylesheet fetchers — Autumn
# only inlines embedded `<style>` blocks, never remote CSS — keeping the added
# graph to the html5ever/selectors parsing stack. Gated behind the `mail` feature.
css-inline = { version = "0.21", default-features = false, optional = true }
chromiumoxide = { workspace = true, optional = true }
image = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# `umask` (via the safe `nix` wrapper) for binding `server.unix_socket` with
# owner-only permissions from creation, closing the bind→chmod race on
# user-configured socket paths in shared directories.
nix = { version = "0.31.2", features = ["fs"] }

[dev-dependencies]
# Counting global allocator behind a safe API, used by the isolated
# `config_alloc_gate` test binary. A hand-rolled `unsafe impl GlobalAlloc` is
# not an option here: `[workspace.lints.rust] unsafe_code = "forbid"` applies to
# this package's test targets too, and a crate-level `#![allow(unsafe_code)]`
# cannot lift a forbid (E0453). The crate installs its `#[global_allocator]` on
# link, so only binaries that actually reference it are affected.
allocation-counter = "0.8.1"
diesel = { version = "2", features = ["chrono", "postgres"] }
filetime = "0.2"
futures.workspace = true
http.workspace = true
serde_json = "1"
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["timeout", "util"] }
trybuild = "1"
# Compiles the hand-written WAT guest modules the plugin-sandbox suite uses as
# fixtures (a hello guest and the adversarial escape corpus) into wasm bytes at
# test time. Pure Rust, so the escape suite runs on any CI runner with no
# `wasm32-wasip1` toolchain installed. Test-only.
wat = "1"
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
redis.workspace = true
proptest = "1.4"
time = { workspace = true }
tokio-tungstenite = "0.29.0"
loom = "0.7.2"
temp-env = { version = "0.3.6", features = ["async_closure"] }
rustversion = "1"
rusty-fork = "0.3.1"
# TLS stub server for the Postgres sslmode integration tests (already in the
# dependency graph via the db feature — no new crates).
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }

# docs.rs feature posture: include all features except those that require
# system libraries unavailable in the docs.rs sandbox.
#   telemetry-otlp — requires protoc (grpc-tonic → tonic → prost-build)
#   test-support   — only meaningful in test binary contexts
[package.metadata.docs.rs]
features = [
  "maud", "htmx", "tailwind", "db", "cache-moka",
  "ws", "flash", "multipart", "http-client", "oauth2", "openapi", "mcp",
  "redis", "i18n", "storage", "variants", "mail", "seed", "system-info", "markdown",
  "reporting", "csv", "embed-assets", "offline-sync", "pdf", "edge",
  "plugin-sandbox",
  # Direct HTTPS termination (#1603). Pure Rust (rustls/ring), no system
  # libraries, so it builds in the docs.rs sandbox — and without it the whole
  # `tls` module (TlsListener, CertReloader, load_certified_key) is missing
  # from the published docs.
  "tls",
]
rustdoc-args = ["--cfg", "docsrs"]

