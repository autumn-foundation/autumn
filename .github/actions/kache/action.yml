name: kache build cache
description: >
  Restores this job's kache compiler cache, sets RUSTC_WRAPPER so every rustc
  and C/C++ compile goes through it, and saves the cache after the job. On a
  macOS runner it uses Swatinem/rust-cache instead. The one place the repo
  configures kunobi-ninja/kache-action and Swatinem/rust-cache.

# macOS uses Swatinem/rust-cache, not kache. The macOS test archive is bound by
# the runner's memory and disk (see `test-archive` in ci.yml), and kache adds
# a daemon and a second copy of every artifact in its store beside target/.
# rust-cache keeps one target/ directory and nothing else. On macOS the `s3`
# and `warm` inputs have no effect, and the cache is the GitHub Actions cache.

# kache caches each compile by the hash of its inputs, not a whole target
# directory. A hit needs the same inputs, compiler and flags, so one store can
# serve several feature sets and every workspace crate whose source did not
# change. See docs/adr/0038-kache-build-cache.md.
#
# Two backends:
#
# - S3 (an S3-compatible bucket, such as R2). One content-addressed store for
#   every job, branch and PR. A run on a protected ref (`github.ref_protected`:
#   a push to trunk or trunk-dev, a schedule) uploads what it compiled, so the
#   store grows with every push. Every other run, PRs included, only reads.
#   Selected when the calling workflow's env carries AUTUMN_KACHE_S3_BUCKET and
#   a read key; see "S3 settings" below.
# - The GitHub Actions cache, when S3 is not configured, or the run has no
#   read key (a fork PR gets no secrets). Its key is <prefix>-<kache version>-
#   <os>-<arch>-<Cargo.lock hash>, and the action never re-saves a key that
#   exists, so the prefix separates every job whose builds differ: workflow,
#   job id, `key`, and the exact rustc.
#
# S3 settings. A composite action cannot read `secrets` or `vars`, so each
# workflow that uses this action maps them into its env:
#
#   AUTUMN_KACHE_S3_BUCKET, _ENDPOINT, _REGION        repository variables,
#                                                      or secrets of the
#                                                      same name
#   AUTUMN_KACHE_S3_READ_ACCESS_KEY_ID, _SECRET_KEY    a read-only token
#   AUTUMN_KACHE_S3_WRITE_ACCESS_KEY_ID, _SECRET_KEY   a read-write token,
#                                                      mapped only when
#                                                      github.ref_protected

inputs:
  key:
    description: >
      Extra key part for a job whose matrix legs build different things, such
      as a feature lane. rustc and the OS are already in the key.
    required: false
    default: ""
  shared-key:
    description: >
      Use one entry across several jobs that run the identical build. Replaces
      the job id in the key.
    required: false
    default: ""
  save:
    description: "Set to false for a job that only restores."
    required: false
    default: "true"
  s3:
    description: >
      Set to false to use the GitHub Actions cache even when S3 is set up.
    required: false
    default: "true"
  warm:
    description: >
      Set to false to stop the S3 prefetch of this build's manifest. kache
      then downloads an artifact only when a compile asks for it. For a
      runner with little memory or disk. No effect on the GitHub cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        KEY: ${{ inputs.key }}
        SHARED_KEY: ${{ inputs.shared-key }}
      run: |
        set -euo pipefail
        workflow=$(printf '%s' "$GITHUB_WORKFLOW" | tr -c 'A-Za-z0-9._-' '-')
        rustc_id=$(rustc -vV | awk '/^release:/ { r = $2 } /^commit-hash:/ { c = substr($2, 1, 12) } END { print r "-" c }')
        host=$(rustc -vV | awk '/^host:/ { print $2 }' | tr -d '\r')
        if [ -n "$SHARED_KEY" ]; then
          scope="$SHARED_KEY"
        else
          scope="$GITHUB_JOB${KEY:+-$KEY}"
        fi
        echo "scope=$workflow-$scope-$rustc_id" >> "$GITHUB_OUTPUT"
        echo "prefix=kache-$workflow-$scope-$rustc_id" >> "$GITHUB_OUTPUT"
        echo "workflow=$workflow" >> "$GITHUB_OUTPUT"
        # The S3 manifest has no OS part of its own. Without the host, the
        # Linux, macOS and Windows legs of one shared-key write one manifest,
        # and each leg prefetches the artifacts of the last OS to save it.
        echo "manifest=$workflow-$scope-$host-$rustc_id" >> "$GITHUB_OUTPUT"
    - id: backend
      if: runner.os != 'macOS'
      shell: bash
      env:
        BUCKET: ${{ env.AUTUMN_KACHE_S3_BUCKET }}
        READ_KEY: ${{ env.AUTUMN_KACHE_S3_READ_ACCESS_KEY_ID }}
        WRITE_KEY: ${{ env.AUTUMN_KACHE_S3_WRITE_ACCESS_KEY_ID }}
        PROTECTED: ${{ github.ref_protected }}
        SAVE: ${{ inputs.save }}
        S3_ALLOWED: ${{ inputs.s3 }}
      run: |
        set -euo pipefail
        if [ "$S3_ALLOWED" = true ] && [ -n "$BUCKET" ] && [ -n "$READ_KEY" ]; then
          # Write only from a protected ref, with the write token, and only in
          # a job that saves at all. Anything else reads.
          if [ "$PROTECTED" = true ] && [ -n "$WRITE_KEY" ] && [ "$SAVE" = true ]; then
            write=true
          else
            write=false
          fi
          echo "s3=true" >> "$GITHUB_OUTPUT"
          echo "write=$write" >> "$GITHUB_OUTPUT"
          echo "save=$write" >> "$GITHUB_OUTPUT"
          echo "kache: S3 remote, writes $write (protected ref: $PROTECTED)"
        else
          # Keys with no bucket is a setup error, not a fork PR. Say so in the
          # run's annotations, or the fallback looks like a working cache.
          if [ "$S3_ALLOWED" = true ] && [ -z "$BUCKET" ] && [ -n "$READ_KEY" ]; then
            echo "::warning title=kache S3 not used::AUTUMN_KACHE_S3_BUCKET is empty, but the S3 keys are set. Add AUTUMN_KACHE_S3_BUCKET (and _ENDPOINT for R2) as a repository variable or secret."
          fi
          echo "s3=false" >> "$GITHUB_OUTPUT"
          echo "write=false" >> "$GITHUB_OUTPUT"
          echo "save=$SAVE" >> "$GITHUB_OUTPUT"
          echo "kache: S3 off for this job, or no S3 remote or read key; using the GitHub Actions cache"
        fi
    # v1 as of 2026-09-25.
    - if: runner.os != 'macOS'
      uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed
      with:
        version: v2.0.0
        cache-key-prefix: ${{ steps.key.outputs.prefix }}
        save-cache: ${{ steps.backend.outputs.save }}
        s3-bucket: ${{ steps.backend.outputs.s3 == 'true' && env.AUTUMN_KACHE_S3_BUCKET || '' }}
        s3-endpoint: ${{ steps.backend.outputs.s3 == 'true' && env.AUTUMN_KACHE_S3_ENDPOINT || '' }}
        s3-region: ${{ env.AUTUMN_KACHE_S3_REGION || 'auto' }}
        # The `backend` step guarantees the chosen key is non-empty whenever
        # `s3` is true, so the inner `||` never falls through to the other key.
        s3-access-key-id: ${{ steps.backend.outputs.s3 == 'true' && (steps.backend.outputs.write == 'true' && env.AUTUMN_KACHE_S3_WRITE_ACCESS_KEY_ID || env.AUTUMN_KACHE_S3_READ_ACCESS_KEY_ID) || '' }}
        s3-secret-access-key: ${{ steps.backend.outputs.s3 == 'true' && (steps.backend.outputs.write == 'true' && env.AUTUMN_KACHE_S3_WRITE_SECRET_ACCESS_KEY || env.AUTUMN_KACHE_S3_READ_SECRET_ACCESS_KEY) || '' }}
        # One prefetch manifest per build variant and host, so lanes and OSes
        # do not overwrite each other's. The store itself is shared.
        manifest-key: ${{ steps.key.outputs.manifest }}
        warm: ${{ inputs.warm }}
        # aws-lc-sys and other build scripts compile C through the cc crate.
        # Without this, those compiles miss on every run. Off on Windows: with
        # no CC set, the action swaps MSVC cl.exe for clang-cl there, which
        # would change the C toolchain the build uses.
        cache-c-cpp: ${{ runner.os != 'Windows' }}
        # A Windows runner's default cache dir is on C: and the workspace on
        # D:, so restores would copy instead of hardlink.
        cache-dir: ${{ runner.os == 'Windows' && format('{0}/kache', runner.temp) || '' }}
        # A sticky comment per job would notify everyone on the PR. The job
        # summary carries the same stats.
        pr-comment: false
    # v2.9.3.
    - if: runner.os == 'macOS'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        # The workflow in the prefix, as in the kache prefix, so jobs with one
        # id in two workflows do not share an entry. rust-cache adds the job
        # id (or `shared-key`), `key`, the OS and arch, and a hash of rustc,
        # Cargo.lock and the Cargo.toml files.
        prefix-key: v0-rust-${{ steps.key.outputs.workflow }}
        shared-key: ${{ inputs.shared-key }}
        key: ${{ inputs.key }}
        save-if: ${{ inputs.save == 'true' }}
        # kache saves after a failed job too, and a red suite is what the next
        # run iterates against.
        cache-on-failure: true
        # Tools come from their pinned installs, as with kache. install-action
        # skips its verified download when the pinned version is already in
        # $CARGO_HOME/bin.
        cache-bin: false
