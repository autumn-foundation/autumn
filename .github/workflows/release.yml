name: Release

# Triggered only when the Publish Gate workflow completes successfully on a
# tag push.  All gate jobs (including prepare-release) must pass before this
# workflow runs.  The release artifacts (RELEASE_NOTES.md and the tag name)
# are produced by the prepare-release job inside Publish Gate and downloaded
# here — no checkout of user-controlled code is needed in this privileged
# workflow_run context.
#
# Every asset attached to the release carries a keyless SLSA build-provenance
# attestation (issue #1615), so a consumer can prove it came from this
# repository's CI:
#
#   gh attestation verify autumn-<tag>.cdx.json --repo autumn-foundation/autumn
#
# The SBOM's attestation is minted by the Publish Gate's `sbom` job, not here.
# That job is triggered by the tag push, so its provenance records the TAG and
# the tagged commit; this workflow is `workflow_run`-triggered and so runs in
# default-branch context, where the recorded ref would be the default branch.
# The attestation binds the file's digest, and the step below only renames it,
# so it still verifies against the published asset. The CLI archives are built
# and attested the same way: the Publish Gate's `cli-binaries` job calls
# cli-release.yml. The `binaries` job below only downloads and uploads them.
#
# See docs/guide/supply-chain.md.
on:
  workflow_run:
    workflows: ["Publish Gate"]
    types: [completed]

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # Only proceed when Publish Gate succeeded and was itself triggered by a tag push.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read and validate release tag
        id: tag
        run: |
          RELEASE_TAG="$(cat release-tag.txt)"
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "error: release-tag.txt is empty" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "error: tag '${RELEASE_TAG}' is not a semver release tag" >&2
            exit 1
          fi
          echo "name=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" =~ -(alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # The SBOM was generated AND re-verified against the tagged source by
      # the Publish Gate's `sbom` job; this workflow only re-checks that the
      # artifact survived the handoff, then publishes it. Naming it after the
      # tag keeps multiple releases' assets distinguishable once downloaded.
      # The tag reaches the shell through the environment, never through
      # `${{ }}` interpolation into the script body: the validation regex above
      # is unanchored at its end, so a crafted tag could otherwise inject shell.
      - name: Stage the SBOM release asset
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          test -s sbom.cdx.json || { echo "error: no SBOM in the release artifacts" >&2; exit 1; }
          mv sbom.cdx.json "autumn-${TAG}.cdx.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          files: autumn-${{ steps.tag.outputs.name }}.cdx.json

  binaries:
    name: Attach CLI binaries
    needs: release
    runs-on: ubuntu-latest
    # A job-level `permissions:` block REPLACES the workflow-level one.
    # `actions: read` lets the download read the gate run's artifacts.
    # `attestations: read` lets `gh attestation verify` fetch the bundles.
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      # The archives were built and attested by the Publish Gate. Nothing is
      # rebuilt here, so the attestation stays valid for the uploaded bytes.
      - name: Download the attested CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: autumn-*
          merge-multiple: true
          path: cli-archives
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # An archive and its checksum for each of the five targets. A short
      # download must stop the job: a release without binaries breaks
      # `scripts/install.sh` and the `releases/latest/download/...` URLs.
      - name: Upload CLI archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(cli-archives/autumn-*.tar.gz cli-archives/autumn-*.zip cli-archives/autumn-*.sha256)
          if [[ "${#assets[@]}" -ne 10 ]]; then
            echo "error: expected 10 CLI assets, found ${#assets[@]}" >&2
            ls -la cli-archives >&2 || true
            exit 1
          fi
          # Check each file against its attestation. This proves the bytes came
          # from the tag build of `cli-release.yml`.
          for f in "${assets[@]}"; do
            gh attestation verify "$f" \
              --repo "$GITHUB_REPOSITORY" \
              --source-ref "refs/tags/$TAG" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cli-release.yml"
          done
          (cd cli-archives && sha256sum -c -- *.sha256)
          gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
