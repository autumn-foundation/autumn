name: CI

on:
  push:
    branches: [trunk, trunk-dev]
  pull_request:
    branches: [trunk, trunk-dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # `Cli::try_parse_from` builds this CLI's entire clap command tree inside a
  # single `Commands::augment_subcommands` frame, which is close enough to the
  # 2 MiB default thread stack that adding one subcommand can overflow it — and
  # the margin differs per platform, so it surfaces on Windows first. The tests
  # are correct; only the stack they run on is marginal. Raise it explicitly
  # rather than leaving the suite one variant away from aborting.
  RUST_MIN_STACK: 8388608

jobs:
  meta:
    uses: ./.github/workflows/runner-routing.yml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      # `cargo clippy --workspace --all-targets` compiles autumn-web alongside
      # every example crate at once. At the default parallelism (one job per
      # vCPU) that peaks close enough to a 16 GB hosted runner's memory that the
      # job has repeatedly died ~60s in with `exit 143` and "The runner has
      # received a shutdown signal" — the host reclaiming the runner agent, not
      # a lint failure: when it survives, the same step passes in ~7 minutes.
      # Capping the compile jobs bounds that peak. This job gates `test`,
      # `loom` and `coverage`, so a runner death here skips the whole suite.
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.7.8
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        # `-j 2` caps codegen parallelism. This step checks the whole workspace
        # with `--all-targets`, and at cargo's default (one job per core, 4 on
        # ubuntu-latest) its peak memory exceeds the runner's 16 GB while
        # `Checking autumn-web` — the largest crate. The runner is then
        # reclaimed mid-step and the job reports `exit code 143` with
        # "The runner has received a shutdown signal" and no clippy diagnostic
        # at all, which reads like infrastructure flake rather than what it is.
        #
        # It is marginal rather than deterministic — the same command succeeds
        # on some runs — so it surfaced as an intermittent red that re-running
        # sometimes cleared, on trunk-dev and on every branch cut from it.
        # Reproduced locally on a 15 GB box: `--workspace --all-targets` is
        # OOM-killed at `-j 4` and completes clean at `-j 2`.
        run: cargo clippy -j 2 --workspace --all-targets -- -D warnings
      - name: Clippy (autumn-web, gated request-path features — panic gate)
        # The default-feature Clippy above does not compile the feature-gated
        # request-path modules (channels→ws, mail→mail, sync/*→offline-sync,
        # session_redis→redis), so their `#![cfg_attr(not(test), deny(clippy::…))]`
        # panic-gate lints never fire. Lint them with their features enabled so an
        # unannotated `.unwrap()` in those production paths fails CI. (`--all-features`
        # is unusable here: `managed-pg-bundled` pulls in `postgresql_embedded`, whose
        # build script downloads Postgres binaries; this explicit list covers exactly
        # the gated modules with no new services.)
        #
        # `tls` is in the list for the determinism seam gate (#1797), not the
        # panic gate. `autumn/src/tls.rs` owns `fn now_unix` — the one site in
        # THAT MODULE that reads real wall time on purpose (certificate validity
        # is a fact about the real world), used from `app.rs`'s bind path and the
        # `CertReloader` poll loop. That function — and the
        # `#[allow(clippy::disallowed_methods, reason = "…")]` justifying it — is
        # only COMPILED when `tls` is on, so without it here the deny never sees
        # the site and a later off-seam read added next to it would ship unlinted.
        # This also lints the whole `tls`-gated tree under `-D warnings`.
        #
        # `acme` joined the set in #1608, which closes the gap the `tls`-only
        # version of this comment recorded: `acme/renewal.rs` has its own
        # `now_unix`, and `--all-targets` lints only what the enabled features
        # compile, so until `acme` was listed here the entire ACME tree — that
        # seam included — was never linted at all.
        #
        # `inbound-mail`/`inbound-mailgun`/`inbound-ses` gate `inbound_mail`, which
        # parses untrusted RFC 5322 / MIME bodies straight off an unauthenticated
        # webhook route, and `storage` gates the upload path — both are request-path
        # modules carrying the panic gate, so they have to be in this feature list
        # for their `deny(clippy::…)` block to be compiled at all.
        run: cargo clippy -p autumn-web --features "ws,mail,offline-sync,redis,markdown,inbound-mail,inbound-mailgun,inbound-ses,storage,tls,acme" --all-targets -- -D warnings
      - name: Clippy (autumn-web, plugin-sandbox — panic gate)
        # `plugin-sandbox` (#1609) is not a default feature, so neither Clippy run
        # above compiles `plugin_sandbox`'s request-path modules and their
        # `#![cfg_attr(not(test), deny(clippy::…))]` panic gates never fire. This is
        # the module set where an unannotated panic matters most: `host.rs` runs an
        # interpreter over an artifact the operator explicitly did not audit, and
        # the whole promise of the lane is that nothing a hostile guest does can
        # abort the host process.
        #
        # Kept as its own lane rather than folded into the list above so a
        # `wasmi`-linking build is not forced on every gated-feature Clippy run.
        run: cargo clippy -p autumn-web --features "plugin-sandbox,test-support" --all-targets -- -D warnings
      - name: Panic-free request-path gate
        run: ./scripts/check-panic-gate.sh
      - name: Determinism seam gate
        # Companion to the clippy runs above (issue #1797). `clippy.toml` bans
        # direct `Instant::now` / `Utc::now` / `SystemTime::now` /
        # `Uuid::new_v4`, and each gated module re-denies
        # `clippy::disallowed_methods` for its production path — so the clippy
        # steps do the detection. THIS step keeps them able to see it: manifest
        # integrity, header shape, config completeness, the absence of a
        # module-wide `allow` spoof or a crate-local `clippy.toml` that would
        # shadow the config entirely. No toolchain, ~2 seconds, self-testing.
        run: ./scripts/check-determinism-gate.sh
      - name: Accessibility gate (raw html! escape hatches across the repo)
        # `autumn a11y verify` statically audits raw `html!` markup for fields
        # that bypass the typed a11y primitives and lack an accessible name.
        # Scoped to the whole repo root now that the framework source, the admin
        # plugin, and every example are clean (issue #1934). The scanner skips
        # `target/`, dot-dirs, and `tests/` directories (test scaffolding and the
        # committed red/green fixtures), so a single invocation over `.` fails the
        # job on any real product finding.
        run: cargo run -p autumn-cli --bin autumn -- a11y verify .

  migration-guides:
    name: Migration guide coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history. The plugin-surface gate below asks "did THIS change
          # touch the declared plugin surface?", which needs a merge base with
          # the target branch. At the default depth 1 there is none, and a gate
          # that cannot compute its own question is a gate that fails — so
          # without this the job goes red rather than silently green. Cheap: no
          # toolchain, no cache, docs-only checks.
          fetch-depth: 0
      - name: Migration guide coverage gate
        # Pre-1.0, most releases can break existing apps, and the only prior
        # check keyed off a `### Breaking` CHANGELOG heading this repo has
        # never written — so it never fired, and 0.6.0 shipped the `with_pool`
        # -> `with_pool_untracked` rename with no guide entry. This runs on
        # every PR (not just at tag time) so the guide is written by the author
        # of the break, while the change is still in review. See issue #1588.
        #
        # Its own job on purpose: docs-only, no toolchain and no cache, so it
        # reports in seconds under its own name in the checks UI instead of
        # queueing behind ~20 minutes of workspace clippy in `lint` — and a
        # clippy failure can't stop it from running.
        run: ./scripts/check-migration-guides.sh
      - name: Migration version gate
        # Framework, plugin and app migrations share one version space: diesel
        # keys `__diesel_schema_migrations` on the 14-digit version and
        # `autumn_migration_checksums` makes it a PRIMARY KEY, so two
        # migrations claiming one version are not two migrations — the loser
        # silently never runs. Hand-written `YYYYMMDD000000` names collide by
        # construction, which is how `examples/reddit-clone` ended up with
        # `20260513000001` and `20260702000001` hand-bumped off framework
        # versions, and how `00000000000000` came to be shared by the
        # framework, the starters, the benchmark app and eight examples.
        #
        # The generators already mint a full YYYYMMDDHHMMSS
        # (`autumn generate migration`, `autumn schema diff
        # --write-migration`); this gate is here because they get bypassed by
        # hand-created directories. Pre-existing offenders are grandfathered
        # in scripts/migration-version-baseline.txt and are deliberately NOT
        # renamed — they have already been applied to real databases.
        #
        # Shares this docs-only job for the same reason as the gate above: no
        # toolchain, no cache, reports in seconds.
        run: ./scripts/check-migration-versions.sh
      - name: Skill version marker gate
        # The `autumn-web` agent skill annotates each API with the release it
        # arrived in. Those markers are hand-maintained and drifted badly
        # across the 0.6.0 -> 0.7.0 cut — a marker naming too NEW a release
        # tells a reader an API is out of reach when it already shipped, which
        # is the damaging direction. Nothing mechanical caught it; a review
        # did, repeatedly. This resolves every issue-referenced marker against
        # the CHANGELOG section that introduced it.
        #
        # Shares the docs-only `migration-guides` job for the same reason that
        # job exists standalone: no toolchain, no cache, reports in seconds,
        # and cannot be blocked by a clippy failure in `lint`.
        run: ./scripts/check-skill-version-markers.sh
      - name: Markdown link gate
        # `check-docs.sh` gates rustdoc intra-doc links and
        # `check-plugin-freshness.sh` gates the docs/guide paths named from
        # skills/ and agents/ — but nothing checked the markdown corpus
        # itself. A guide could link to a page that was renamed, never
        # written, or lives one directory up, and nothing noticed: the
        # baseline run found 19 such links across 11 pages, including five
        # rustdoc paths (`[x](autumn_web::aggregate::GroupedAggregate)`)
        # pasted into hand-written markdown, where they render as relative
        # links to a directory that does not exist.
        #
        # Unlike a wrong sentence, a 404 is a defect the reader cannot route
        # around, so this is a gate rather than a report.
        #
        # Shares this docs-only job for the same reason as the gates above:
        # no toolchain, no cache, reports in seconds.
        run: ./scripts/check-docs-links.sh
      - name: CLI drift gate
        # The link gate above stops a reader being sent to a page that does not
        # exist. This one stops them being handed a *command* that does not
        # exist — the other thing they copy off a page. The CLI carries 174
        # command paths and the reader-facing docs name them 2,400+ times, so a
        # renamed or never-shipped subcommand leaves a line that looks exactly
        # like a working one.
        #
        # The baseline run found `autumn migrate run` across three guide pages —
        # a command `MigrateCommands` has never had (the run action is the bare
        # `autumn migrate`) — one of them in a fenced shell block under "run the
        # migration before deploying new workers", so the reader most likely to
        # copy it was mid-production-upgrade. Clap answers `unrecognized
        # subcommand 'run'`: a dead end, not a hint.
        #
        # The truth set is parsed from the clap derive input rather than a
        # checked-in snapshot, so a rename moves the gate with it in the same
        # commit and there is nothing to regenerate.
        #
        # Shares this docs-only job for the same reason as the gates above:
        # no toolchain, no cache, reports in seconds.
        run: ./scripts/check-docs-cli.sh --self-test && ./scripts/check-docs-cli.sh
      - name: Config key gate
        # The two gates above cover the link a reader clicks and the command
        # they run. This covers the third thing they copy off a page — an
        # `AUTUMN_*` environment variable — and the only one of the three that
        # fails silently.
        #
        # A wrong link 404s and a wrong command exits 2. A wrong env var is
        # simply not read: the process starts, the default stands, and nothing
        # says the override was ignored. `autumn check --config` and
        # `server.strict_config` reject an unknown key in `autumn.toml`, but
        # neither sees the env layer. So `AUTUMN_DATABASE_URL` (one underscore,
        # the pre-0.2 spelling) beside a production Postgres URL reads exactly
        # like a working line, and the app comes up on the default database.
        #
        # The reader-facing corpus names 658 of these across 175 pages, and the
        # baseline run resolved every one — this gate is here to keep it that
        # way, and to gate the 142-row `AUTUMN_* -> config path` table in
        # config.rs's module docs, which is hand-maintained and is the mapping
        # readers meet on docs.rs.
        #
        # The question is whether the runtime READS a name, not whether a config
        # key is spelled like it. Those differ: the env layer is written field by
        # field, so a TOML key with no override of its own has no environment
        # spelling — `openapi.enabled` is a real schema leaf and
        # `AUTUMN_OPENAPI__ENABLED` is read by nothing, as are 90 of the 397
        # leaves. A name resolves when the tree binds or reads it, or when it
        # matches one the runtime builds. `schema_keys.snapshot` — the same walk
        # that backs strict unknown-key validation, kept honest by
        # `schema_keys_snapshot_guard` — bounds the one open-ended template and
        # checks declared config paths. Nothing to regenerate, no Rust toolchain.
        #
        # Shares this docs-only job for the same reason as the gates above:
        # no toolchain, no cache, reports in seconds.
        run: ./scripts/check-docs-config.sh --self-test && ./scripts/check-docs-config.sh
      - name: Plugin surface gate
        # The declared plugin API surface (issue #1601) has a compiled half —
        # the `plugin-contract` job below builds `autumn-plugin-reference`
        # against the changed framework — and a documentary half this step
        # guards: the docs table matching `PLUGIN_SURFACES`, the ratchet on the
        # stable count, and the rule that a change to the declared surface
        # updates `docs/migrations/next.md`'s "Plugin authors" section.
        #
        # Needs the merge base with the target branch, which is why this job's
        # checkout sets `fetch-depth: 0` above. The gate fails rather than
        # skipping when it cannot compute that — a surface change must not be
        # able to pass by being unmeasurable.
        #
        # Shares this docs-only job for the same reason as the gates above: no
        # toolchain, no cache, reports in seconds. Self-tests first.
        env:
          # On a pull_request this is the branch being merged into; on a push to
          # trunk-dev there is no base_ref, and the merge base with trunk-dev is
          # HEAD itself, so the surface-change question correctly answers "no".
          BASE_REF: origin/${{ github.base_ref || 'trunk-dev' }}
        run: ./scripts/check-plugin-surface.sh

  plugin-contract:
    name: Plugin API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
      - name: Compile the pinned reference plugin against this framework
        # `autumn-plugin-reference` calls every surface declared
        # `SurfaceTier::Stable` in `autumn/src/plugin_contract.rs`. Removing,
        # renaming, or re-signaturing one breaks THIS build — which is the
        # whole gate (issue #1601): a plugin-surface break becomes a red check
        # on the PR that causes it, instead of a broken build in somebody's
        # plugin crate after they upgrade.
        #
        # Its own job rather than a step in `test`: the point is that it
        # reports under its own name, so "did this break plugins?" is
        # answerable at a glance rather than buried in the workspace suite.
        #
        # Cost: the crate itself is tiny, but it depends on autumn-web with
        # DEFAULT features, so a cold cache is a full framework build (tens of
        # minutes), and this job name gets its own `rust-cache` entry against
        # the repo's shared cache budget. Warm runs are a couple of minutes.
        run: cargo test -p autumn-plugin-reference --all-features
      - name: Check the flagship first-party plugin still builds
        # The success metric in issue #1601 names both the reference plugin and
        # autumn-admin-plugin. The reference plugin proves the DECLARED surface;
        # the admin plugin proves a real, non-trivial consumer of it.
        run: cargo check -p autumn-admin-plugin --all-targets

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Registry cache only. `cache-bin` would restore $CARGO_HOME/bin, and
      # install-action skips its verified download when the pinned version is
      # already there — the auditor this gate trusts must come from the pin,
      # not from a cache entry.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-deny@0.20.2
      # Advisories go through the shared gate (issue #1600) so PR CI, the
      # publish gate and a local run are literally the same check: the
      # workspace graph, the SQLite backend graph, and the day-one graph of a
      # freshly scaffolded app audited against the `deny.toml` that `autumn
      # new` ships. It retries the advisory-database fetch and fails closed if
      # the database stays unreachable.
      - name: Dependency advisory gate
        run: ./scripts/check-advisories.sh
      # A gate nobody has watched fail is indistinguishable from one that no
      # longer runs: this audits a throwaway crate with an injected
      # known-vulnerable dependency and requires the gate to reject it, then to
      # accept it once — and only once — the advisory is waived.
      - name: Advisory gate self-test (injected vulnerable dependency)
        run: ./scripts/check-advisories.sh --self-test
      - name: cargo-deny check (licenses, sources)
        run: cargo deny check licenses sources
      - name: cargo-deny check (licenses, sources; sqlite backend graph)
        run: cargo deny --config deny-sqlite.toml check licenses sources

  # ---------------------------------------------------------------------------
  # THE TEST SUITE IS SHARDED ACROSS RUNNERS.
  #
  # It used to be one `Test (<os>)` job per OS that ran, in sequence: the whole
  # workspace suite, then eight feature-flipped re-builds, then the Docker sweep.
  # On the 2026-08-26 trunk run that job was 128 minutes on Windows and 92 on
  # macOS, and it WAS the critical path of CI (2h27m end to end). Measured from
  # that run's logs, the time went:
  #
  #                             ubuntu    macos   windows
  #   compile (cargo test -W)    11.6m    29.1m     27.0m
  #   run: integration_tests     14.4m    17.4m     46.8m
  #     ...of which trybuild     10.3m    12.0m     37.1m   <-- ONE #[test]
  #   run: 142 other binaries     1.9m     5.0m      4.7m
  #   gated feature re-builds    25.0m    38.3m     44.0m
  #
  # Two facts drive the split below:
  #
  #   1. `compile_fail::*` (trybuild) was 71-79% of the consolidated
  #      `integration_tests` binary's run time, and it is the TAIL -- the binary
  #      finished 0.2s after trybuild did, on every OS. Each case shells out a
  #      nested `cargo` build, trybuild serialises them behind its project-dir
  #      lock, and libtest cannot split a single `#[test]`. So it does not get
  #      faster by adding threads; it gets faster by moving to its own runners.
  #   2. The eight gated feature lanes are INDEPENDENT re-builds of autumn-web
  #      under disjoint feature sets. Run in sequence they are ~44 minutes of
  #      pure recompilation on Windows; run side by side they are ~11.
  #
  # What is NOT sharded, deliberately: everything still runs `cargo test
  # --workspace`, so every shard sees the same globally-unified feature set that
  # decides which `#[cfg]`-gated trybuild fixtures exist. Narrowing a shard to
  # `-p autumn-web --test integration_tests` would silently drop fixtures.
  # The duplicated compile that costs is the price of that guarantee.
  #
  # Adding a shard: add it to the matrix AND to `test-gate`'s `needs`. Branch
  # protection should require ONLY `Test suite` (the `test-gate` job) -- it is
  # the one check name that stays stable as shards are added and removed.
  # ---------------------------------------------------------------------------

  test:
    name: Test (${{ matrix.os }})
    needs: [lint, meta]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os == 'ubuntu-latest' && fromJSON(needs.meta.outputs.heavy_runs_on) || matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          # The full workspace build (and, in `test-docker`, the wide-feature
          # Postgres-container sweep on top of it) sits near the runner's disk
          # ceiling; a cold-cache PR build tips it over ("No space left on
          # device"). Reclaim the preinstalled toolchains a Rust build never
          # uses before the cache is restored.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/local/lib/node_modules \
            /usr/share/swift
          sudo docker image prune --all --force || true
          df -h
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        continue-on-error: true
        with:
          # This job and every `trybuild` shard run the IDENTICAL `cargo test
          # --workspace` build and differ only in which tests they then run, so
          # they share one cache entry instead of five near-identical copies.
          # This job is the only writer (the shards set `save-if: false`).
          shared-key: workspace-test
          # Save the target dir even when the test STEP fails. rust-cache skips
          # its save on a failed job by default, and because this job is the
          # sole writer of the shared key, a red `test` means no shard ever
          # gets a warm cache — exactly when a warm cache matters most, since
          # a red suite is what you iterate against. What is being cached is
          # compiled artifacts; their validity does not depend on whether the
          # tests that ran afterwards passed.
          cache-on-failure: true
      - name: Run tests
        # Two skips, each handed to a lane of its own:
        #
        # `compile_fail::` goes to the `trybuild` job below. `sim_` goes to the
        # step right after this one. Both are substring skips over module paths
        # that nothing else shares, so the three lanes partition the suite
        # exactly — measured on the consolidated binary: 1840 + 10 + 37 = 1887,
        # with no test matching two filters.
        run: |
          cargo test --workspace -- --skip compile_fail:: --skip sim_
      - name: Run the simulation suite single-threaded
        # WHY A SEPARATE, SINGLE-THREADED LANE.
        #
        # The `sim_*` modules are determinism tests: each builds a
        # `tokio::runtime::Builder::new_current_thread().start_paused(true)`
        # runtime and asserts a seed replays byte-identically. They are
        # sensitive to CPU oversubscription, and sharding made that worse, not
        # better. Pulling trybuild out of this binary freed the whole libtest
        # thread pool: the same ~1880 tests that used to trickle through the
        # gaps between trybuild's long-running cases (863s on ubuntu) now run at
        # full parallelism in ~61s. On the 4-vCPU `ubuntu-latest` runner that
        # 14x compression is enough to flip these tests — `Test (ubuntu-latest)`
        # failed both attempts of run 8482, on `sim_retry_storm` and then
        # `sim_fault_plan`, while macOS and Windows passed on re-run.
        # Reproduced locally on a 4-core box: the same binary WITH trybuild
        # (888s) shows no `sim_*` failure, WITHOUT it (27s) does.
        #
        # So they get the environment they were written for. This is the same
        # principle as the trybuild shard — a lane per execution requirement —
        # not a quarantine: every one of these 37 tests still runs, still
        # blocks merge, and is not skipped anywhere.
        #
        # It runs as a STEP of this job rather than a job of its own so it
        # reuses the target dir just compiled above: no extra runner, no second
        # workspace build, and the tests themselves take seconds.
        #
        # The root cause is the tests' sensitivity to contention, which this
        # only sidesteps; making them robust under an oversubscribed pool is
        # worth its own issue.
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace -- sim_ --test-threads=1 | tee "${RUNNER_TEMP}/sim.log"
          grep -qE 'test result: ok\. [1-9][0-9]* passed' "${RUNNER_TEMP}/sim.log" \
            || { echo "::error::the sim_ lane ran no tests — the filter no longer matches the sim_* modules"; exit 1; }

  trybuild:
    name: Trybuild ${{ matrix.shard }}
    needs: [lint, meta]
    strategy:
      fail-fast: false
      matrix:
        # The four shards partition `compile_fail::` exactly. `pass_a`/`pass_b`
        # are two halves of one fixture list (see the comment on
        # `compile_pass_tests_a`); `rest` is everything else in the module --
        # the feature-gated registries and the two guide-consistency tests,
        # which together measured under a second.
        shard: [fail, pass_a, pass_b, rest]
    # Linux only. trybuild was the whole tail of this workflow: on the first
    # fully-green sharded run the seven macOS/Windows shards took 38-55 min
    # each and `Trybuild pass_a (windows)` at 55.1 min WAS the critical path,
    # against 6-9 min for the same shards on Linux.
    #
    # What that buys, and what it costs: a trybuild case asserts the exact
    # rustc diagnostic text of a committed `.stderr` golden. Those goldens are
    # sensitive to the rustc VERSION, not to the OS -- all three legs pinned
    # `dtolnay/rust-toolchain@stable` and rendered byte-identical output, which
    # is why the same golden file serves all three. So running them three times
    # re-proved the same property on three machines. What is genuinely lost is
    # a diagnostic that differs per platform (a path separator or an OS-gated
    # `#[cfg]` reaching a fixture); nothing in the current fixture set is
    # OS-conditional, and a compile error that only appears on Windows would
    # still be caught by `Test (windows-latest)` failing to build.
    runs-on: ${{ fromJSON(needs.meta.outputs.heavy_runs_on) }}
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          # The full workspace build (and, in `test-docker`, the wide-feature
          # Postgres-container sweep on top of it) sits near the runner's disk
          # ceiling; a cold-cache PR build tips it over ("No space left on
          # device"). Reclaim the preinstalled toolchains a Rust build never
          # uses before the cache is restored.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/local/lib/node_modules \
            /usr/share/swift
          sudo docker image prune --all --force || true
          df -h
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        continue-on-error: true
        with:
          # Restore the entry the `test` job writes: same build, same features.
          shared-key: workspace-test
          # RESTORE ONLY. Four shards racing to upload the same multi-GB target
          # dir buys nothing, and on windows-latest that upload is what killed
          # `Trybuild pass_a` in run 8362 — the shard itself had already passed
          # at 53m, then the cache-save post step ran 47 more minutes and the
          # runner dropped the job. `test` is the single writer.
          save-if: false
      - name: Run the trybuild shard
        # `cargo test --workspace` (not `-p autumn-web --test integration_tests`)
        # on purpose: the fixtures registered by `compile_fail.rs` are
        # `#[cfg(feature = ...)]`-gated, so the set that exists depends on the
        # GLOBALLY unified feature resolution of a workspace build. Narrowing
        # the package selection here would quietly compile fewer of them out and
        # still report green. Every other test in the workspace is filtered out
        # by the shard's own filter, so the extra targets only cost their link.
        #
        # `assert_ran` for the reason the TLS/ACME lanes give: `cargo test` exits
        # 0 when a filter matches NOTHING, so a rename in `compile_fail.rs` would
        # otherwise leave a shard green having compiled nothing at all.
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.shard }}" in
            fail)   filter=(compile_fail::compile_fail_tests) ;;
            pass_a) filter=(compile_fail::compile_pass_tests_a) ;;
            pass_b) filter=(compile_fail::compile_pass_tests_b) ;;
            rest)   filter=(compile_fail::
                      --skip compile_fail::compile_fail_tests
                      --skip compile_fail::compile_pass_tests_a
                      --skip compile_fail::compile_pass_tests_b) ;;
          esac
          cargo test --workspace -- "${filter[@]}" | tee "${RUNNER_TEMP}/trybuild.log"
          grep -qE 'test result: ok\. [1-9][0-9]* passed' "${RUNNER_TEMP}/trybuild.log" \
            || { echo "::error::trybuild shard ${{ matrix.shard }} ran no tests — the filter no longer matches anything in compile_fail.rs"; exit 1; }
      - name: Drop the trybuild scratch tree
        if: always()
        # trybuild compiles every case as a real crate under
        # `target/tests/trybuild`; that tree measures ~16 GB after a full
        # `compile_pass` shard. It is pure scratch — regenerated each run,
        # never a build input — but no cache action's prune knows that layout,
        # so leaving it in place makes any post-run upload try to ship all of
        # it. `save-if: false` above already prevents that; this keeps the
        # disk bounded too, and keeps the hazard from returning silently if
        # anyone ever flips that flag back.
        shell: bash
        run: rm -rf target/tests

  test-features:
    name: Test ${{ matrix.lane }}
    needs: [lint, meta]
    strategy:
      fail-fast: false
      matrix:
        # Each lane is a feature set that `cargo test --workspace` does not
        # compile, so each is its own re-build of autumn-web. They share nothing
        # but the source tree, which is why they belong on separate runners.
        #
        # Linux only. These lanes ask "does this feature's own suite pass?",
        # which is a question about the feature, not about the platform -- and
        # `feature-combinations.yml` already proves every feature COMPILES
        # standalone via `cargo hack --each-feature`. Running five lanes on
        # three OSes was 15 jobs to answer one question five times; three of
        # them (redis-tls, tls, acme) were already Linux-only. Cross-platform
        # behaviour is still covered where it belongs: the default feature set
        # runs on all three OSes in `test`, and `Windows Tier 1 journey` drives
        # a real app end-to-end on Windows.
        lane:
          [
            markdown,
            inbound-mail,
            i18n,
            plugin-sandbox,
            system-tests,
            redis-tls,
            tls,
            acme,
          ]
    runs-on: ${{ fromJSON(needs.meta.outputs.heavy_runs_on) }}
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          # The full workspace build (and, in `test-docker`, the wide-feature
          # Postgres-container sweep on top of it) sits near the runner's disk
          # ceiling; a cold-cache PR build tips it over ("No space left on
          # device"). Reclaim the preinstalled toolchains a Rust build never
          # uses before the cache is restored.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/local/lib/node_modules \
            /usr/share/swift
          sudo docker image prune --all --force || true
          df -h
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        continue-on-error: true
        with:
          # One target dir per feature set; see the note on the trybuild job.
          key: ${{ matrix.lane }}
      - name: Run markdown-gated tests (user-content sanitizer)
        if: matrix.lane == 'markdown'
        # `markdown` is not a default feature, so the `test` job's `cargo test
        # --workspace` compiles neither the stored-XSS regression corpus
        # (`autumn/tests/integration/rich_text.rs`, gated on
        # `markdown` + `maud`) nor the `markdown::user_content` doctests. That
        # corpus IS the safety guarantee for user-submitted rich text
        # (issue #1255), so it has to run in a lane that blocks merge.
        run: |
          cargo test -p autumn-web --features markdown --test integration_tests rich_text
          cargo test -p autumn-web --features markdown --lib markdown::
          cargo test -p autumn-web --features markdown --doc markdown::
      - name: Run inbound-mail-gated tests (untrusted MIME parsing)
        if: matrix.lane == 'inbound-mail'
        # `inbound-mail` and its provider aliases are not default features, so
        # `cargo test --workspace` compiles neither `inbound_mail`'s in-module
        # suite nor `autumn/tests/integration/inbound_mail_integration.rs`
        # (`#![cfg(feature = "inbound-mail")]`). That module parses attacker-
        # controlled RFC 5322 / MIME bodies on an unauthenticated webhook route
        # — hostile-input regressions there have to block merge (issue #1611).
        run: |
          cargo test -p autumn-web --features "inbound-mail,inbound-mailgun,inbound-ses,mail" --lib inbound_mail
          cargo test -p autumn-web --features "inbound-mail,inbound-mailgun,inbound-ses,mail,test-support" --test integration_tests inbound_mail
      - name: Run i18n-gated tests (translatable model fields)
        if: matrix.lane == 'i18n'
        # `i18n` is not a default feature, so the `test` job's `cargo test
        # --workspace` compiles neither `i18n::translatable`'s in-module suite nor the two
        # `#![cfg(feature = "i18n")]` integration modules. Those are the whole
        # behavioural proof for #1384 — per-locale persistence, the fallback
        # walk, the documented sentinel, and the ambient-locale request path —
        # so they have to run in a lane that blocks merge rather than only in
        # the (non-blocking, Codecov-driven) coverage job. The Docker-gated
        # round-trip tests in `translatable_model` are swept separately by the
        # `test-docker` job.
        run: |
          cargo test -p autumn-web --features i18n --lib i18n::
          cargo test -p autumn-web --features "i18n,test-support" --test integration_tests translatable
      - name: Run plugin-sandbox tests (untrusted-plugin containment)
        if: matrix.lane == 'plugin-sandbox'
        # `plugin-sandbox` is not a default feature, so `cargo test --workspace`
        # compiles neither the sandbox's in-module suites nor
        # `autumn/tests/integration/plugin_sandbox.rs`. That integration module IS
        # the containment claim for #1609 — an adversarial corpus of file, network,
        # environment, database, CPU-spin, memory-bomb, trap and abort attempts,
        # each asserted to be refused at load or denied at runtime, with the host
        # process and every other route still serving. A regression there is a
        # sandbox escape, so it has to run in a lane that blocks merge.
        #
        # `test-support` supplies the shared WAT guest corpus; `wat` (a dev
        # dependency) compiles it, so no `wasm32-wasip1` toolchain is needed.
        run: |
          cargo test -p autumn-web --features plugin-sandbox --lib plugin_sandbox
          cargo test -p autumn-web --features "plugin-sandbox,test-support" --test integration_tests plugin_sandbox
          cargo test -p autumn-web --features plugin-sandbox --doc plugin_sandbox

      - name: Run system-test harness (non-browser) tests
        if: matrix.lane == 'system-tests'
        # `system-tests` is not a default feature. The `test` job's `cargo test
        # --workspace` happens to compile it today only because `example-e2e` depends
        # on `autumn-web` with that feature and workspace feature unification
        # turns it on — accidental coverage that would vanish silently if that
        # one dependency were ever dev-scoped or dropped. Name it explicitly so
        # the harness's own tests (browser resolution, transient-CDP retry
        # loop, `SystemTest::layer`) stay covered on purpose. The `#[ignore]`d
        # browser tests need Chromium and run in publish-gate.yml's
        # browser-provisioned job.
        run: |
          cargo test -p autumn-web --features system-tests --lib system_test::
          cargo test -p autumn-web --features system-tests --test integration_tests system_test_api
      - name: Run redis-TLS-gated tests (rediss:// CryptoProvider guard)
        if: matrix.lane == 'redis-tls'
        # `redis` and `ws` are not `autumn-web` default features. The `test`
        # job's workspace `cargo test` happens to compile this suite anyway,
        # because resolver-3 feature unification pulls `redis` in from
        # `autumn-cache-redis`/`autumn-cli` and `ws` from the `reddit-clone`
        # example — a coincidence of what other members want, not anything
        # this suite asks for. Drop `ws` from that example and the channels
        # scenario silently stops existing; drop `redis` and the whole module
        # does, with `cargo test --workspace` still green and zero coverage of
        # the guard.
        #
        # That guard is the only thing standing between a `rediss://` URL and
        # a startup panic (#2172), and the azure-container-apps target hands
        # apps nothing else. So it gets its own explicitly-featured run, with
        # the same non-zero-pass-count check the TLS/ACME lanes use: `cargo
        # test` exits 0 when a filter matches nothing.
        #
        # Linux only: the assertions are about process-global state and fork
        # isolation, neither of which is platform-specific, and `rusty_fork`
        # re-execs the test binary — cheapest on the fast runner.
        run: |
          set -euo pipefail
          assert_ran() {
            grep -qE 'test result: ok\. [1-9][0-9]* passed' "$1" \
              || { echo "::error::no tests ran for $2 — the suite is no longer compiled in"; exit 1; }
          }
          cargo test -p autumn-web --features "redis,ws" --lib redis_tls:: \
            | tee "${RUNNER_TEMP}/redis-tls.log"
          assert_ran "${RUNNER_TEMP}/redis-tls.log" "autumn-web redis_tls unit tests"
          cargo test -p autumn-cache-redis --lib \
            | tee "${RUNNER_TEMP}/cache-redis.log"
          assert_ran "${RUNNER_TEMP}/cache-redis.log" "autumn-cache-redis unit tests"
      - name: Run direct-TLS (HTTPS) tests
        if: matrix.lane == 'tls'
        # `tls` is not a default feature, so the `test` job's workspace `cargo
        # test` compiles neither `tls`'s in-module suite nor the `[server.tls]`
        # integration modules. Those are the behavioural proof for #1603 — the
        # listener itself (`tls_serving`) plus the app-surface parity the ACs
        # name: the framework probes, the inbound request timeout, SSE, `wss://`
        # sockets, graceful shutdown of an in-flight HTTPS request, and a
        # renewed certificate served without a restart (`tls_app_surface`). They
        # have to run in a lane that blocks merge rather than only in the
        # (non-blocking, Codecov-driven) coverage job. `ws` is on so the
        # `wss://` test is compiled rather than silently skipped.
        #
        # Linux only: two of these assert on elapsed time (the request deadline
        # and the mtime-polled certificate reload), and the Windows/macOS
        # runners are the slow, contended ones — the TLS listener itself is
        # platform-independent, so paying for that flake risk in a
        # merge-blocking lane buys nothing.
        #
        # Each suite is run under its own module-anchored filter and then
        # checked for a non-zero pass count: `cargo test` exits 0 when a filter
        # matches NOTHING, so a cfg drift that stopped compiling these modules
        # in would otherwise leave this step green with zero HTTPS coverage.
        run: |
          set -euo pipefail
          assert_ran() {
            grep -qE 'test result: ok\. [1-9][0-9]* passed' "$1" \
              || { echo "::error::no tests ran for $2 — the suite is no longer compiled in"; exit 1; }
          }
          cargo test -p autumn-web --features tls --lib tls:: \
            | tee "${RUNNER_TEMP}/tls-lib.log"
          assert_ran "${RUNNER_TEMP}/tls-lib.log" "autumn-web tls unit tests"
          cargo test -p autumn-web --features "tls,ws,test-support" \
            --test integration_tests tls_serving:: | tee "${RUNNER_TEMP}/tls-serving.log"
          assert_ran "${RUNNER_TEMP}/tls-serving.log" "tls_serving"
          cargo test -p autumn-web --features "tls,ws,test-support" \
            --test integration_tests tls_app_surface:: | tee "${RUNNER_TEMP}/tls-surface.log"
          assert_ran "${RUNNER_TEMP}/tls-surface.log" "tls_app_surface"
      - name: Run ACME-gated tests (certificate provisioning + renewal)
        if: matrix.lane == 'acme'
        # `acme` is not a default feature either, so the `test` job's workspace
        # `cargo test` compiles neither `acme`'s in-module suite nor `acme_end_to_end`.
        # That suite is the behavioural proof for #1608 — first-boot issuance and
        # the HTTP→HTTPS redirect, a forced near-expiry rotation with no restart,
        # a restart reusing the stored account and certificate, and a failed order
        # reaching health plus the error-reporting seam — driven through a real
        # `instant-acme` client against an in-process fake CA (`acme_fake_ca`).
        # No Docker and no network, so it belongs in this lane rather than the
        # `test-docker` job.
        #
        # The `tls` half of this path is covered by the `tls` lane;
        # `acme` implies `tls`, so this step deliberately runs only the ACME
        # suites rather than rebuilding and re-running those.
        #
        # Linux only, and `assert_ran` for the same two reasons the `tls` lane
        # gives: the renewal tests wait on real elapsed time, and `cargo test`
        # exits 0 when a filter matches NOTHING — so a cfg drift that stopped
        # compiling these modules in would otherwise leave this step green with
        # zero ACME coverage.
        run: |
          set -euo pipefail
          assert_ran() {
            grep -qE 'test result: ok\. [1-9][0-9]* passed' "$1" \
              || { echo "::error::no tests ran for $2 — the suite is no longer compiled in"; exit 1; }
          }
          cargo test -p autumn-web --features acme --lib acme:: \
            | tee "${RUNNER_TEMP}/acme-lib.log"
          assert_ran "${RUNNER_TEMP}/acme-lib.log" "autumn-web acme unit tests"
          cargo test -p autumn-web --features acme \
            --test integration_tests acme_end_to_end:: | tee "${RUNNER_TEMP}/acme-e2e.log"
          assert_ran "${RUNNER_TEMP}/acme-e2e.log" "acme_end_to_end"
      - name: Run real-ACME (Pebble) end-to-end test
        # Issue #1863, deferred from #1608/PR #1858: every ACME test above
        # drives `instant-acme` against `acme_fake_ca`, an in-process stand-in
        # built because Pebble needs a container plus container→host
        # networking for the HTTP-01 fetch. `acme_pebble` closes that gap by
        # driving the SAME `AcmeRenewalTask` against a real, independently-
        # implemented ACME server (Pebble), so a protocol-level regression the
        # stand-in cannot see would fail here even if every test above stayed
        # green.
        #
        # A DEDICATED step, separate from both the fast ACME lane above (no
        # Docker/network) and the general "Run Docker-dependent tests" sweep
        # below (whose feature set excludes `acme`/`tls` — see CLAUDE.md): it
        # needs Docker (`testcontainers`, gated by `test-support`) to run
        # Pebble itself, plus the `host-port-exposure` tunnel sidecar image.
        # `host-port-exposure` lives behind its OWN `acme-pebble` feature
        # (implying `acme` + `test-support`) rather than being turned on for
        # every `testcontainers` consumer workspace-wide — an ordinary
        # `cargo test -p autumn-web --features test-support` (or a plain
        # `--workspace` run) must not pull in the `russh`/crypto dependency
        # subtree that feature adds (Codex review, #2541). So this step, and
        # only this step, stays out of the default `cargo test --workspace`
        # run and out of contributors' non-Docker inner loop. Pebble is
        # hermetic (no real Let's Encrypt rate limits at stake), so this runs
        # on every CI invocation of this job rather than being hand-triggered.
        #
        # `test-threads=1`-equivalent by construction: exactly one ignored
        # test in this filter, and it binds Pebble's fixed HTTP-01 port
        # (5002) directly, so it must not run concurrently with itself.
        if: matrix.lane == 'acme'
        run: |
          set -euo pipefail
          assert_ran() {
            grep -qE 'test result: ok\. [1-9][0-9]* passed' "$1" \
              || { echo "::error::no tests ran for $2 — the suite is no longer compiled in"; exit 1; }
          }
          cargo test -p autumn-web --features acme-pebble \
            --test integration_tests acme_pebble:: -- --ignored \
            | tee "${RUNNER_TEMP}/acme-pebble.log"
          assert_ran "${RUNNER_TEMP}/acme-pebble.log" "acme_pebble"

  # The Docker/testcontainer sweep runs as its own job rather than as the last
  # step of `test` (#1747). As step 16 of that job it inherited a disk already
  # filled by the whole workspace build plus eight feature-flipped rebuilds,
  # and then died compiling its own dependencies — `bollard`, `bollard-stubs`
  # and a re-linked `autumn-web` — with "No space left on device" and 23-41 MB
  # free, before a single test body ran. Steps 1-15 of that job were green, as
  # were the macOS and Windows legs, so the sweep was not failing on anything
  # it tested; it was failing on being last in line for the disk.
  #
  # Nothing here is skipped, reordered or weakened: the two steps below are the
  # ones that were inline, verbatim, on a runner whose disk they are the only
  # claimant of. They keep their `runner.os == 'Linux'` guards, which stay true
  # on this runner, so the commands are byte-for-byte the ones that ran before.
  #
  # Reconciled with #2519 (this PR), which #1747 anticipated: the job keeps its
  # `Test (Docker)` name and every step below, and is now one of the four
  # families the `test-gate` job aggregates. Branch protection should require
  # `Test suite` (`test-gate`) rather than this check or the per-OS `Test (…)`
  # ones — that is the one name that survives adding or removing a shard.
  test-docker:
    name: Test (Docker)
    needs: [lint, meta]
    runs-on: ${{ fromJSON(needs.meta.outputs.heavy_runs_on) }}
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          # The same reclaim the `test` job does: drop the preinstalled
          # toolchains a Rust build never uses, before the cache is restored.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/local/lib/node_modules \
            /usr/share/swift
          sudo docker image prune --all --force || true
          df -h
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        continue-on-error: true
      - name: Install Postgres client tools (Linux)
        if: runner.os == 'Linux'
        run: |
          # The offsite-backup round-trip below drives `autumn db backup`, which
          # shells out to the HOST `pg_dump`/`pg_restore`. ubuntu-latest does not
          # guarantee these on PATH, so install the client package explicitly.
          # (postgresql-client installs pg_dump/pg_restore into /usr/bin via the
          # pg_wrapper symlinks, so no extra PATH tweak is needed.)
          # openssh-client (ssh/scp) is also installed here: the AC-7 deploy
          # end-to-end test (#1607) drives the real `autumn deploy` over ssh/scp
          # against a privileged systemd container, and ubuntu-latest does not
          # guarantee the ssh *client* on PATH.
          sudo apt-get update
          sudo apt-get install -y postgresql-client openssh-client
          pg_dump --version
          pg_restore --version
          ssh -V
      - name: Install diesel_cli (Linux)
        if: runner.os == 'Linux'
        # #1945: the cli_tests Docker sweep below now reaches
        # `db_pull.rs`/`generate_lock_version_postgres.rs`/
        # `generate_references_postgres.rs`/`migrate_down.rs`/`test_command.rs`
        # and `db.rs`'s reset tests, which drive `autumn migrate`/`autumn db
        # reset`/`autumn test` against Postgres — all of which shell out to
        # the `diesel` CLI via `check_diesel_cli()` (`autumn-cli/src/migrate.rs`)
        # and exit non-zero without it on PATH. Same install command as
        # generator-conformance.yml's `scaffold-postgres` job.
        run: cargo install diesel_cli --version "=2.2.0" --no-default-features --features postgres --locked
      - name: Run Docker-dependent tests
        if: runner.os == 'Linux'
        # 45 -> 75 (#1945): 46 more container-spinning `cli_tests` Docker
        # tests now sweep in here (see the `cli_tests` bare `--ignored`
        # invocation below), on top of the 10 that raised this to 45 in
        # PR #1985. The prior step ran in ~25 min against the old 45-minute
        # budget, and these are typical single-Postgres-container tests
        # (seconds to low minutes each), so +30 min is a conservative margin.
        timeout-minutes: 75
        run: |
          cargo test -p autumn-web --test db_hooks_lifecycle -- --ignored
          cargo test -p autumn-web --test repository_shard_replica_routing -- --ignored
          # NOTE: explicit feature list (NOT `--all-features`). `--all-features`
          # would enable the backend-flip `sqlite` feature, which flips
          # `db::RuntimeConnection` from `AsyncPgConnection` to a SQLite
          # connection and fails to compile the Postgres-assuming modules
          # (db.rs/managed_pg.rs/state.rs/job.rs/repository.rs/sharding.rs). This
          # list is every autumn-web feature EXCEPT `sqlite` (i.e. the Postgres
          # backend, which this pg-integration test requires). See #1614.
          cargo test -p autumn-web --features "ws,presence,flash,cache-moka,maud,htmx,multipart,tailwind,http-client,oauth2,webauthn,openapi,mcp,markdown,db,offline-sync,test-support,telemetry-otlp,redis,i18n,embed-assets,storage,variants,reporting,mail,inbound-mail,inbound-mailgun,inbound-ses,seed,system-info,csv,pdf,system-tests,managed-pg,managed-pg-bundled,tls,acme" --test feature_flags_pg_integration -- --ignored
          cargo test -p autumn-web --test scoped_tokens_db -- --ignored
          cargo test -p autumn-admin-plugin --test token_admin_db -- --ignored
          cargo test -p autumn-admin-plugin --test token_admin_bulk_delete_batch_profile -- --ignored
          cargo test -p autumn-admin-plugin --test feature_flag_admin_bulk_delete_batch_profile -- --ignored
          # Media-room reaper phase-2 profiling harness: asserts the sweep's
          # reap set, its boundary cases (created_at / last_seen_at exactly ON
          # the cutoff), and its namespace isolation against a
          # production-shaped fixture. Testcontainer-managed, so no `services:`
          # block. NOTE: autumn-media-plugin has no crate-wide `--ignored`
          # sweep, so `tests/room_store_db.rs`'s own Docker tests still run
          # nowhere in CI — a pre-existing gap, not addressed here.
          cargo test -p autumn-media-plugin --test room_reaper_batch_profile -- --ignored
          cargo test -p autumn-cache-redis -- --ignored
          # autumn-search (#1191): the Postgres SearchBackend + DocumentSource
          # suites are testcontainer-managed, so no `services:` block is needed.
          cargo test -p autumn-search -- --ignored
          cargo test -p autumn-cli --test flags -- --ignored
          cargo test -p autumn-cli --test config -- --ignored
          cargo test -p autumn-cli --test experiments -- --ignored
          # Consolidated `cli_tests` binary: discover-and-run every Docker/
          # testcontainer `#[ignore]`d test the same way the autumn-web sweep
          # below does (#1923, #1945). Needs Docker (testcontainers) + host
          # pg_dump/pg_restore (installed above). Before this, autumn-cli's
          # Docker-gated tests were NOT auto-swept: only the two filtered
          # invocations below (`offsite`, `db_scrub`) ran anything, so
          # `db.rs` (5), `db_pull.rs` (3), `generate_lock_version_postgres.rs`
          # (1), `generate_references_postgres.rs` (1), `migrate_down.rs` (6),
          # `schema_migrate.rs` (1), `schema_pull.rs` (25), and
          # `test_command.rs` (4) — 46 tests across 8 modules — never ran
          # anywhere in CI (PR #1985's noted follow-up). A bare `--ignored`
          # sweep now runs every Docker test in the binary, so a newly-added
          # `#[ignore = "requires Docker (testcontainers)"]` test in any
          # module runs here automatically, with no workflow edit.
          #
          # Everything named in `--skip` below is a NON-Docker `#[ignore]`d
          # test that instead scaffolds and cargo-checks/builds/runs a fresh
          # project — those are slow, generator-shaped gates that belong in
          # generator-conformance.yml's own matrix'd job, where each is named
          # explicitly. Skipped BY EXACT NAME rather than whole-module: a
          # `--skip <module>::` would also silently swallow any *Docker* test
          # later added to one of these same files, defeating the "no
          # workflow edit" guarantee this sweep exists to give (Codex finding
          # on this PR). A newly-added non-Docker test in one of these
          # modules DOES need a line added here (and a step in
          # generator-conformance.yml) — that omission just makes it run
          # here too until skipped, never silently dark.
          # `scrubbed_database_migrates_clean_and_boots_the_app` additionally
          # compiles and boots a generated app and needs the diesel CLI, so it
          # runs in generator-conformance.yml's Postgres gate instead.
          # `scaffolded_json_field_generates_compiles_inserts_and_selects`
          # (generate_json_postgres.rs) IS a Docker test and predates this
          # sweep — it already runs in generator-conformance.yml's Postgres
          # gate, so it's skipped here too rather than doubled up: unlike the
          # other Docker tests above, its own doc comment says it also does a
          # full `autumn new` -> `generate scaffold` -> `cargo check` ->
          # `migrate`, the same cost profile as the cold-start-compile tests
          # this step is deliberately kept fast by routing elsewhere.
          cargo test -p autumn-cli --test cli_tests -- \
            --ignored \
            --test-threads=1 \
            --skip console_bare_playground_target_compiles_untouched \
            --skip console_playground_target_compiles_with_a_repository_round_trip \
            --skip console_run_exits_non_zero_when_the_database_is_unreachable \
            --skip console_run_surfaces_a_compile_error_in_the_playground \
            --skip i18n_scaffold_cargo_checks \
            --skip i18n_scaffold_with_owner_scoped_search_cargo_checks \
            --skip i18n_scaffold_with_state_machine_and_attachment_cargo_checks \
            --skip i18n_scaffold_with_trash_and_search_cargo_checks \
            --skip encrypted_admin_scaffold_cargo_checks \
            --skip encrypted_api_scaffold_cargo_checks \
            --skip encrypted_live_scaffold_cargo_checks \
            --skip encrypted_nested_scaffold_cargo_checks \
            --skip encrypted_scaffold_cargo_checks \
            --skip constrained_scaffold_cargo_checks \
            --skip generated_attachment_scaffold_cargo_checks \
            --skip generated_attachment_scaffold_multipart_test_passes \
            --skip generated_form_for_scaffold_cargo_checks \
            --skip generated_scaffold_with_missing_reference_target_cargo_checks \
            --skip api_scaffold_cargo_checks \
            --skip scaffolded_api_app_passes_routes_audit_gate \
            --skip scaffolded_app_passes_routes_audit_gate \
            --skip scoped_position_generated_project_cargo_checks \
            --skip soft_delete_position_generated_project_cargo_checks \
            --skip unscoped_position_generated_project_cargo_checks \
            --skip belongs_to_scaffold_cargo_checks \
            --skip bulk_delete_generated_project_cargo_checks \
            --skip richtext_scaffold_cargo_checks \
            --skip searchable_scaffold_cargo_checks \
            --skip trash_generated_project_cargo_checks \
            --skip linked_seed_binary_cargo_checks \
            --skip serve_daemon_start_status_stop_over_unix_socket \
            --skip scaffolded_json_field_generates_compiles_inserts_and_selects \
            --skip scrubbed_database_migrates_clean_and_boots_the_app
          # Consolidated `integration_tests` binary: discover-and-run ALL the
          # Docker/testcontainer `#[ignore]`d DB tests instead of a hand-curated
          # per-feature allowlist (#1923). Enabling `test-support` (testcontainers)
          # + `offline-sync` compiles in every db-gated module (db + maud are
          # already defaults), and the bare `--ignored` sweep then runs every
          # ignored test in the binary — so a newly-added house-pattern
          # testcontainer DB test runs here automatically, with no workflow edit.
          # This subsumes the old offline_sync_pg (#1346) and nested_form (#1346)
          # scoped lines and picks up the previously-unrun suites
          # (validate_on_update_blind #1801, repository_*, tenancy, distributed_lock, …).
          #
          # Non-Docker `#[ignore]` tests must NOT be swept in here: browser
          # (Chromium) tests live behind the `system-tests` feature and never
          # compile into this run; any other non-Docker ignored test (bench /
          # timing) must be feature-gated OR added to the `--skip` list below.
          # The lone current exception is the release-mode timing microbenchmark
          # in access_log.rs, which is unconditionally compiled.
          #
          # `capture_overhead_on_a_successful_query_request` (#1598) IS a Docker
          # test and would legitimately be swept in, but it is a comparative
          # *benchmark*: it prints failure-capsule capture overhead and compares
          # two timing distributions, which a shared runner makes noisy. It is
          # skipped here and run by hand when the published numbers in
          # docs/guide/failure-capsules.md need refreshing.
          # The non-ignored offline-sync engine/store/conformance tests are
          # `#[cfg(feature = "offline-sync")]` (not a default feature), so the
          # workspace test run above compiles them out; run them here. Same
          # feature set as the sweep below so the binary is compiled once.
          #
          # The feature set also enables `ws`, `mail`, and `redis` (#1945): those
          # gate previously-unreachable testcontainer-managed Docker `#[ignore]`d
          # tests (the `ws` live_broadcast OOB-fragment suite, the `redis` worker-
          # gating/dedicated-capacity/rate-limit suites, and the `mail` newsletter
          # unsubscribe test) which never compiled into this binary and so were
          # never swept. All are Postgres/Redis testcontainer-managed, so no CI
          # `services:` block is needed. Chromium/browser tests stay OUT — they
          # live behind `system-tests` and require a browser this runner lacks.
          #
          # `i18n` joined the set in #1384 so the `#[translatable]` per-locale
          # column round-trip suite (`translatable_model`, Postgres
          # testcontainer) compiles into this binary and is swept. `i18n` is a
          # pure request-path/codegen feature — it pulls in no extra runner
          # service and cannot flip a backend.
          cargo test -p autumn-web --features "test-support,offline-sync,ws,mail,redis,i18n" --test integration_tests offline_sync
          cargo test -p autumn-web --features "test-support,offline-sync,ws,mail,redis,i18n" --test integration_tests -- \
            --ignored \
            --test-threads=1 \
            --skip per_request_overhead_is_under_50_microseconds_p99 \
            --skip capture_overhead_on_a_successful_query_request
          # AC-7 deploy end-to-end (#1607, Slice 4): drives the real `autumn
          # deploy up`/`rollback` over ssh/scp against a privileged systemd
          # container (first deploy, zero-downtime redeploy, on-demand rollback,
          # forced-failure auto-rollback). Isolated `--test deploy_e2e` binary; it
          # builds its own fixture image (extracting kamal-proxy from the
          # basecamp/kamal-proxy Docker Hub image) and needs the ssh client
          # installed above.
          cargo test -p autumn-cli --test deploy_e2e -- --ignored


  test-gate:
    name: Test suite
    # The stable, shard-count-independent name for BRANCH PROTECTION. It fails
    # if any shard failed or was cancelled; a `needs:` alone would let a skipped
    # shard pass silently.
    #
    # Nothing else should hang off this job. Anything with `needs: [test-gate]`
    # inherits two properties it almost certainly does not want: it cannot start
    # until the SLOWEST shard finishes (the Windows trybuild shard, ~57m), and
    # it is SKIPPED whenever any one of the ~34 shard jobs is red — and a
    # skipped required check can never be satisfied, so the PR stops being
    # mergeable even once the real failure is understood. `coverage` and `loom`
    # were briefly wired here and hit exactly that; they depend on `test`.
    needs: [test, trybuild, test-features, test-docker]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check shard results
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "shard results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::a test shard did not succeed ($results)"; exit 1; }
          done

  coverage:
    name: Coverage (${{ matrix.lane }})
    # `test`, NOT `test-gate`: coverage instruments the workspace suite, so the
    # `test` job is the only thing it actually depends on. Hanging it off the
    # aggregate would make an unrelated red shard (a feature lane, a trybuild
    # shard) skip coverage entirely, and would delay its start until the
    # slowest shard finished. See the note on `test-gate`.
    needs: [test, meta]
    strategy:
      fail-fast: false
      matrix:
        # Four lanes over the legs this job used to run back-to-back in one
        # 55-minute step. Once trybuild moved to Linux only, coverage WAS the
        # critical path, so splitting it is what moves the workflow's floor.
        #
        # The split is by feature set, because that is what forces a rebuild:
        # `workspace` and `autumn-web` are the two expensive instrumented
        # builds and get a runner each; `sandbox-sqlite` carries the two
        # feature-flipped lanes; `db-ignored` carries the Docker/testcontainer
        # `--ignored` legs, which are wall-clock-bound rather than CPU-bound.
        #
        # Each lane reports its own lcov and uploads under its own Codecov
        # flag; Codecov merges the four uploads for the commit. That is the
        # supported way to shard llvm-cov across runners -- merging raw
        # profdata instead would mean shipping each lane's instrumented object
        # files between jobs.
        lane: [workspace, autumn-web, sandbox-sqlite, db-ignored]
    runs-on: ${{ fromJSON(needs.meta.outputs.heavy_runs_on) }}
    env:
      # Every autumn-web feature EXCEPT `sqlite`. Hoisted to job scope so the
      # lanes below share one definition. It is the coverage sibling of
      # `autumn_web_semver_features` in scripts/check-semver.sh (both
      # deliberately EXCLUDE `sqlite` to avoid the backend flip described on
      # the `workspace` lane); keep the `sqlite`-exclusion invariant in sync.
      # Coverage is not bound by the crates.io baseline, so this list is a
      # deliberate superset (adds `offline-sync`, `embed-assets`, `tls`,
      # `acme`, `managed-pg*`, `system-tests`, `test-support`, ...).
      PG_FEATURES: "ws,presence,flash,cache-moka,maud,htmx,multipart,tailwind,http-client,oauth2,webauthn,openapi,mcp,markdown,db,offline-sync,test-support,telemetry-otlp,redis,i18n,embed-assets,storage,variants,reporting,mail,inbound-mail,inbound-mailgun,inbound-ses,seed,system-info,csv,pdf,system-tests,managed-pg,managed-pg-bundled,tls,acme,plugin-sandbox"
      # `postgresql_embedded`'s build script downloads Postgres binaries via
      # the GitHub API; unauthenticated it hits the 60 req/hr rate limit and
      # fails the build with a 403. Authenticate with the job's token to get
      # the higher rate limit.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          # llvm-cov instrumentation roughly doubles target/ size, so the
          # coverage build is the most disk-hungry job; reclaim unused
          # preinstalled toolchains so it doesn't exhaust the runner disk.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/local/lib/node_modules \
            /usr/share/swift
          sudo docker image prune --all --force || true
          df -h
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          # One cache per lane: each builds a different feature set, so sharing
          # a key would thrash the entry rather than warm it.
          key: coverage-${{ matrix.lane }}
      - name: Install cargo-llvm-cov
        # Pin @v2 and pass the tool explicitly. The bare @cargo-llvm-cov tag form can
        # resolve with an empty tool input and install nothing (broke the Fuzz
        # jobs with `error: no such command: fuzz`). Keep the explicit tool: input.
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage (workspace catch-all)
        if: matrix.lane == 'workspace'
        run: |
          set -euo pipefail
          cargo llvm-cov clean --workspace
          # `--all-features` on a `--workspace` run is structurally unsafe here.
          # Only two workspace members own a `sqlite` feature — autumn-web and
          # autumn-cli (`sqlite = ["autumn-web/sqlite", ...]`). Under
          # `--all-features`, autumn-cli's `sqlite` forwards to `autumn-web/sqlite`
          # and — through GLOBAL cargo feature unification — flips the SHARED
          # autumn-web dependency's `db::RuntimeConnection` alias to the SQLite
          # backend for the ENTIRE graph. Every Pg-assuming crate then fails to
          # compile with E0308 (they pin diesel `postgres` and use
          # `#[model]`/`Jsonb`/`AsyncPgConnection`): autumn-web's lib itself
          # (#1614), autumn-admin-plugin, autumn-media-plugin, and the example
          # apps. Cargo has no "all-features except one crate feature" flag, and
          # excluding victim crates one-by-one is whack-a-mole. Instead exclude
          # the two crates that OWN a `sqlite` feature so NO selected package can
          # turn the flip on; each is covered by a lane of its own:
          #   - autumn-web: the `autumn-web` lane, with `$PG_FEATURES`.
          #   - autumn-cli: its `postgres`/`sqlite` backends are MUTUALLY
          #     EXCLUSIVE ("NEVER `--all-features`", per autumn-cli/Cargo.toml),
          #     so it can never be part of an `--all-features` build at all; it is
          #     covered by the `db-ignored` lane's `-p autumn-cli` legs.
          # With both feature-owners excluded the catch-all resolves autumn-web
          # to Postgres, so autumn-admin-plugin / autumn-media-plugin / the
          # example apps compile again and need NO exclusion.
          cargo llvm-cov --workspace --exclude autumn-web --exclude autumn-cli \
            --all-features --no-report
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Generate coverage (autumn-web, Postgres feature set)
        if: matrix.lane == 'autumn-web'
        run: |
          set -euo pipefail
          cargo llvm-cov clean --workspace
          # `--skip compile_fail::`, the same skip the `test` job uses, for a
          # reason specific to coverage: a trybuild case compiles its fixture
          # as a separate crate in a NESTED cargo process, which this run does
          # not instrument, so the whole module contributes no coverage signal
          # at all. It is not free, either — it was 1066s of this lane, and it
          # writes ~16 GB into `target/tests/trybuild` (measured on the
          # trybuild shards, which drop that tree afterwards for exactly this
          # reason) on top of an instrumented tree that is already the most
          # disk-hungry build in the workflow. It failed here as `31 of 31
          # tests failed` while `Trybuild pass_b` was green in the same run, so
          # the fixtures are fine and this was an artifact of the environment,
          # not a regression. `compile_fail::` still runs, and still gates
          # merge, in the four `trybuild` shards.
          #
          # `--skip sim_` for the SECOND reason the `test` job skips it, and it
          # is this lane's own doing: dropping `compile_fail::` above frees the
          # libtest thread pool exactly the way pulling trybuild into its own
          # job did, and the `sim_*` determinism tests fail under that
          # concurrency (`sim_retry_storm`, `sim_fault_plan` — see the `Run the
          # simulation suite single-threaded` step). Before that skip this lane
          # still ran trybuild, so the simulations were trickling through its
          # gaps and never saw full parallelism. Skipping trybuild without
          # skipping `sim_` would hand this lane the known-flaky execution mode
          # and let it fail otherwise-green PRs (Codex review).
          cargo llvm-cov --no-report -p autumn-web --features "$PG_FEATURES" \
            -- --skip compile_fail:: --skip sim_
          # The same subset, single-threaded, still instrumented — so coverage
          # keeps the `sim_*` modules rather than trading a flake for a hole.
          # No rebuild: same package, same features, same target dir, so this
          # re-runs binaries the step above already built.
          cargo llvm-cov --no-report -p autumn-web --features "$PG_FEATURES" \
            -- sim_ --test-threads=1
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Generate coverage (plugin-sandbox + sqlite)
        if: matrix.lane == 'sandbox-sqlite'
        run: |
          set -euo pipefail
          cargo llvm-cov clean --workspace
          # The plugin-sandbox suites have their own merge-blocking test lane
          # in `test-features`; without a coverage leg the whole module is
          # instrumented and never executed, which reads as a large new
          # uncovered surface.
          #
          # The test-name filter goes after `--`, unlike the `cargo test` lane
          # where it is a bare positional. `cargo llvm-cov` has its own
          # subcommands (`report`, `clean`, `nextest`, …), so a bare word in
          # that position is read as one:
          #     error: unrecognized subcommand plugin_sandbox
          cargo llvm-cov --no-report -p autumn-web --features "plugin-sandbox,test-support" \
            --lib -- plugin_sandbox
          cargo llvm-cov --no-report -p autumn-web --features "plugin-sandbox,test-support" \
            --test integration_tests -- plugin_sandbox
          # Explicit sqlite+mail lane (#1614). Excluding autumn-cli from the
          # catch-all removed the only place it compiled autumn-web under the
          # `sqlite` + `mail` union — exactly the `DbSuppressionStore`
          # backend-flip #1614 fixed, so coverage must keep compiling it.
          # Isolated to `-p autumn-web` so the sqlite flip can never leak onto
          # the Pg-assuming workspace crates. A named sqlite `[[test]]` target
          # keeps it off the pg-URL lib unit tests (which assume Postgres) —
          # the same rule the `sqlite-runtime` job follows.
          cargo llvm-cov --no-report -p autumn-web --features "sqlite,mail" \
            --test sqlite_boot_serve
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Generate coverage (Docker/testcontainer --ignored legs)
        if: matrix.lane == 'db-ignored'
        run: |
          set -euo pipefail
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report -p autumn-web --features "$PG_FEATURES" \
            --test db_hooks_lifecycle -- --ignored
          cargo llvm-cov --no-report -p autumn-web --features "$PG_FEATURES" \
            --test repository_shard_replica_routing -- --ignored
          cargo llvm-cov --no-report -p autumn-web --features "$PG_FEATURES" \
            --test feature_flags_pg_integration -- --ignored
          cargo llvm-cov --no-report -p autumn-web --features "$PG_FEATURES" \
            --test scoped_tokens_db -- --ignored
          cargo llvm-cov --no-report -p autumn-admin-plugin \
            --test token_admin_db -- --ignored
          cargo llvm-cov --no-report -p autumn-admin-plugin \
            --test token_admin_bulk_delete_batch_profile -- --ignored
          cargo llvm-cov --no-report -p autumn-admin-plugin \
            --test feature_flag_admin_bulk_delete_batch_profile -- --ignored
          cargo llvm-cov --no-report -p autumn-cache-redis -- --ignored
          cargo llvm-cov --no-report -p autumn-search -- --ignored
          cargo llvm-cov --no-report -p autumn-cli --test flags -- --ignored
          cargo llvm-cov --no-report -p autumn-cli --test config -- --ignored
          cargo llvm-cov --no-report -p autumn-cli --test experiments -- --ignored
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          # One flag per lane so Codecov can tell the four uploads apart and
          # merge them into a single commit report rather than treating a later
          # upload as a replacement for an earlier one.
          flags: ${{ matrix.lane }}
          fail_ci_if_error: false

  msrv:
    name: MSRV (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2.7.8
      - name: Check MSRV alignment
        run: ./scripts/check-msrv.sh
      - name: Check MSRV compiles
        run: cargo check --workspace

  # SQLite runtime lane gate (issue #1614, AC#11). This is the ONLY place in CI
  # that enables autumn-web's `sqlite` feature, and it does so via an EXPLICIT
  # `--features sqlite` on each dedicated invocation below — NEVER via
  # `--all-features` and never via a workspace dependency edge. `sqlite` is a
  # backend-flip feature: it flips `db::RuntimeConnection` from `AsyncPgConnection`
  # to a SQLite connection, so unifying it with the Postgres-assuming features
  # breaks compilation (the earlier trunk-red). Keep it isolated to this job.
  #
  # No Postgres `services:` / Docker: the sqlite tests use tempfile/in-memory
  # SQLite with no external DB. The job builds + lints autumn-web under the
  # sqlite backend and runs the sqlite integration suite by NAMED `[[test]]`
  # target — a bare `cargo test --features sqlite` is unsafe (it would compile
  # the Postgres `integration_tests` binary and the pg-URL lib unit tests under
  # the flipped backend and fail).
  sqlite-runtime:
    name: SQLite runtime (feature=sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.7.8
      - name: Build autumn-web under the sqlite backend
        run: cargo build -p autumn-web --features sqlite
      - name: Clippy (autumn-web lib, sqlite backend)
        run: cargo clippy -p autumn-web --features sqlite --lib -- -D warnings
      - name: Clippy (autumn-web lib, sim-testing op-driver)
        # `sim-testing` (W6 PR2, issue #1797) promotes `proptest` to a library
        # dependency for `sim::op` — lint it here (alongside the sqlite lib
        # lint above) since it's not part of any other feature combo above.
        run: cargo clippy -p autumn-web --features "sqlite,sim-testing" --lib -- -D warnings
      - name: Clippy (autumn-web bin, sim-sweep)
        # `sim-sweep` (W6 PR3, issue #1797) is a `[[bin]]`, not part of `--lib`
        # above, so it needs its own explicit clippy invocation.
        run: cargo clippy -p autumn-web --features "sqlite,sim-testing" --bin sim-sweep -- -D warnings
      - name: Run the sqlite-backend lib unit tests
        # `--test <name>` selects test TARGETS only, so the integration step
        # below never runs the crate's own `#[cfg(feature = "sqlite")]` unit
        # tests — the pool sizing, replica-rejection, target-classification and
        # provider-dispatch coverage that lives inside `autumn/src/db.rs`,
        # `app.rs` and `repository_commit_hooks.rs`. Until this step existed
        # those ~26 tests were compiled (by the clippy steps above) but never
        # executed, and the ungated pool/topology tests alongside them had
        # rotted into hard failures under the backend flip without anyone
        # noticing. Same shape as the other feature-gated `--lib <module>::`
        # lanes above (markdown, i18n, tls, acme).
        #
        # Module-filtered, NOT a bare `--lib`: the rest of the crate's unit
        # tests still build their fixtures on hard-coded `postgres://` URLs,
        # which `build_sqlite_pool` correctly refuses. Making those
        # backend-parametric is tracked separately; the filter names every
        # module that carries SQLite-specific logic, so nothing sqlite-gated is
        # left unexecuted. The two `app::` tests are named individually because
        # the rest of `app::tests` is in that not-yet-parametric set.
        run: |
          cargo test -p autumn-web --features sqlite --lib -- \
            db:: \
            config:: \
            migrate:: \
            counter_cache:: \
            derivation:: \
            commentable:: \
            ledger:: \
            repository_commit_hooks:: \
            substrate:: \
            sqlite_sharding_unsupported_guard_tests \
            app::tests::custom_pool_provider_with_established_sqlite_pool_fails_closed_on_statement_timeout \
            app::tests::custom_pool_provider_no_database_mode_boots_with_statement_timeout
      - name: Run the sqlite integration suite
        # Named sqlite `[[test]]` targets only. `test-support` is required by the
        # TestApp/Db-extractor-based tests (sqlite_db_extractor, sqlite_read_only_tx,
        # sqlite_transactional_url_pool) and is additive/harmless for the rest.
        run: |
          cargo test -p autumn-web --features "sqlite,test-support,storage" \
            --test sqlite_boot_serve \
            --test sqlite_migrations \
            --test sqlite_foreign_keys \
            --test sqlite_db_extractor \
            --test sqlite_pool_pragmas \
            --test sqlite_read_only_pool \
            --test sqlite_scoped_repository \
            --test sqlite_read_only_tx \
            --test sqlite_transactional_url_pool \
            --test sqlite_version_history \
            --test sqlite_ledger \
            --test sqlite_searchable_repository \
            --test sqlite_immediate_transaction \
            --test sqlite_statement_timeout_fail_closed \
            --test sqlite_crud_basic \
            --test sqlite_field_conversions \
            --test sqlite_json_field_conversion \
            --test sqlite_upsert_isolation \
            --test sqlite_votable \
            --test sqlite_derivation \
            --test sqlite_dependent_destroy \
            --test sqlite_tracked_sessions \
            --test sqlite_commit_hook_worker \
            --test sim_chaos \
            --test sim_fault_plan_db \
            --test sqlite_jobs_scheduler_e2e \
            --test sim_sqlite_substrate \
            --test sim_sqlite_integration \
            --test sim_chaos_crash
      - name: Run the sqlite mail-chaos suite (W5.a, issue #1797)
        # `sim_chaos_mail` needs the `mail` feature for the mail
        # interceptor/transport surface, so it runs as its own invocation to
        # avoid widening the feature set of the other sqlite tests above.
        run: |
          cargo test -p autumn-web --features "sqlite,test-support,mail" \
            --test sim_chaos_mail
      - name: Run the sim op-driver DoD suite (W6 PR2, issue #1797)
        # `sim_op_driver` needs the `sim-testing` feature (`proptest` as a
        # library dependency) — runs as its own invocation to avoid widening
        # the feature set of the other sqlite tests above. It doesn't actually
        # need `sqlite`/`test-support` (it never calls `Sim::build`), but lives
        # in this job to keep sim-testing CI coverage co-located with the rest
        # of the sim DoD suites.
        run: |
          cargo test -p autumn-web --features sim-testing \
            --test sim_op_driver
      - name: Run the sim seed-sweep DoD suite (W6 PR3, issue #1797)
        # `sim_sweep_driver` proves `sim::sweep::sweep_proptest` itself — finds
        # and shrinks an injected invariant break across a batch of seeds,
        # deterministic replay of the failing seed, and the cross-seed
        # `sometimes!` non-vacuity aggregate. Same `sim-testing` feature gate
        # and rationale as the op-driver DoD suite above; kept as its own step
        # for the same reason (isolated `[[test]]` binary, no `sqlite` need).
        run: |
          cargo test -p autumn-web --features sim-testing \
            --test sim_sweep_driver

  # Sim seed sweep (W6 PR3, issue #1797): sweeps `AUTUMN_SIM_SEEDS` seeds
  # sequentially (see `sim::sweep`'s module docs for why sequential, not
  # parallel) through the `sim-sweep` `[[bin]]`'s built-in, deliberately
  # CORRECT account demo scenario — this job proves the seed-sweep mechanism
  # itself scales to many seeds without a false positive. A genuine invariant
  # break IS caught and shrunk: that's the `sim_sweep_driver` DoD suite in the
  # sqlite-runtime job above, not this job (which must always stay green).
  # Structured like the `loom` job below: its own bounded, standalone step.
  sim-sweep:
    name: Sim sweep (sim-testing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
      - name: Run the sim-sweep seed sweep
        run: cargo run -p autumn-web --release --features sim-testing --bin sim-sweep
        env:
          AUTUMN_SIM_SEEDS: "512"

  # Genuine loom model checks: the loom_models test binary uses loom::sync::*
  # unconditionally, so loom::model() exhaustively explores thread interleavings
  # here. We gate the binary with a NEUTRAL custom cfg (loom_models) rather than
  # the conventional `--cfg loom`, because `--cfg loom` poisons the whole
  # dependency tree — hyper-util/tokio ship their own `#[cfg(loom)]` type-swap
  # paths that fail to compile. Release mode is loom's own recommendation, and
  # the preemption budget + job timeout bound the state-space search.
  loom:
    name: Loom
    # `test`, NOT `test-gate` — same reasoning as `coverage` above.
    needs: [test, meta]
    runs-on: ${{ fromJSON(needs.meta.outputs.heavy_runs_on) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
      - name: Run loom model checks
        run: cargo test -p autumn-web --release --test loom_models
        env:
          RUSTFLAGS: "--cfg loom_models"
          LOOM_MAX_PREEMPTIONS: "3"

  # Edge capsule conformance (issue #1790). The proof behind AC-2: the
  # `edge-greeting` fixture is compiled BOTH ways — natively and to a real
  # `wasm32-wasip1` artifact — and a shared request corpus is driven through
  # the native edge lane, the wasm capsule (via the pure-Rust `wasmi` host in
  # `autumn-edge`, so there is no runtime to install), and the full origin app.
  # Status, headers and body bytes are compared; every fallthrough is checked
  # against the answer the origin actually gives.
  #
  # Its own job because it is the only lane that installs a second target, and
  # NOT path-filtered on purpose: byte-identity between the origin and the edge
  # is a property of the whole framework — a change to the router, a middleware,
  # a macro or a dependency is exactly what could break it, and none of those
  # live under `examples/`. The tests are `#[ignore]`d (they need the target),
  # so `cargo test --workspace` in the `test` job compiles them and skips them;
  # this job is the only place they run.
  edge-conformance:
    name: Edge capsule conformance (wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2.7.8
      - name: Build the edge capsule
        # Ahead of the suite (which builds it too) so a wasm-only compile break
        # reports as a build failure rather than as a conformance failure.
        run: cargo build -p edge-greeting --target wasm32-wasip1 --release --bin edge-capsule
      - name: Nothing native may reach the capsule
        # `autumn-edge`'s manifest guard asserts this at the source level (one
        # `default-features = true` on axum would undo it); this asserts it on
        # the RESOLVED graph for the artifact that actually ships, where a
        # transitive default feature could still drag a runtime in.
        # `--edges normal` excludes dev-dependencies: the conformance suite's
        # tokio and wasmi are native-only and never enter a capsule.
        run: |
          if cargo tree -p edge-greeting --target wasm32-wasip1 --edges normal \
            | grep -Ei 'tokio|hyper|mio|autumn-web'; then
            echo "::error::the capsule's wasm32-wasip1 graph must contain no native runtime and no autumn-web"
            exit 1
          fi
      - name: Run the origin/edge conformance suite
        # `--test-threads=1`: the suite installs a process-global panic hook
        # around the deliberately-panicking `/boom` handler.
        run: cargo test -p edge-greeting --test conformance -- --ignored --test-threads=1 --nocapture

  windows-tier1:
    name: Windows Tier 1 journey
    needs: [lint]
    runs-on: windows-latest
    # This is the gate behind the platform-support policy (issue #1616, AC-3).
    #
    # `cargo test --workspace` on `windows-latest` (the `test` job above) proves
    # the code COMPILES and its unit tests pass there. It proves nothing about
    # the journey a Windows developer actually walks — scaffold a project, run
    # `doctor`, run `setup`, edit a file and watch it rebuild, boot a managed
    # Postgres cluster and shut it down again. Every Windows regression this
    # repo has shipped (#1456, #1243, and the orphaned managed-Postgres cluster
    # this job exists to prevent) lived in exactly that gap.
    #
    # Each phase is its own named step so a red run names the broken journey
    # step in the Actions UI rather than requiring log spelunking. Keep it that
    # way when adding phases.
    #
    # `needs: [lint]` mirrors the `test` job: no point burning a Windows runner
    # on a branch that does not format or lint.
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      # Point the scaffold's build at the workspace target dir, which
      # `rust-cache` restores. Without this the job cold-compiles the whole
      # autumn-web dependency graph a second time on every run — the difference
      # between a ~30 minute job and one that flirts with its own timeout.
      #
      # `JOURNEY_DIR` and `AUTUMN_MANAGED_PG_DATA_DIR` cannot be set here: they
      # derive from `runner.temp`, and the `runner` context is NOT available in
      # a job-level `env:` block (only github/needs/strategy/matrix/vars/
      # secrets/inputs are). Using it here does not warn — it makes the whole
      # workflow file invalid, so every job in this file silently stops running.
      # They are exported from the first step instead.
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
      # The MSVC linker blows its PDB public-symbol limit linking the scaffolded
      # `--bundled-pg` app with default debug info:
      #
      #   LNK4318: Very long symbol name encountered while producing debug information
      #   LINK : fatal error LNK4319: A PDB limit was hit while adding public symbols
      #
      # autumn-web's full dependency graph plus `managed-pg-bundled` (which
      # embeds the Postgres binaries) produces more public symbols in one debug
      # binary than a PDB can hold. This is a real limit a Windows developer can
      # hit too — it is documented as a Windows detail in
      # docs/guide/platform-support.md and tracked for a product-level fix — so
      # it is named here rather than silently configured around.
      #
      # Dropping debug info is a legitimate build configuration and does not
      # weaken what this job gates: the journey still scaffolds, builds, boots a
      # managed cluster, reloads, and shuts down. It only means a crash here
      # yields a backtrace without line numbers.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Second, independent mitigation for the same limit. `/DEBUG:LongSymbolTruncate`
      # is what the linker itself recommends in the LNK4318 warning that precedes
      # the fatal LNK4319, so this exact toolchain supports it. Belt and braces
      # deliberately: a Windows CI cycle costs ~35 minutes, and the previous
      # single-remedy attempt did not hold.
      RUSTFLAGS: "-Clink-arg=/DEBUG:LongSymbolTruncate"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        continue-on-error: true

      - name: Resolve journey paths
        # Both live under RUNNER_TEMP, deliberately OUTSIDE the checkout:
        # `scripts/check-quickstart.sh` refuses the opposite arrangement for a
        # reason — a generated project nested under this repo inherits
        # `.cargo/config.toml` and the workspace `[patch.crates-io]` by
        # directory ancestry, which would silently change what the journey
        # tests. Keeping the managed cluster's data dir there also keeps its
        # sibling secrets (`.autumn-pg-superuser`, `.autumn-pg-url`) out of any
        # uploaded artifact.
        #
        # Pinning the data dir rather than letting it resolve under
        # `%LOCALAPPDATA%` lets the boot/shutdown assertions look at a known
        # path instead of re-deriving autumn's own resolution logic — which
        # would make the test agree with a bug rather than catch one.
        #
        # `$GITHUB_ENV` makes these ordinary environment variables for every
        # later step, including the app process, which reads
        # `AUTUMN_MANAGED_PG_DATA_DIR` itself.
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "JOURNEY_DIR=$env:RUNNER_TEMP\journey"
          Add-Content -Path $env:GITHUB_ENV -Value "AUTUMN_MANAGED_PG_DATA_DIR=$env:RUNNER_TEMP\tier1-pg"

      - name: Build the CLI
        run: cargo build -p autumn-cli --bin autumn

      - name: "Journey: autumn new (managed Postgres)"
        # `--bundled-pg` is the managed-Postgres starter — the Tier 1 journey
        # the policy promises, not a reduced stand-in for it.
        run: |
          $ErrorActionPreference = 'Stop'
          $autumn = "$env:GITHUB_WORKSPACE\target\debug\autumn.exe"
          New-Item -ItemType Directory -Force -Path $env:JOURNEY_DIR | Out-Null
          Set-Location $env:JOURNEY_DIR
          & $autumn new tier1_app --bundled-pg
          if ($LASTEXITCODE -ne 0) { throw "autumn new failed with $LASTEXITCODE" }
          if (-not (Test-Path "tier1_app\Cargo.toml")) { throw "scaffold produced no Cargo.toml" }
          # Build the scaffold against THIS commit's autumn-web rather than the
          # published crate, mirroring the workspace [patch.crates-io] override
          # the generator-conformance suite uses. Without it this job would gate
          # the last release instead of the pull request.
          $webPath = ("$env:GITHUB_WORKSPACE\autumn" -replace '\\', '/')
          Add-Content -Path "tier1_app\Cargo.toml" -Value "`n[patch.crates-io]`nautumn-web = { path = `"$webPath`" }`n"

          # Drop debug info for this build. autumn-web's graph plus
          # `managed-pg-bundled` overflows the MSVC PDB public-symbol limit
          # (LNK4319) — see docs/guide/platform-support.md and issue #2448,
          # which tracks scaffolding this so users never meet it.
          #
          # Written into the MANIFEST, not left to `CARGO_PROFILE_DEV_DEBUG`
          # alone: that variable is set job-wide and verifiably works locally
          # (it drops `-Cdebuginfo` for the package and its dependencies), yet
          # the failing Windows link still carried `/DEBUG` and debug-bearing
          # autumn_web objects. A manifest profile cannot be missed, and
          # `package."*"` covers every dependency explicitly rather than by
          # inheritance.
          Add-Content -Path "tier1_app\Cargo.toml" -Value "`n[profile.dev]`ndebug = 0`n`n[profile.dev.package.`"*`"]`ndebug = 0`n"
          Write-Host "--- generated Cargo.toml tail ---"
          Get-Content "tier1_app\Cargo.toml" -Tail 12 | Write-Host

      - name: "Journey: autumn doctor reports the platform tier"
        run: |
          $ErrorActionPreference = 'Stop'
          $autumn = "$env:GITHUB_WORKSPACE\target\debug\autumn.exe"
          Set-Location "$env:JOURNEY_DIR\tier1_app"
          # Grade the JSON, not the exit code: this scaffold legitimately warns
          # (no database configured yet), and what this step gates is that the
          # platform_support check RUNS and reports the tier — AC-4.
          #
          # No `2>&1`: merging stderr into the stream would let any subprocess
          # noise turn a passing check into a JSON parse error.
          $json = & $autumn doctor --json | Out-String
          Write-Host $json
          $report = $json | ConvertFrom-Json
          $check = $report.checks | Where-Object { $_.name -eq 'platform_support' }
          if (-not $check) { throw "doctor did not run the platform_support check" }
          if ($check.detail -notmatch 'Tier 1') { throw "platform_support did not report Tier 1: $($check.detail)" }
          if ($check.detail -notmatch 'Tier 2') { throw "platform_support did not report Tier 2: $($check.detail)" }
          if ($check.detail -notmatch 'vcpkg') { throw "platform_support did not flag the vcpkg/OpenSSL prerequisite: $($check.detail)" }
          # `doctor` is itself a Tier 1 command, and `--strict` must not reject a
          # machine for being a Windows one.
          # `CheckStatus` serializes lowercase (`#[serde(rename_all)]`).
          # `doctor` is itself a Tier 1 command, and `--strict` must not reject a
          # machine for being a Windows one — so this check has to Pass, not warn.
          if ($check.status -ne 'pass') { throw "platform_support must pass so it cannot fail --strict: $($check.status)" }
          # The GitHub pwsh wrapper appends `exit $LASTEXITCODE`, so a step that
          # grades output rather than exit codes must reset it — otherwise the
          # last native call decides the step result and the grading is moot.
          exit 0

      - name: "Journey: autumn setup"
        run: |
          $ErrorActionPreference = 'Stop'
          $autumn = "$env:GITHUB_WORKSPACE\target\debug\autumn.exe"
          Set-Location "$env:JOURNEY_DIR\tier1_app"
          & $autumn setup
          if ($LASTEXITCODE -ne 0) { throw "autumn setup failed with $LASTEXITCODE" }

      - name: "Journey: the app builds on Windows"
        env:
          # `--bundled-pg` compiles `postgresql_embedded`, whose build script
          # downloads Postgres binaries via the GitHub API; unauthenticated it
          # hits the 60 req/hr rate limit and fails the build with a 403.
          # Authenticate with the job's token to get the higher rate limit, as
          # the coverage job already does.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `Continue`, not `Stop`: cargo writes progress to stderr, and under
          # `Stop` a piped native command turns that into a NativeCommandError.
          $ErrorActionPreference = 'Continue'
          Set-Location "$env:JOURNEY_DIR\tier1_app"

          # Free space before the build. A shared CARGO_TARGET_DIR holds both
          # the workspace and the scaffold, and "no space left" surfaces as an
          # unrelated-looking compiler error.
          Get-PSDrive D | Format-Table Name, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Out-String | Write-Host

          # Tee to a file so a failure can be reported IN THIS STEP and uploaded
          # as an artifact. Without this the compiler error is only in the raw
          # job log, which is exactly the spelunking this job exists to avoid —
          # and it is out of reach of the Actions logs API, which truncates.
          $buildLog = "$env:JOURNEY_DIR\app-build.log"
          cargo build 2>&1 | Tee-Object -FilePath $buildLog
          $code = $LASTEXITCODE

          Get-PSDrive D | Format-Table Name, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Out-String | Write-Host

          if ($code -ne 0) {
            Write-Host "::group::cargo build output (last 150 lines)"
            Get-Content $buildLog -Tail 150 -ErrorAction SilentlyContinue | Write-Host
            Write-Host "::endgroup::"
            Write-Host "::error::the scaffolded app did not build (cargo exit $code) — see the group above and the windows-tier1-logs artifact"
            exit 1
          }
          # Cargo does not fail on an unused `[patch.crates-io]` — it warns and
          # builds against the registry. Without this assertion a version skew
          # between the scaffold template and the workspace would silently turn
          # this whole job into a gate on the last published release.
          # `scripts/check-quickstart.sh` makes the same assertion.
          #
          # Parse the `[[package]]` block whose name is `autumn-web` and check
          # only ITS source. A dot-matching-newlines regex across the whole file
          # would run past a correctly-patched (source-less) autumn-web entry to
          # the next registry dependency and fail every green run.
          $lock = Get-Content 'Cargo.lock' -Raw
          $block = ($lock -split '\[\[package\]\]') |
            Where-Object { $_ -match '(?m)^\s*name\s*=\s*"autumn-web"\s*$' } |
            Select-Object -First 1
          if (-not $block) { throw "autumn-web is not in Cargo.lock at all" }
          if ($block -match '(?m)^\s*source\s*=') {
            throw "autumn-web resolved from a registry — the [patch.crates-io] override did not take. Its lock entry: $block"
          }

      - name: "Journey: managed Postgres boots and shuts down cleanly"
        # THE regression this whole target exists to prevent, tested at the
        # runtime seam. The app is started exactly the way `autumn dev` starts
        # it on Windows — with AUTUMN_SHUTDOWN_SIGNAL_FILE set — and stopped
        # exactly the way `autumn dev` stops it: by creating that file. A clean
        # shutdown means the app's `on_shutdown` hook ran, which means the
        # managed cluster was stopped rather than orphaned. Before #1616 the
        # only available stop was TerminateProcess, which skipped the hook and
        # left a postmaster holding the data dir. The next step gates the same
        # thing end-to-end through `autumn dev` itself.
        run: |
          $ErrorActionPreference = 'Stop'
          $app = "$env:GITHUB_WORKSPACE\target\debug\tier1_app.exe"
          if (-not (Test-Path $app)) { throw "app binary not found at $app" }
          $signal = "$env:JOURNEY_DIR\stop.signal"
          Remove-Item -Force -ErrorAction SilentlyContinue $signal
          $env:AUTUMN_SHUTDOWN_SIGNAL_FILE = $signal
          $pidfile = "$env:AUTUMN_MANAGED_PG_DATA_DIR\postmaster.pid"

          $proc = Start-Process -FilePath $app -PassThru `
            -WorkingDirectory "$env:JOURNEY_DIR\tier1_app" `
            -RedirectStandardOutput "$env:JOURNEY_DIR\app.out" `
            -RedirectStandardError "$env:JOURNEY_DIR\app.err"

          try {
            # Boot: wait for the managed cluster's postmaster to claim the data
            # dir. First boot provisions the cluster (initdb), so allow for it.
            $deadline = (Get-Date).AddMinutes(8)
            while (-not (Test-Path $pidfile)) {
              if ($proc.HasExited) {
                Get-Content "$env:JOURNEY_DIR\app.err" -ErrorAction SilentlyContinue
                throw "the app exited (code $($proc.ExitCode)) before managed Postgres booted"
              }
              if ((Get-Date) -gt $deadline) { throw "managed Postgres did not boot within 8 minutes" }
              Start-Sleep -Milliseconds 500
            }
            Write-Host "managed Postgres booted: $pidfile"

            # Clean shutdown: request it the way `autumn dev` does. The budget
            # is generous — a cold Windows `pg_ctl stop` under the provider's
            # own 60s ceiling is not something to race.
            New-Item -ItemType File -Path $signal -Force | Out-Null
            if (-not $proc.WaitForExit(180000)) {
              throw "the app ignored AUTUMN_SHUTDOWN_SIGNAL_FILE and did not drain"
            }
            if ($proc.ExitCode -ne 0) { throw "the app exited $($proc.ExitCode), not cleanly" }

            # A cluster stopped through `pg_ctl` removes its own pidfile. A
            # surviving one is the orphan this target forbids.
            if (Test-Path $pidfile) {
              throw "managed Postgres was left running: $pidfile still exists after shutdown"
            }
            # The data dir itself must survive — a "clean shutdown" that lost the
            # developer's database would pass the check above for the wrong reason.
            if (-not (Test-Path "$env:AUTUMN_MANAGED_PG_DATA_DIR\PG_VERSION")) {
              throw "the managed cluster's data dir did not survive shutdown"
            }
            Write-Host "managed Postgres shut down cleanly and its data dir survived"
          } finally {
            # Never leave a postmaster holding the data dir for the next step:
            # a second, unrelated-looking failure would mask this one's cause.
            if (-not $proc.HasExited) { $proc.Kill(); $proc.WaitForExit(30000) | Out-Null }
          }

      - name: "Journey: autumn dev rebuilds, reloads, and stops the app cleanly"
        # The end-to-end half of the same guarantee, through the real command.
        # The assertions are deliberately about NEW output and a LIVE server
        # after the reload: a whole-log substring match would be satisfied by
        # the initial boot's own lines and would gate nothing.
        run: |
          $ErrorActionPreference = 'Stop'
          $autumn = "$env:GITHUB_WORKSPACE\target\debug\autumn.exe"
          $app = "$env:JOURNEY_DIR\tier1_app"
          $log = "$env:JOURNEY_DIR\dev.log"
          $pidfile = "$env:AUTUMN_MANAGED_PG_DATA_DIR\postmaster.pid"

          # `Start-Process` inherits the PROCESS working directory, not
          # PowerShell's provider location, so `-WorkingDirectory` is required:
          # without it `autumn dev` runs in the checkout root, finds no
          # autumn.toml, and exits 1.
          $dev = Start-Process -FilePath $autumn -ArgumentList 'dev' -PassThru `
            -WorkingDirectory $app `
            -RedirectStandardOutput "$env:JOURNEY_DIR\dev.out" `
            -RedirectStandardError $log

          function Read-DevLog {
            $text = Get-Content $log -Raw -ErrorAction SilentlyContinue
            if ($null -eq $text) { '' } else { $text }
          }

          function Wait-ForCount($pattern, $atLeast, $timeoutSeconds, $what) {
            $deadline = (Get-Date).AddSeconds($timeoutSeconds)
            while ((Get-Date) -lt $deadline) {
              if ($dev.HasExited) {
                Read-DevLog | Write-Host
                throw "autumn dev exited ($($dev.ExitCode)) while waiting for $what"
              }
              if (([regex]::Matches((Read-DevLog), $pattern)).Count -ge $atLeast) { return }
              Start-Sleep -Milliseconds 500
            }
            Read-DevLog | Write-Host
            throw "timed out after ${timeoutSeconds}s waiting for $what"
          }

          try {
            # The watcher is up and the first build has been served. Require the
            # build to have been GREEN: `autumn dev` reaches the watch loop even
            # after a failed initial build.
            Wait-ForCount 'Watching for changes' 1 1800 'the initial build and watch'
            if ((Read-DevLog) -match 'Initial build failed') { throw "the initial dev build failed" }
            Wait-ForCount 'Starting server' 1 60 'the first server start'

            # The managed cluster must be up under `autumn dev` too.
            $deadline = (Get-Date).AddMinutes(5)
            while (-not (Test-Path $pidfile)) {
              if ((Get-Date) -gt $deadline) { throw "managed Postgres did not boot under autumn dev" }
              Start-Sleep -Milliseconds 500
            }

            # Count restarts BEFORE the edit and require an INCREASE, rather
            # than testing against a fixed number. An absolute threshold passes
            # if `autumn dev` ever emitted a second start for an unrelated
            # reason — and then the /health 200 below would be answered by the
            # original, un-reloaded process. This is the assertion that makes
            # the step mean what its name says.
            $startsBefore = ([regex]::Matches((Read-DevLog), 'Starting server')).Count
            Write-Host "restarts before the edit: $startsBefore"

            # Edit a watched source file. A comment is enough: it is a real
            # recompile, and it cannot change behaviour and mask a failure.
            Add-Content -Path "$app\src\main.rs" -Value "`n// tier1 journey edit`n"

            Wait-ForCount 'Changed:' 1 180 'the edit to be detected'
            # One MORE 'Starting server' than before the edit — the restart after
            # the rebuild. On Windows `autumn dev` stops the old binary BEFORE
            # building, so this line only appears if the cooperative stop
            # released the exe lock and the rebuild then relinked over it.
            Wait-ForCount 'Starting server' ($startsBefore + 1) 1800 'the rebuild and restart'

            # The stop must have been cooperative. If the app had to be
            # force-stopped, its `on_shutdown` hook did not run and the managed
            # cluster was orphaned — the exact #1616 regression. `autumn dev`
            # says so out loud, so assert it did not have to.
            if ((Read-DevLog) -match 'force-stopped') {
              Read-DevLog | Write-Host
              throw "autumn dev had to force-stop the app: shutdown hooks were skipped"
            }

            # The decisive assertion: the reloaded server actually answers. It
            # can only do so if the previous instance released the cluster's
            # data dir — an orphaned postmaster would hold it and the restarted
            # app would exit at boot.
            $deadline = (Get-Date).AddMinutes(3)
            $served = $false
            while (-not $served -and (Get-Date) -lt $deadline) {
              try {
                $r = Invoke-WebRequest 'http://127.0.0.1:3000/health' -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200) { $served = $true }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $served) {
              Read-DevLog | Write-Host
              throw "the reloaded server never answered GET /health"
            }
            Write-Host "dev loop: edit -> cooperative stop -> rebuild -> restart -> 200 OK"
            Write-Host "::group::autumn dev output"
            Read-DevLog | Write-Host
            Write-Host "::endgroup::"
          } finally {
            # Harness cleanup, not a product assertion: there is no supported way
            # to interrupt a foreground `autumn dev` from a non-interactive
            # PowerShell step.
            Stop-Process -Id $dev.Id -Force -ErrorAction SilentlyContinue
            Get-Process -Name 'tier1_app' -ErrorAction SilentlyContinue | Stop-Process -Force
            Get-Process -Name 'postgres' -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: "Policy: Tier 2 commands fail fast, not silently"
        # AC-2's other half. A Tier 2 command on native Windows must exit
        # non-zero with a message naming the tier and the policy — the failure
        # mode this target exists to eliminate is the one where it half-works.
        run: |
          $ErrorActionPreference = 'Continue'
          $autumn = "$env:GITHUB_WORKSPACE\target\debug\autumn.exe"
          Set-Location "$env:JOURNEY_DIR\tier1_app"

          $output = & $autumn serve --daemon 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -eq 0) { throw "autumn serve --daemon must not succeed on native Windows" }
          if ($output -notmatch 'Tier 2') { throw "the daemon refusal did not name the tier: $output" }
          if ($output -notmatch 'WSL2') { throw "the daemon refusal did not name WSL2: $output" }
          if ($output -notmatch 'platform-support') { throw "the daemon refusal did not link the policy: $output" }

          $output = & $autumn deploy up 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -eq 0) { throw "autumn deploy up must not succeed on native Windows" }
          if ($output -notmatch 'Tier 2') { throw "the deploy refusal did not name the tier: $output" }
          if ($output -notmatch 'WSL2') { throw "the deploy refusal did not name WSL2: $output" }
          if ($output -match 'failed to load configuration') { throw "the refusal must not masquerade as a config error: $output" }

          # The other half of the policy: `deploy check` is Tier 1 (local-only —
          # it grades config and probes reachability with a portable TCP
          # connect), so it must NOT be refused. It still exits non-zero here
          # because the scaffolded app configures no `[deploy] host` — the point
          # is WHICH failure it is. Refusing it would take away the only way a
          # Windows developer can validate a deploy config before switching to
          # WSL2, and would claim something untrue about the command.
          $output = & $autumn deploy check 2>&1 | Out-String
          Write-Host $output
          if ($output -match 'Tier 2') { throw "autumn deploy check is Tier 1 and must run natively: $output" }
          if ($output -notmatch '\[deploy\] host') { throw "deploy check did not reach its config grading: $output" }

          # All three invocations are SUPPOSED to exit non-zero (the first two
          # by refusal, the third because the scaffolded app has no deploy
          # host), and the GitHub pwsh wrapper appends `exit $LASTEXITCODE` — so
          # without this the step fails precisely when the policy is working.
          exit 0

      - name: Upload journey logs
        # `always()`, not `failure()`: a PASSING run's logs are what show the
        # journey actually happened — a gate nobody can audit is a gate nobody
        # should trust.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-tier1-logs
          # Named files only. The cluster's superuser password
          # (`.autumn-pg-superuser`) and its published URL (`.autumn-pg-url`)
          # live beside the data dir; a broader glob would publish them.
          path: |
            ${{ runner.temp }}\journey\app-build.log
            ${{ runner.temp }}\journey\dev.log
            ${{ runner.temp }}\journey\dev.out
            ${{ runner.temp }}\journey\app.out
            ${{ runner.temp }}\journey\app.err
            ${{ runner.temp }}\tier1-pg\log\*
          if-no-files-found: ignore
