name: Wire contracts

# Runs `scripts/wire-contract-sweep.py` over `examples/mesh-catalog` and
# `examples/mesh-storefront`:
#
#   * Seeded mutations: each wire-breaking change must fail the storefront
#     build with a caller-named error. No compatible change may fail it.
#   * Two releases: each release-2 case runs `autumn contracts check` against
#     the committed `examples/mesh-storefront/contracts/release-1.json`. The
#     exit code and the named deploy order must match.
#   * Byte stability: two real exports must give the same bytes as the
#     committed bundle. An edit to the examples that changes the contract
#     must also export the bundle again.
#   * Proto export: two real `--proto` exports must give the same bytes as
#     the committed `examples/mesh-storefront/contracts/proto/`, and
#     `--check` must pass on the committed lock.
#   * buf: `buf lint` and `buf build` on each golden proto export, and
#     `buf breaking` agrees with `autumn contracts check` on each golden
#     release pair (`autumn-cli/tests/integration/contracts_proto.rs`).
#
# The path filter keeps this job off PRs that do not touch wire code.

on:
  pull_request:
    branches: [trunk, trunk-dev]
    paths:
      - "autumn-cli/tests/golden/contracts/**"
      - "autumn-cli/tests/integration/contracts_proto.rs"
      - "autumn-cli/tests/fixtures/googleapis-stub/**"
      - "autumn-macros/src/wire/**"
      - "autumn-macros/src/event.rs"
      - "autumn-macros/src/listener.rs"
      - "autumn-macros-support/src/wire/**"
      - "autumn-macros/src/routes_macro.rs"
      - "autumn/src/wire/**"
      - "autumn/src/events.rs"
      - "autumn-cli/src/contracts/**"
      - "examples/mesh-catalog/**"
      - "examples/mesh-storefront/**"
      - "scripts/wire-contract-sweep.py"
      - ".github/workflows/wire-contracts.yml"
  push:
    branches: [trunk, trunk-dev]
    paths:
      - "autumn-cli/tests/golden/contracts/**"
      - "autumn-cli/tests/integration/contracts_proto.rs"
      - "autumn-cli/tests/fixtures/googleapis-stub/**"
      - "autumn-macros/src/wire/**"
      - "autumn-macros/src/event.rs"
      - "autumn-macros/src/listener.rs"
      - "autumn-macros-support/src/wire/**"
      - "autumn-macros/src/routes_macro.rs"
      - "autumn/src/wire/**"
      - "autumn/src/events.rs"
      - "autumn-cli/src/contracts/**"
      - "examples/mesh-catalog/**"
      - "examples/mesh-storefront/**"
      - "scripts/wire-contract-sweep.py"
      - ".github/workflows/wire-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wire-contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # kache S3 remote (.github/actions/kache). Unset variables keep the GitHub
  # Actions cache. The write token is mapped only on a protected ref.
  AUTUMN_KACHE_S3_BUCKET: ${{ vars.AUTUMN_KACHE_S3_BUCKET || secrets.AUTUMN_KACHE_S3_BUCKET }}
  AUTUMN_KACHE_S3_ENDPOINT: ${{ vars.AUTUMN_KACHE_S3_ENDPOINT || secrets.AUTUMN_KACHE_S3_ENDPOINT }}
  AUTUMN_KACHE_S3_REGION: ${{ vars.AUTUMN_KACHE_S3_REGION || secrets.AUTUMN_KACHE_S3_REGION }}
  AUTUMN_KACHE_S3_READ_ACCESS_KEY_ID: ${{ secrets.AUTUMN_KACHE_S3_READ_ACCESS_KEY_ID }}
  AUTUMN_KACHE_S3_READ_SECRET_ACCESS_KEY: ${{ secrets.AUTUMN_KACHE_S3_READ_SECRET_ACCESS_KEY }}
  AUTUMN_KACHE_S3_WRITE_ACCESS_KEY_ID: ${{ github.ref_protected && secrets.AUTUMN_KACHE_S3_WRITE_ACCESS_KEY_ID || '' }}
  AUTUMN_KACHE_S3_WRITE_SECRET_ACCESS_KEY: ${{ github.ref_protected && secrets.AUTUMN_KACHE_S3_WRITE_SECRET_ACCESS_KEY || '' }}

jobs:
  sweep:
    name: Wire-contract sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./.github/actions/kache
        continue-on-error: true
        with:
          key: wire-contracts
      - name: Build the autumn CLI
        run: cargo build -p autumn-cli
      - name: Run the sweep
        env:
          AUTUMN_BIN: target/debug/autumn
        run: python3 scripts/wire-contract-sweep.py
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install buf
        run: |
          npm install --prefix "$RUNNER_TEMP/buf" @bufbuild/buf@1.75.0
          "$RUNNER_TEMP/buf/node_modules/.bin/buf" --version
      - name: buf lint, build and breaking on the proto export
        env:
          BUF: ${{ runner.temp }}/buf/node_modules/.bin/buf
        run: |
          cargo test -p autumn-cli --test cli_tests -- --ignored --exact \
            integration::contracts_proto::buf_lint_and_buf_build_pass_on_each_proto_export \
            integration::contracts_proto::buf_breaking_finds_no_break_that_contracts_check_approved \
            | tee "$RUNNER_TEMP/buf.log"
          grep -Eq "test result: ok\. 2 passed" "$RUNNER_TEMP/buf.log"
