name: Quickstart Gate

# Runs the README quickstart end-to-end against the PUBLISHED crates
# (issue #1586): install autumn-cli from crates.io, `autumn new`,
# `autumn setup`, build, serve, first 200 from `GET /` — then the README's
# scaffold path (`autumn generate scaffold Post ...` → build → migrate →
# `GET /posts` responds). Each phase is its own step, so a red run names the
# quickstart step that broke in the Actions UI without log spelunking, and
# the job summary records the tracked funnel number (install → first 200).
#
# Trigger semantics — read this before blaming a commit:
#   * A push-triggered run validates the README at that commit against
#     whatever is on crates.io. It does NOT exercise the pushed code — the
#     workspace [patch.crates-io] override means nothing in this repo's other
#     CI ever builds against the published autumn-web, which is exactly the
#     blind spot this gate covers. A red run on push means "a new user
#     following the README today is broken", not "this commit is broken".
#   * The daily schedule catches breakage caused by upstream dependency
#     releases and crates.io-side skew, with no commit involved.
#   * workflow_dispatch takes a `cli-version` input so a release candidate
#     that was just published to crates.io can be gated explicitly —
#     docs/release-checklist.md requires a green dispatched run against the
#     candidate version before the release is announced.
#
# Deliberately NO Rust build caching on the quickstart phases: the gate's
# tracked number is the fresh-user funnel (cold `cargo install` → first 200),
# and a warmed cache would corrupt it. Nothing user-facing is pre-installed
# either — the Diesel CLI (documented prerequisite of the scaffold path) is
# installed by the scaffold-migrate phase with exactly the documented
# command, after the funnel has been measured.

on:
  push:
    branches: [trunk-dev]
  schedule:
    # Daily at 05:23 UTC — catches upstream dependency releases that break
    # the quickstart with no commit to this repo.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      cli-version:
        description: >-
          autumn-cli version to install from crates.io (release-candidate
          gating). Leave empty to use the version pinned in the README
          quickstart.
        required: false
        default: ""

# Dispatched runs get their own concurrency group (keyed by run_id) so a push
# to trunk-dev can never cancel an in-flight release-candidate gating run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  QUICKSTART_CLI_VERSION: ${{ inputs.cli-version }}
  # DATABASE_URL is deliberately NOT set job-wide: the README path up to
  # `GET /` configures no database, and the base serve phase must exercise
  # that no-DB runtime. Only the scaffold-migrate step gets it — and even
  # there the script only uses it to write database.url into autumn.toml
  # (the documented config step); the documented commands themselves run
  # with DB env stripped.
  QUICKSTART_DATABASE_URL: postgres://autumn:autumn@localhost:5432/quickstart

jobs:
  quickstart:
    name: README quickstart vs published crates (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    # Two toolchain legs: `stable` is the typical new user (and the canonical
    # funnel metric); "1.88.0" is the MSRV the README advertises ("Rust
    # 1.88.0+" — README ## Requirements), so an upstream dependency release
    # or a published crate that quietly raises its rust-version above the
    # documented floor turns this gate red instead of silently breaking only
    # the users on the documented minimum. Keep the pin in lockstep with the
    # README / [workspace.package] rust-version (scripts/check-msrv.sh
    # guards that alignment).
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.88.0"]
    # A hung cargo install/build or download must not burn the default 6-hour
    # job budget; the whole quickstart fits well inside an hour even cold.
    timeout-minutes: 60
    services:
      # The `quickstart` database is deliberately NOT pre-created (no
      # POSTGRES_DB): the documented scaffold path includes creating the
      # database (`createdb my_app` in docs/guide/generators.md), and the
      # scaffold-migrate phase runs that step — pre-creating it here would
      # mask a fresh user's failure. The image's default database (named
      # after POSTGRES_USER) only serves as the createdb maintenance DB.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autumn
          POSTGRES_PASSWORD: autumn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autumn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      # No diesel_cli pre-install: the Diesel CLI is a documented user-facing
      # prerequisite of the scaffold path (docs/guide/generators.md), so the
      # scaffold-migrate phase installs it with exactly the documented
      # command. Pre-installing it here would mask a fresh user's failure.

      - name: "Quickstart: install (cargo install autumn-cli)"
        run: ./scripts/check-quickstart.sh install

      - name: "Quickstart: new (autumn new my-app)"
        run: ./scripts/check-quickstart.sh new

      - name: "Quickstart: setup (autumn setup)"
        run: ./scripts/check-quickstart.sh setup

      - name: "Quickstart: build (cargo build, published autumn-web)"
        run: ./scripts/check-quickstart.sh build

      - name: "Quickstart: first request (GET / → 200, funnel number)"
        run: ./scripts/check-quickstart.sh serve

      - name: "Scaffold: generate (autumn generate scaffold Post ...)"
        run: ./scripts/check-quickstart.sh scaffold

      - name: "Scaffold: build"
        run: ./scripts/check-quickstart.sh scaffold-build

      - name: "Scaffold: migrate (diesel_cli + autumn.toml + createdb + autumn migrate)"
        env:
          # Consumed by the script only to write database.url into
          # autumn.toml and to point createdb at the service container;
          # `autumn migrate` itself runs with DB env stripped.
          DATABASE_URL: ${{ env.QUICKSTART_DATABASE_URL }}
        run: ./scripts/check-quickstart.sh scaffold-migrate

      - name: "Scaffold: first request (GET /posts → 200)"
        # No DB env: the server reads database.url from autumn.toml, the
        # documented configuration a real user has.
        run: ./scripts/check-quickstart.sh scaffold-serve

  local-dev-quickstart:
    name: "Local-dev quickstart: source-built CLI vs published autumn-web"
    runs-on: ubuntu-latest
    # This is the OTHER install path README.md and
    # docs/guide/getting-started.md document alongside the published-CLI
    # quickstart above: `cargo install --path autumn-cli` from a source
    # checkout ("Local development"), then `autumn new`.
    #
    # The `quickstart` job above always pairs the published CLI with the
    # published autumn-web — by construction they were released together,
    # so they can never disagree. `generator-conformance.yml` always pairs
    # a source-built CLI with the in-tree autumn-web via
    # `[patch.crates-io]` — by construction they too can never disagree,
    # since both come from the same commit. Neither can catch the third,
    # real pairing a local-development user actually gets: a source-built
    # CLI (today's trunk-dev) scaffolding a project that stays pinned to
    # whatever autumn-web is *published* (`autumn new` writes the CLI's own
    # `CARGO_PKG_VERSION` as the pin — see `autumn-cli/src/new.rs`) — and
    # that version string is frozen at the last release tag until a
    # maintainer explicitly cuts the next one (CLAUDE.md, "Never bump the
    # workspace version"). Any commit that changes a public autumn-web API
    # the *base* `autumn new` template calls, without a release to carry it
    # to crates.io yet, breaks exactly this pairing — silently: `autumn
    # doctor`'s `version_compat` check compares version *strings* (`0.7.0`
    # matches `0.7.0`) and reports green regardless, because it has no way
    # to see API drift that a version number does not carry. This job only
    # runs `autumn new`, not `autumn generate` — drift confined to a
    # generator-emitted call site is a separate, uncovered instance of the
    # same gap, not something a red/green here proves either way.
    #
    # A red run here means precisely that has happened. Until the next
    # release ships, the workaround is the one `autumn doctor`'s own docs
    # already describe: point the generated `Cargo.toml` at the checkout
    # with a `[patch.crates-io]` override (see
    # `generated_project_compiles_against_published_autumn_web`'s doc
    # comment in autumn-cli/tests/e2e.rs for the mechanism and the exact
    # commit — 76c56b1 — that first triggered it, undetected, for three
    # days). This job does not gate anything else in this repo; it exists
    # to make that failure visible the moment it happens instead of
    # leaving it for whoever tries `cargo install --path autumn-cli` next.
    #
    # Skipped on workflow_dispatch: a dispatched run gates a specific
    # release *candidate* pinned via `cli-version` (docs/release-checklist.md
    # step 7 — "a red run is a release blocker"), always built against the
    # candidate's own published crates. This job ignores `cli-version`
    # entirely and tests the checked-out *source* CLI instead, which is
    # expected to go red whenever trunk-dev carries unreleased drift —
    # unrelated to whether the candidate being gated is healthy. Running it
    # on push/schedule (where it belongs) and excluding it here keeps it
    # from turning an otherwise-green candidate gate into a false release
    # blocker.
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: "autumn new my-app, then cargo build against published autumn-web"
        # No DATABASE_URL, no Postgres service: the base `autumn new`
        # output (no generate/scaffold) needs neither to reach its first
        # `cargo build` — and that first build is exactly what breaks.
        run: |
          cargo test -p autumn-cli --test e2e \
            generated_project_compiles_against_published_autumn_web \
            -- --ignored --exact
