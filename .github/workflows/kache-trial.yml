name: kache trial

# Times the autumn-web test build with kache (a per-compile, content-addressed
# compiler cache: https://github.com/kunobi-ninja/kache) against the
# Swatinem/rust-cache setup every heavy CI job uses today.
#
# Each run starts both caches cold under a run-unique key, so runs compare.
#   seed:  cold build of the default feature set, then save the cache.
#   reuse: a fresh runner restores that cache and builds again.
#          warm-default:  nothing changed. kache's best case.
#          edited-default: autumn-web's source changed, as in about half
#                         of trunk commits.
#          warm-markdown: a different feature set on the same cache, the case
#                         a `test-features` lane meets.
#   report: one table of every timing, in the run summary.
#   cleanup: deletes this run's cache entries so the trial does not push
#          ci.yml's entries out of the repo's 10 GB Actions cache.
#
# The build is `cargo test -p autumn-web --lib --no-run`. Crate downloads are a
# separate, untimed step, so the timing covers compiling and linking only.
#
# Runs on a PR that changes this file, or by manual dispatch. Linux only.
on:
  workflow_dispatch:
  pull_request:
    branches: [trunk, trunk-dev]
    paths:
      - ".github/workflows/kache-trial.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same values as ci.yml.
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_MIN_STACK: 8388608
  # Neither cache stores incremental state. rust-cache sets this itself; set
  # it for both so the two arms build the same way.
  CARGO_INCREMENTAL: 0
  TRIAL_KEY: kache-trial-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  seed:
    name: seed (${{ matrix.cache }})
    # A push never reaches this workflow's triggers, but #2594 saw a
    # dispatch-only workflow evaluated on push anyway. Keep it off push.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        cache: [rust-cache, kache]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - &free-disk
        name: Free disk space
        run: |
          # Same list as ci.yml: a cold autumn-web test build is near the
          # runner's disk ceiling.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/local/lib/node_modules \
            /usr/share/swift
          sudo docker image prune --all --force || true
          df -h
      - uses: dtolnay/rust-toolchain@1.99.0
      - if: matrix.cache == 'rust-cache'
        uses: Swatinem/rust-cache@v2.7.8
        with:
          shared-key: ${{ env.TRIAL_KEY }}
      - if: matrix.cache == 'kache'
        # v1 as of 2026-09-25.
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed
        with:
          version: v2.0.0
          cache-key-prefix: ${{ env.TRIAL_KEY }}
          # A sticky comment notifies everyone on the PR; the job summary
          # carries the same stats.
          pr-comment: false
      - &fetch
        name: Fetch crates (untimed)
        run: cargo fetch --locked
      - &build
        name: Build autumn-web tests (timed)
        env:
          CACHE: ${{ matrix.cache }}
          LEG: ${{ matrix.leg || 'seed-default' }}
          FEATURES: ${{ matrix.features || '' }}
          EDIT: ${{ matrix.edit || false }}
        run: |
          set -euo pipefail
          # A changed comment is enough to change autumn-web's cache key.
          if [ "$EDIT" = true ]; then echo "// kache trial edit" >> autumn/src/lib.rs; fi
          args=(test -p autumn-web --lib --no-run --locked)
          [ -n "$FEATURES" ] && args+=(--features "$FEATURES")
          start=$(date +%s)
          cargo "${args[@]}"
          secs=$(( $(date +%s) - start ))
          echo "| $CACHE | $LEG | ${secs}s |" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p timing
          printf '%s\t%s\t%s\n' "$CACHE" "$LEG" "$secs" > "timing/$CACHE-$LEG.tsv"
          if [ "$CACHE" = kache ]; then kache stats || true; fi
      - &upload
        uses: actions/upload-artifact@v7
        with:
          name: timing-${{ matrix.cache }}-${{ matrix.leg || 'seed-default' }}
          path: timing/

  reuse:
    name: reuse (${{ matrix.cache }}, ${{ matrix.leg }})
    needs: seed
    strategy:
      fail-fast: false
      matrix:
        cache: [rust-cache, kache]
        leg: [warm-default, edited-default, warm-markdown]
        include:
          - leg: edited-default
            edit: true
          - leg: warm-markdown
            features: markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *free-disk
      - uses: dtolnay/rust-toolchain@1.99.0
      - if: matrix.cache == 'rust-cache'
        uses: Swatinem/rust-cache@v2.7.8
        with:
          shared-key: ${{ env.TRIAL_KEY }}
          save-if: false
      - if: matrix.cache == 'kache'
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed
        with:
          version: v2.0.0
          cache-key-prefix: ${{ env.TRIAL_KEY }}
          pr-comment: false
          save-cache: false
      - *fetch
      - *build
      - *upload

  report:
    needs: [seed, reuse]
    if: always() && needs.seed.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: timing-*
          merge-multiple: true
          path: timing
      - name: Summarize
        run: |
          set -euo pipefail
          {
            echo '### kache trial: `cargo test -p autumn-web --lib --no-run`'
            echo
            echo '| cache | leg | build time |'
            echo '| --- | --- | --- |'
            sort timing/*.tsv | awk -F'\t' '{ printf "| %s | %s | %ss |\n", $1, $2, $3 }'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  cleanup:
    needs: [seed, reuse]
    if: always() && needs.seed.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    # A fork PR's token cannot delete caches. The entries then age out on
    # their own after seven days unused.
    continue-on-error: true
    steps:
      - name: Delete this run's cache entries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # rust-cache prefixes its key with `v0-rust-`; both keys contain
          # TRIAL_KEY.
          gh cache list --limit 100 --json id,key \
            --jq ".[] | select(.key | contains(\"$TRIAL_KEY\")) | .id" \
            | while read -r id; do gh cache delete "$id"; done
