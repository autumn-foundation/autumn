name: Capacity Contract Gate

# The CI half of the per-deploy capacity contract (issue #1733).
#
# Per-PR: only the pure logic runs — the ladder statistics, the saturation-knee
# rule, the seeded request profile, the `--check` comparison and its rendered
# diff, plus the contract model and the runtime admission-sourcing rules. None
# of that needs a build of a target app or a load-generating server.
#
# Scheduled / manual: the live gate runs — it builds a reference app in RELEASE
# mode and drives a concurrency ladder against it, which is far too slow and
# far too sensitive to a shared runner's noisy neighbours to be a per-PR
# required check. That is the same posture the cold-start and dev-loop-scaling
# gates take, and it is load bearing here: a capacity gate that cries wolf gets
# switched off, which is strictly worse than not having one.
on:
  schedule:
    # Every Monday at 09:00 UTC (after the cold-start and dev-loop gates).
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      example:
        description: "Reference app to calibrate (path relative to the workspace root)"
        required: false
        default: "examples/hello"
      noop_rebuilds:
        description: "How many no-op `--check` rebuilds to run (the false-positive probe)"
        required: false
        # The issue's Success Metric is "zero false positives across 20 no-op
        # rebuilds"; three samples cannot tell a 15%-flake gate from a 0% one.
        # Each iteration is a cached rebuild plus one ladder, so the cost is
        # bounded.
        default: "20"
  pull_request:
    branches: [trunk, trunk-dev]
    paths:
      - "autumn/src/capacity.rs"
      - "autumn/src/route_listing.rs"
      - "autumn-cli/src/capacity.rs"
      - "autumn-cli/src/capacity_driver.rs"
      - "autumn-cli/src/main.rs"
      - "autumn-macros/src/route.rs"
      - "docs/guide/capacity-contracts.md"
      - ".github/workflows/capacity-contract.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # See the identical note in cold-start-latency.yml: this CLI's whole clap
  # command tree is built inside one `Commands::augment_subcommands` frame, and
  # `Cli::try_parse_from` runs close enough to the 2 MiB default thread stack
  # that adding a subcommand (this workflow adds `calibrate`) can overflow it.
  RUST_MIN_STACK: 8388608
  # kache S3 remote (.github/actions/kache). Unset variables keep the GitHub
  # Actions cache. The write token is mapped only on a protected ref, so only
  # pushes to trunk and trunk-dev (and scheduled runs) add to the store.
  AUTUMN_KACHE_S3_BUCKET: ${{ vars.AUTUMN_KACHE_S3_BUCKET }}
  AUTUMN_KACHE_S3_ENDPOINT: ${{ vars.AUTUMN_KACHE_S3_ENDPOINT }}
  AUTUMN_KACHE_S3_REGION: ${{ vars.AUTUMN_KACHE_S3_REGION }}
  AUTUMN_KACHE_S3_READ_ACCESS_KEY_ID: ${{ secrets.AUTUMN_KACHE_S3_READ_ACCESS_KEY_ID }}
  AUTUMN_KACHE_S3_READ_SECRET_ACCESS_KEY: ${{ secrets.AUTUMN_KACHE_S3_READ_SECRET_ACCESS_KEY }}
  AUTUMN_KACHE_S3_WRITE_ACCESS_KEY_ID: ${{ github.ref_protected && secrets.AUTUMN_KACHE_S3_WRITE_ACCESS_KEY_ID || '' }}
  AUTUMN_KACHE_S3_WRITE_SECRET_ACCESS_KEY: ${{ github.ref_protected && secrets.AUTUMN_KACHE_S3_WRITE_SECRET_ACCESS_KEY || '' }}

permissions:
  contents: read

jobs:
  # ── Pure logic (runs on every PR; no build of a target app, no server) ─────
  unit-tests:
    name: Capacity contract unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./.github/actions/kache

      - name: Run capacity contract unit tests
        # `shell: bash` enables `pipefail`, so a failing `cargo test` is not
        # masked by the `tee` in the pipeline.
        shell: bash
        run: |
          cargo test -p autumn-web --lib -- capacity:: 2>&1 | tee web-output.txt
          # NOT `--lib`: autumn-cli is bin-only (`[[bin]] name = "autumn"`, no
          # src/lib.rs), so `--lib` fails with "no library targets found".
          cargo test -p autumn-cli -- capacity:: 2>&1 | tee cli-output.txt
          grep -E "^test result:" web-output.txt cli-output.txt
          # Guard against a stale filter silently matching zero tests.
          for f in web-output.txt cli-output.txt; do
            if ! grep -qE "^test capacity::tests::.* \.\.\. ok" "$f"; then
              echo "::error::No capacity unit tests ran in $f — the filter may be stale."
              exit 1
            fi
          done

      - name: Show `autumn calibrate --help`
        run: |
          cargo build -p autumn-cli
          ./target/debug/autumn calibrate --help

  # ── Live calibrate → check round trip (scheduled / manual only) ────────────
  calibrate:
    name: Calibrate a reference app and gate a rebuild
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    # A release build of the reference app plus the ladder runs.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./.github/actions/kache

      - name: Build CLI
        run: cargo build -p autumn-cli

      - name: Calibrate the reference app
        shell: bash
        run: |
          EXAMPLE="${{ inputs.example || 'examples/hello' }}"
          PKG="$(basename "$EXAMPLE")"
          ./target/debug/autumn calibrate -p "$PKG" --contract capacity.lock
          echo '### Recorded contract' >> "$GITHUB_STEP_SUMMARY"
          echo '```toml' >> "$GITHUB_STEP_SUMMARY"
          cat capacity.lock >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Gate no-op rebuilds (the false-positive probe)
        # The Success Metric asks for zero false positives across repeated
        # no-op rebuilds. Nothing changed between these runs, so every one of
        # them must pass; a failure here means the tolerances are too tight for
        # this runner class, not that the app regressed.
        shell: bash
        run: |
          # `inputs` is empty on the schedule trigger, so the literal fallback
          # below IS the scheduled probe's sample size — it must stay equal to
          # the `workflow_dispatch` default ("20") for `noop_rebuilds`.
          N="${{ inputs.noop_rebuilds || '20' }}"
          for i in $(seq 1 "$N"); do
            echo "── no-op rebuild $i/$N ──"
            PKG="$(basename "${{ inputs.example || 'examples/hello' }}")"
            ./target/debug/autumn calibrate -p "$PKG" --contract capacity.lock --check
          done

      - name: Upload the contract
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capacity-lock
          path: capacity.lock
          if-no-files-found: warn
