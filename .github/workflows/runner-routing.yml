name: runner-routing

# Reusable workflow: decides whether a heavy job runs on the self-hosted
# Hetzner runner set or falls back to GitHub-hosted ubuntu-latest.
#
# Two gates, BOTH must pass to use self-hosted:
#   1. TRUSTED event — a push / workflow_dispatch / schedule (all same-repo by
#      definition), or a pull_request whose HEAD repo == the base repo (a
#      same-repo branch, never a fork). Fork PRs are NEVER trusted, so arbitrary
#      fork code can never land on the self-hosted box. (autumn is public.)
#   2. OPT-IN — the repo variable AUTUMN_SELF_HOSTED_HEAVY == "1". Unsetting or
#      changing it instantly reverts every heavy lane to ubuntu-latest (the
#      one-switch fallback when the box is down or being rebuilt).
on:
  workflow_call:
    outputs:
      heavy_runs_on:
        description: "JSON runs-on value for heavy trusted lanes."
        value: ${{ jobs.pick.outputs.heavy_runs_on }}

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      heavy_runs_on: ${{ steps.pick.outputs.heavy_runs_on }}
    steps:
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          OPT_IN: ${{ vars.AUTUMN_SELF_HOSTED_HEAVY }}
        run: |
          set -euo pipefail
          trusted=false
          if [ "$EVENT_NAME" != "pull_request" ]; then
            trusted=true            # push / workflow_dispatch / schedule are same-repo
          elif [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            trusted=true            # same-repo PR branch (never a fork)
          fi
          if [ "$trusted" = true ] && [ "${OPT_IN:-}" = "1" ]; then
            echo 'heavy_runs_on=["self-hosted","hetzner","linux","x64"]' >> "$GITHUB_OUTPUT"
          else
            echo 'heavy_runs_on=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi
