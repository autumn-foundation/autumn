# Companion cargo-deny config for the SQLite backend graph (issue #2040 / #1600).
#
# The main deny.toml scans the default + Postgres + additive-feature graph; the
# sqlite and postgres backends are mutually exclusive, so this second config
# scans the `autumn-web/sqlite` graph. CI runs BOTH:
#   cargo deny check advisories licenses sources
#   cargo deny --config deny-sqlite.toml check advisories licenses sources
#
# KEEP [advisories].ignore, [licenses].allow, and [sources] IN SYNC with
# deny.toml — only the [graph] features and the unused-ignored-advisory knob
# below intentionally differ. See CONTRIBUTING.md and deny.toml's header for how
# to triage a failing check.

[graph]
# The SQLite backend graph: default features + autumn-web/sqlite. NOT
# managed-pg (it does not compile with sqlite), and NOT --all-features. Default
# features keep `postgres` on, so this graph is a superset of a SQLite-only app
# (#2605). Purpose: catch any dependency reachable only from the sqlite backend
# (the `SQLite runtime` CI job builds it).
all-features = false
no-default-features = false
features = ["autumn-web/sqlite"]

[advisories]
# RustSec advisory database. Cover the ENTIRE resolved dependency graph
# (transitive included), not just direct/workspace crates: vulnerabilities are
# always denied, and unmaintained + unsound are set explicitly to "all" rather
# than relying on cargo-deny's version-dependent default scope, so no advisory
# anywhere in the tree can slip past this gate. Yanked crates stay at the
# default `warn` (currently chacha20 0.10.1, transitive) — tracked but
# non-blocking.
# The RUSTSEC-2024-0384 (instant) ignore enters only via managed-pg-bundled,
# which is not in the sqlite graph, so it is legitimately unused here — don't
# warn on it (the shared ignore list is kept identical to deny.toml on purpose).
unused-ignored-advisory = "allow"
unmaintained = "all"
unsound = "all"
yanked = "warn"
ignore = [
    # RUSTSEC-2023-0071 — rsa 0.9.x "Marvin Attack" timing sidechannel. Kept
    # identical to deny.toml on purpose; full rationale lives there. Short
    # version: no patched rsa release exists, and the only two call sites in
    # the tree (jsonwebtoken's RSA-JWT verify and inbound_mail.rs's direct
    # SES/SNS signature verify) are both public-key verify only — no RSA
    # private-key operation exists anywhere, so there is no private-key timing
    # oracle for the Marvin Attack to exploit. Tracked by issue #1600.
    # Review-by: 2026-12-02 (reconfirmed unchanged 2026-11-02).
    { id = "RUSTSEC-2023-0071", reason = "no fixed rsa release; verify-only in both call sites (jsonwebtoken RSA-JWT + inbound_mail.rs SES/SNS signature check), no RSA private-key op anywhere in the tree; tracked in #1600; reconfirmed unchanged 2026-11-02; review-by 2026-12-02" },
    # RUSTSEC-2024-0384 — instant unmaintained. Build-time, transitive, and only
    # pulled in by the managed-pg-bundled feature scanned above:
    # instant -> parking_lot -> reqwest-retry -> postgresql_archive ->
    # (build) postgresql_embedded -> autumn-web. Not a runtime vulnerability and no
    # safe upgrade (author recommends web-time). Checked 2026-11-02: latest
    # postgresql_embedded is 0.20.1, needing rustc 1.94.0 — above this
    # workspace's 1.88.0 MSRV; the gap widened, it did not close.
    # Review-by: 2026-12-02 (reconfirmed unchanged 2026-11-02).
    { id = "RUSTSEC-2024-0384", reason = "instant unmaintained; build-time transitive via postgresql_embedded (managed-pg-bundled feature); no safe upgrade; latest postgresql_embedded 0.20.1 needs rustc 1.94.0, workspace MSRV is 1.88.0; reconfirmed unchanged 2026-11-02; review-by 2026-12-02" },
    # RUSTSEC-2026-0253 — `lru`'s `LruCache::pop()` is not panic-safe. Kept
    # identical to deny.toml on purpose (see the note above the ignore list);
    # the full rationale lives there. Short version: the workspace's own `lru` is
    # FIXED at 0.18.2, and this covers only lru 0.16.4 reached through
    # aws-sdk-s3 1.122, which is MSRV-pinned and has no patched 0.16.x to move
    # to. Its sole `lru` use is the S3 Express identity cache, whose keys are
    # `CacheKey(String)` (no panicking `Drop`) and which never calls `pop()`, so
    # neither precondition for the UB holds. Checked 2026-11-02: aws-sdk-s3
    # only moves its `lru` requirement to `>=0.18.2` at 1.144.0, which needs
    # rustc 1.94.1 — the same floor 1.138.0+ already needed, not a lower one.
    # Review-by: 2026-12-02 (reconfirmed unchanged 2026-11-02).
    { id = "RUSTSEC-2026-0253", reason = "lru 0.16.4 only, via MSRV-pinned aws-sdk-s3 1.122 (workspace's own lru is fixed at 0.18.2); S3 Express cache keys are String and pop() is never called, so neither UB precondition holds; aws-sdk-s3 only moves lru to >=0.18.2 at 1.144.0, which needs rustc 1.94.1, above the 1.88.0 MSRV; reconfirmed unchanged 2026-11-02; review-by 2026-12-02" },
    # RUSTSEC-2026-0387 — crypto-bigint secret-dependent branches in nominally
    # constant-time operations. Fixed only in >=0.7.6; no 0.4.x/0.5.x release
    # carries it. Two copies: 0.4.9 via aws-sigv4 -> p256 0.11 (SigV4a ECDSA
    # signing, which Autumn does not use; it signs with HMAC SigV4), and 0.5.5
    # via elliptic-curve 0.13 <- p256/p384 <- jsonwebtoken (ES256/ES384 JWT) and
    # aws-sigv4. The jsonwebtoken copy IS on autumn-web's JWT path, so this is a
    # real if low-practicality exposure (microarchitectural timing on ECDSA
    # secrets; no network-reachable signing oracle). Remediation needs the
    # RustCrypto elliptic-curve stack to move to crypto-bigint >=0.7.6.
    # Review-by: 2026-11-08.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.4.9/0.5.5 only, via aws-sigv4 (SigV4a ECDSA path, unused by Autumn HMAC SigV4) and jsonwebtoken ES256/ES384 -> p256/p384 -> elliptic-curve 0.13; no patched 0.4.x/0.5.x; review-by 2026-11-08" },
]

[licenses]
# The initial tree is entirely permissive (plus weak, file-level MPL-2.0). This
# allow-list is BLOCKING: a dependency introducing an unlisted license fails CI.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "MIT-0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "PostgreSQL",
    # MPL-2.0 is weak, file-level copyleft (the cssparser/selectors stack). It
    # imposes obligations only on modifications to those upstream files, none on
    # Autumn's own source, so it is deliberately allowed.
    "MPL-2.0",
]
confidence-threshold = 0.8
# Gate dev- and build-dependency licenses too (both default false for the
# licenses check; advisories/sources already include dev+build deps). CI's
# `cargo test --workspace` compiles dev-dependencies, so their licenses are in
# scope for this gate.
include-dev = true
include-build = true

[licenses.private]
# The workspace's own example/benchmark crates carry no `license` field; do not
# fail the gate on first-party unpublished crates.
ignore = true

[bans]
# NOT run in CI. Duplicate versions are pervasive and cosmetic in this tree
# (RustCrypto old/new, windows-sys target shims), so keep them at `warn` for
# local `cargo deny check bans` runs rather than fighting the tree.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# All dependencies come from crates.io; there are no git sources. BLOCKING.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
