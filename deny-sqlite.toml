# Companion cargo-deny config for the SQLite backend graph (issue #2040 / #1600).
#
# The main deny.toml scans the default + Postgres + additive-feature graph; the
# sqlite and postgres backends are mutually exclusive, so this second config
# scans the `autumn-web/sqlite` graph. CI runs BOTH:
#   cargo deny check advisories licenses sources
#   cargo deny --config deny-sqlite.toml check advisories licenses sources
#
# KEEP [advisories].ignore, [licenses].allow, and [sources] IN SYNC with
# deny.toml. Only the [graph] features differ. (The sqlite graph does not turn on
# `webauthn`, so the rsa 0.10 text below does not apply to it; it stays to keep
# the two lists the same.) See CONTRIBUTING.md and deny.toml's header for how
# to triage a failing check.

[graph]
# The SQLite backend graph: default features + autumn-web/sqlite. NOT
# managed-pg (it does not compile with sqlite), and NOT --all-features. Default
# features keep `postgres` on, so this graph is a superset of a SQLite-only app
# (#2605). Purpose: catch any dependency reachable only from the sqlite backend
# (the `SQLite runtime` CI job builds it).
all-features = false
no-default-features = false
features = ["autumn-web/sqlite"]

[advisories]
# RustSec advisory database. Cover the ENTIRE resolved dependency graph
# (transitive included), not just direct/workspace crates: vulnerabilities are
# always denied, and unmaintained + unsound are set explicitly to "all" rather
# than relying on cargo-deny's version-dependent default scope, so no advisory
# anywhere in the tree can slip past this gate. Yanked crates stay at the
# default `warn` (currently chacha20 0.10.1, transitive) — tracked but
# non-blocking.
unmaintained = "all"
unsound = "all"
yanked = "warn"
ignore = [
    # RUSTSEC-2023-0071 — rsa 0.9.x "Marvin Attack" timing sidechannel.
    # rsa 0.10.0 (final) shipped the fix 2026-11, but nothing here can take
    # it yet: jsonwebtoken 11.1.0 (latest) still pins rsa ^0.9, and
    # webauthn-rs 0.6's crypto-glue pins rsa "^0.10.0-rc.18" — final 0.10.0
    # made rsa's `sha2` feature non-optional, which that requirement can't
    # resolve against, so bumping autumn-web's own direct `rsa` dependency
    # (the `inbound-ses` SNS check) doesn't dedup onto it either (rehearsed
    # 2026-11-09: Cargo fails to unify the two `rsa` requirements).
    # Reachability: every RSA use in this codebase is public-key *verify*
    # only — autumn/src/inbound_mail.rs's SNS signing-cert check
    # (`inbound-ses`, opt-in) and autumn/src/auth.rs's JWKS RS*/PS*
    # verification (`jwt`, default-on). No `EncodingKey::from_rsa*` exists
    # outside one test fixture. The Marvin Attack leaks a private key
    # through its own timing; with no RSA private key ever in use here, it
    # does not apply regardless of which rsa version is in the graph.
    # Tracked by issue #1600. Review-by: 2026-12-05 (reconfirmed unreachable
    # 2026-11-09; revisit when crypto-glue/webauthn-rs or jsonwebtoken
    # accepts rsa 0.10.0 final).
    { id = "RUSTSEC-2023-0071", reason = "verify-only in this codebase (SNS cert check inbound_mail.rs, JWKS verify auth.rs); no RSA private-key signing anywhere; rsa 0.10.0 final now ships the fix but jsonwebtoken (^0.9) and crypto-glue/webauthn-rs (^0.10.0-rc.18, sha2-feature conflict with final 0.10.0) both block taking it; tracked in #1600; reconfirmed unreachable 2026-11-09; review-by 2026-12-05" },
    # RUSTSEC-2026-0387 — crypto-bigint secret-dependent branches in nominally
    # constant-time operations. Fixed only in >=0.7.6; no 0.5.x release carries
    # it. One copy is left: 0.5.5 via elliptic-curve 0.13 <- p256/p384 0.13 <-
    # jsonwebtoken (ES256/ES384 JWT). That is a real if low-practicality exposure
    # (microarchitectural timing on ECDSA secrets; no network-reachable signing
    # oracle). Autumn's own p256 (Web Push) and aws-sigv4 use 0.7.10. Remove
    # when jsonwebtoken moves to p256 0.14. Reconfirmed unchanged 2026-11-09
    # (jsonwebtoken still at latest 11.1.0, still on p256/p384 0.13).
    # Review-by: 2026-11-23.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 only, via jsonwebtoken ES256/ES384 -> p256/p384 0.13 -> elliptic-curve 0.13; no patched 0.5.x; reconfirmed unchanged 2026-11-09 (jsonwebtoken still latest at 11.1.0); review-by 2026-11-23" },
    # RUSTSEC-2026-0440 — astral-tokio-tar is unmaintained. Dev and
    # test only: testcontainers 0.27 and 0.28 depend on it, for the Docker
    # tests and the `test-support` feature. No testcontainers release drops
    # it. Remove when one ships. Review-by: 2026-12-05.
    { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar unmaintained; only via testcontainers (Docker tests, `test-support`); testcontainers 0.28 still uses it; review-by 2026-12-05" },
    # RUSTSEC-2026-0441 — pin-utils is unmaintained. It comes from
    # loom 0.7.2 (the `cfg(loom_models)` model checks only) and from
    # wasmtimer 0.4.3 (wasm32 only, under reqwest-retry). Neither has a
    # release without it. Review-by: 2026-12-05.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils unmaintained; via loom 0.7.2 (cfg(loom_models) only) and wasmtimer 0.4.3 (wasm32 only); no release drops it; review-by 2026-12-05" },
]

[licenses]
# The initial tree is entirely permissive (plus weak, file-level MPL-2.0). This
# allow-list is BLOCKING: a dependency introducing an unlisted license fails CI.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "MIT-0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "PostgreSQL",
    # MPL-2.0 is weak, file-level copyleft (the cssparser/selectors stack). It
    # imposes obligations only on modifications to those upstream files, none on
    # Autumn's own source, so it is deliberately allowed.
    "MPL-2.0",
]
confidence-threshold = 0.8
# Gate dev- and build-dependency licenses too (both default false for the
# licenses check; advisories/sources already include dev+build deps). CI's
# `cargo test --workspace` compiles dev-dependencies, so their licenses are in
# scope for this gate.
include-dev = true
include-build = true

[licenses.private]
# The workspace's own example/benchmark crates carry no `license` field; do not
# fail the gate on first-party unpublished crates.
ignore = true

[bans]
# NOT run in CI. Duplicate versions are pervasive and cosmetic in this tree
# (RustCrypto old/new, windows-sys target shims), so keep them at `warn` for
# local `cargo deny check bans` runs rather than fighting the tree.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# All dependencies come from crates.io; there are no git sources. BLOCKING.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
