[package]
name = "autumn-macros-support"
description = "Shared implementation helpers for Autumn's proc-macro crates (not a proc-macro crate itself)"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/autumn-foundation/autumn"
readme = "../README.md"
keywords = ["web", "composable", "axum", "htmx", "fullstack"]
categories = ["web-programming", "web-programming::http-server"]

[dependencies]
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
proc-macro-crate.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Pinned to match the exact version every other crate in this workspace
# already depends on (autumn, autumn-cli), so Cargo resolves one shared copy.
temp-env = "0.3.6"
